<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이오 병원 — 미래 의료 기술 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --base:#0E2A3B; --base2:#0A2030; --panel:#143A50; --panel2:#1B4862; --line:#2B5F7C;
  --text:#EAF6F4; --sub:#A9C9CF; --dim:#6F95A0;
  --green:#2EC4A0; --amber:#FFB547; --warn:#FF6B6B;
  --c-organ:#FF7A8A; --c-tech:#3FC8F0; --c-synth:#FFB547; --c-bio:#5BE08F; --c-final:#B69CFF;
  --r1:6px; --r2:12px; --r3:20px;
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --display:"Black Han Sans","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--base2);color:var(--text);font-size:16px;line-height:1.55;
  -webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- 상단 바 ---------- */
#topbar{height:62px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--base);
  border-bottom:1px solid var(--line);position:relative;z-index:5}
#topbar .logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
#topbar .logo .cross{width:34px;height:34px;border-radius:8px;background:var(--green);display:grid;place-items:center}
#topbar .logo b{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.5px}
#prog{flex:1;display:flex;align-items:center;gap:12px;min-width:120px}
#prog .bar{flex:1;height:10px;border-radius:10px;background:var(--panel);overflow:hidden;max-width:420px}
#prog .fill{height:100%;background:linear-gradient(90deg,var(--c-organ),var(--c-tech),var(--c-synth),var(--c-bio),var(--c-final));
  border-radius:10px;transition:width .6s}
#prog .pct{font-weight:700;min-width:120px;color:var(--sub);font-size:14px}
.tbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:var(--r1);font-size:14px}
.tbtn:hover{background:var(--panel2)}

#app{height:calc(100% - 62px);overflow:auto;position:relative}

/* ---------- 공통 ---------- */
.btn{border:none;border-radius:var(--r1);padding:11px 20px;font-weight:700;background:var(--green);color:#06261E;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.amber{background:var(--amber);color:#3A2400}
.btn.small{padding:7px 13px;font-size:14px}
.muted{color:var(--sub)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:13px;font-weight:700;background:var(--panel2);color:var(--sub)}
.tag.ok{background:rgba(46,196,160,.18);color:var(--green)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- 층별 안내 (허브) ---------- */
.hub{max-width:1100px;margin:0 auto;padding:30px 24px 50px;display:grid;grid-template-columns:330px 1fr;gap:34px;align-items:start}
.hub-intro h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:1.12;margin:6px 0 14px;letter-spacing:.5px}
.hub-intro p{color:var(--sub);margin:0 0 14px}
.hub-intro .how{background:var(--panel);border-radius:var(--r2);padding:16px 18px;font-size:15px}
.hub-intro .how li{margin:4px 0}
.hub-intro .notice{font-size:13px;color:var(--dim);margin-top:14px}
.directory{background:var(--base);border:2px solid var(--line);border-radius:var(--r3);overflow:hidden}
.directory .dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:var(--panel);border-bottom:2px solid var(--line)}
.directory .dhead b{font-family:var(--display);font-weight:400;font-size:22px}
.floor{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:18px;padding:18px 22px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .2s;position:relative}
.floor:last-child{border-bottom:none}
.floor:hover{background:var(--panel)}
.floor .fl{font-family:var(--display);font-size:40px;line-height:1;color:var(--fc)}
.floor .fl small{display:block;font-family:var(--font);font-size:12px;color:var(--dim);font-weight:500;margin-top:4px}
.floor h3{margin:0;font-size:21px}
.floor .fdesc{color:var(--sub);font-size:14px;margin-top:2px}
.floor .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.floor .chip{font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--sub)}
.floor .chip.done{border-color:var(--fc);color:var(--fc)}
.floor .fstate{text-align:right;min-width:92px}
.floor .fstate .num{font-size:22px;font-weight:700;color:var(--fc)}
.floor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--fc)}
.floor.locked{cursor:not-allowed;opacity:.6}
.floor.locked:hover{background:transparent}

/* ---------- 센터 레이아웃 ---------- */
.center{display:grid;grid-template-columns:260px 1fr;height:100%}
.side{background:var(--base);border-right:1px solid var(--line);padding:18px 14px;overflow:auto}
.side .back{margin-bottom:14px}
.side h2{font-family:var(--display);font-weight:400;font-size:24px;margin:4px 6px 4px;color:var(--cc)}
.side .sdesc{font-size:13px;color:var(--sub);margin:0 6px 14px}
.side .alist{display:flex;flex-direction:column;gap:6px}
.aitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r1);background:transparent;border:1px solid transparent;
  color:var(--text);text-align:left;width:100%}
.aitem:hover{background:var(--panel)}
.aitem.cur{background:var(--panel);border-color:var(--cc)}
.aitem .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.aitem.done .ck{background:var(--cc);border-color:var(--cc);color:#08202A;font-weight:700}
.aitem .at{font-size:15px;line-height:1.3}
.notes{margin-top:18px;padding:14px;border-radius:var(--r2);background:var(--panel);font-size:13px}
.notes b{display:block;margin-bottom:6px;color:var(--cc);font-size:14px}
.notes ol{margin:0;padding-left:18px}
.notes li{margin:3px 0;color:var(--dim)}
.notes li.got{color:var(--text)}
.notes .caveat{margin-top:8px;color:var(--sub);font-size:12px;border-top:1px dashed var(--line);padding-top:8px}
.main{overflow:auto;padding:22px 28px 60px}
.act-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:14px}
.act-head h2{margin:0;font-size:28px;font-family:var(--display);font-weight:400;letter-spacing:.3px}
.act-head .goal{margin:6px 0 0;color:var(--sub);max-width:780px}
.stage{background:var(--base);border:1px solid var(--line);border-radius:var(--r2);padding:18px;position:relative;min-height:300px}
.phase-dots{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.phase-dots .pd{padding:4px 12px;border-radius:20px;background:var(--panel);font-size:13px;color:var(--dim)}
.phase-dots .pd.cur{background:var(--cc);color:#08202A;font-weight:700}
.phase-dots .pd.ok{color:var(--cc)}
.ph-title{font-size:19px;font-weight:700;margin:0 0 4px}
.ph-desc{color:var(--sub);margin:0 0 14px;font-size:15px}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1;min-width:260px}
.explain{background:var(--panel);border-left:4px solid var(--cc);border-radius:var(--r1);padding:12px 16px;margin-top:14px;font-size:15px}
.explain b{color:var(--cc)}
svg text{font-family:var(--font)}
canvas{display:block;max-width:100%;border-radius:var(--r1)}

/* 학습 카드 */
.info{margin-top:20px;border:2px solid var(--cc);border-radius:var(--r2);overflow:hidden}
.info .ih{background:var(--cc);color:#08202A;padding:10px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.info .ib{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line)}
.info .ib > div{background:var(--panel);padding:14px 16px;font-size:15px}
.info .ib h4{margin:0 0 6px;color:var(--cc);font-size:15px}
.info .ib p{margin:0}
.info .ifoot{background:var(--base);padding:12px 18px;display:flex;justify-content:flex-end;gap:10px}

/* 드래그 카드 */
.dcard{padding:9px 14px;border-radius:var(--r1);background:var(--panel2);border:1px solid var(--line);cursor:grab;font-size:15px;
  touch-action:none;line-height:1.35;transition:background .2s}
.dcard:hover{background:#235673}
.dcard.dragging{opacity:.3}
.dcard.locked{cursor:default;background:rgba(46,196,160,.16);border-color:var(--green)}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sort .pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:var(--r2);min-height:56px;margin-top:14px}
.sort .pool:empty::after{content:"모든 카드를 옮겼어요!";color:var(--green);font-weight:700}
.sort .bins{display:grid;gap:12px}
.bin{border:2px dashed var(--line);border-radius:var(--r2);padding:10px;min-height:120px;transition:border-color .2s,background .2s}
.bin.over{border-color:var(--cc);background:rgba(255,255,255,.04)}
.bin .bh{font-weight:700;font-size:16px;margin-bottom:2px}
.bin .bs{font-size:13px;color:var(--sub);margin-bottom:8px}
.bin .bb{display:flex;flex-direction:column;gap:6px}
.bin.slot{min-height:84px;display:flex;flex-direction:column}
.bin.filled{border-style:solid;border-color:var(--green)}

/* 순서 버튼 */
.order .opool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ostep{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:var(--r1);font-size:15px}
.ostep:hover{background:#235673}
.order .odone{display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;gap:10px;align-items:center;background:rgba(46,196,160,.12);border:1px solid var(--green);border-radius:var(--r1);padding:8px 12px}
.oitem .n{width:26px;height:26px;border-radius:50%;background:var(--green);color:#06261E;display:grid;place-items:center;font-weight:700;flex-shrink:0}

/* 슬라이더 */
.ctrl{background:var(--panel);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px}
.ctrl label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.ctrl label b{color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--cc);cursor:pointer;height:22px}

.meter{height:14px;border-radius:10px;background:var(--base2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--green);transition:width .2s}
.meter.warnm i{background:var(--warn)}

/* 토스트 */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:1000;
  align-items:center;pointer-events:none;width:min(680px,92vw)}
.toast{background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:var(--r2);font-size:15px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s;max-width:100%}
.toast.ok{border-color:var(--green);background:#134a43}
.toast.hint{border-color:var(--amber);background:#4a3a14}
.toast.bad{border-color:var(--warn);background:#4d2026}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(5,15,25,.75);display:grid;place-items:center;z-index:900}
.modal{background:var(--base);border:2px solid var(--line);border-radius:var(--r3);padding:26px 28px;max-width:560px;width:92vw}
.modal h3{margin:0 0 10px;font-size:22px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* 센터 완료 */
.complete-banner{margin-top:16px;padding:16px 20px;border-radius:var(--r2);background:var(--cc);color:#08202A;font-weight:700;display:flex;
  justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

/* 최종 진료 */
.ward{max-width:1150px;margin:0 auto;padding:24px}
.ward h1{font-family:var(--display);font-weight:400;font-size:36px;margin:0 0 4px;color:var(--c-final)}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.bed{background:var(--base);border:1px solid var(--line);border-radius:var(--r2);padding:16px;cursor:pointer;text-align:left;color:var(--text);
  display:flex;gap:14px;align-items:center}
.bed:hover{border-color:var(--c-final)}
.bed.done{border-color:var(--green)}
.bed .face{width:58px;height:58px;flex-shrink:0}
.bed h4{margin:0;font-size:16px}
.bed p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.steps6{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.steps6 span{flex:1;min-width:100px;text-align:center;padding:6px 4px;border-radius:var(--r1);background:var(--panel);font-size:13px;color:var(--dim)}
.steps6 span.cur{background:var(--c-final);color:#1d1240;font-weight:700}
.steps6 span.ok{color:var(--c-final)}
.chart{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.exam{display:flex;flex-direction:column;gap:8px}
.exam button{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:var(--r1)}
.exam button.seen{border-color:var(--c-final)}
.exam button .res{display:block;color:var(--sub);font-size:14px;margin-top:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{background:var(--panel);border:2px solid var(--line);color:var(--text);padding:14px;border-radius:var(--r2);text-align:left;font-size:15px}
.choice:hover{border-color:var(--c-final)}
.choice b{display:block;font-size:17px;margin-bottom:3px}
.choice.wrong{border-color:var(--warn);opacity:.55}
.choice.right{border-color:var(--green);background:rgba(46,196,160,.15)}
.cert{max-width:820px;margin:20px auto;border:3px double var(--c-final);border-radius:var(--r3);padding:30px 36px;background:var(--base)}
.cert h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0;color:var(--c-final);text-align:center}
.cert input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:var(--r1);font-size:18px;width:200px;user-select:text}

@media (max-width:900px){
  .hub{grid-template-columns:1fr}
  .center{grid-template-columns:1fr;height:auto}
  .side{border-right:none;border-bottom:1px solid var(--line)}
  .chart{grid-template-columns:1fr}
  #prog .pct{display:none}
}
/* ---------- 3D 병원 ---------- */
.h3d{position:relative;height:100%;overflow:hidden;background:#0A2030}
.c3d{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:0;cursor:grab;touch-action:none}
.p3d{position:absolute;left:20px;top:20px;width:320px;max-height:calc(100% - 40px);overflow:auto;background:rgba(14,42,59,.9);
  border:1px solid var(--line);border-radius:var(--r3);padding:18px 18px 14px;backdrop-filter:blur(6px)}
.p3d h1{font-family:var(--display);font-weight:400;font-size:34px;margin:6px 0 6px;letter-spacing:.5px}
.p3d p{color:var(--sub);font-size:14px;margin:0 0 12px}
.flist{display:flex;flex-direction:column;gap:5px}
.frow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r1);
  background:var(--base);border:1px solid var(--line);border-left:5px solid var(--fc);color:var(--text);text-align:left}
.frow:hover{background:var(--panel2)}
.frow .ftag{font-family:var(--display);font-size:20px;color:var(--fc)}
.frow .fname{font-size:14px;line-height:1.25}
.frow .fprog{font-size:12px;color:var(--sub);white-space:nowrap}
.frow.lk{opacity:.6}
.frow.here{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--fc)}
.foot3d{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:12px;color:var(--dim)}
.linkb{background:none;border:none;color:var(--sub);text-decoration:underline;padding:0;font-size:13px;text-align:left}
.tip3d{position:absolute;display:none;pointer-events:none;background:rgba(5,15,25,.92);border:1px solid var(--line);border-radius:var(--r1);
  padding:8px 12px;font-size:14px;z-index:3;white-space:nowrap}
.fade3d{position:absolute;inset:0;background:#02080c;opacity:0;pointer-events:none;transition:opacity .4s}
@media (max-width:900px){.p3d{width:auto;right:12px;left:12px;top:auto;bottom:12px;max-height:46%}}

/* 2F 세포 기반 인공 장기: 배양실 시각 개선 (기존 게임 로직 유지) */
.biolab-row{gap:20px;align-items:stretch}
.bio-vessel-wrap{flex:1 1 480px;min-width:300px;max-width:600px;background:radial-gradient(ellipse at 50% 42%,#174e79 0%,#0b263f 62%,#081b2d 100%);border:1px solid #2d698d;border-radius:18px;padding:12px 10px 8px;box-shadow:inset 0 0 35px #041523,0 12px 24px #04121b66}
.bio-vessel-wrap svg{display:block;max-height:490px}
.bio-vessel-caption{text-align:center;color:#9bd9ed;font-size:13px;margin:-6px 0 6px}
.bio-material-panel{min-width:250px;flex:1 1 280px}
.bio-material-title{font-weight:700;font-size:19px;margin:0 0 10px;color:#e7f8ff}
.bio-material-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px!important}
.bio-material{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:112px;padding:10px 6px!important;border-radius:14px!important;background:linear-gradient(145deg,#204e70,#12334c)!important;border:1px solid #4383a2!important;text-align:center;font-weight:700;font-size:13px!important;box-shadow:inset 0 1px #ffffff16,0 5px 12px #03121a55;transition:transform .15s,border-color .15s!important}
.bio-material:first-child{border-color:#53e5ac!important}
.bio-material:hover{transform:translateY(-3px);border-color:#a8e9ff!important}
.bio-material svg{width:66px;height:59px;flex-shrink:0;pointer-events:none;filter:drop-shadow(0 4px 5px #0005)}
.bio-material span{pointer-events:none;line-height:1.3}
.bio-material.locked{border-color:#35cda6!important;opacity:.65}
.bio-progress{margin-top:16px;padding:13px;background:#123950;border:1px solid #327c96;border-radius:13px;font-weight:700}
.bio-progress b{font-size:23px;color:#ff839c}
.bio-seed-dots{display:flex;gap:7px;margin-top:10px;justify-content:space-between}
.bio-seed-dots i{width:23px;height:23px;border:2px dashed #8fbad0;border-radius:50%;background:#092538;transition:background .25s,box-shadow .25s}
.bio-seed-dots i.on{background:radial-gradient(circle at 30% 25%,#fff,#df9cff 40%,#9655d6 85%);border:2px solid #efc7ff;box-shadow:0 0 12px #b87cff99}
.scaf [data-drop^="pore"]{cursor:crosshair}
.scaf [data-drop^="pore"]:hover{filter:drop-shadow(0 0 5px #f0c4ff)}
@media(max-width:650px){.bio-material-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bio-vessel-wrap{min-width:0;flex-basis:100%}}
<style>.bio-material.drag-ghost{min-height:0!important;gap:0!important;box-shadow:0 5px 18px #0009!important}.bio-material.drag-ghost svg{width:42px!important;height:40px!important}.bio-material.drag-ghost span{display:none!important}.bio-material-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}</style>
</style>
<style>
/* 4F 바이오 의약품 연구소 — 시각 개선 */
.bio-process-wrap .process .choice{background:linear-gradient(155deg,#1b4965,#102e43);border:1px solid #377b9b;border-radius:16px;box-shadow:inset 0 1px 0 #ffffff16,0 8px 20px #00000018;transition:transform .18s,border-color .18s}
.bio-process-wrap .process .choice:not(:disabled):hover{transform:translateY(-3px);border-color:#65d7ef}
</style>
<style id="bp-purification-enhancement">
.bp-purify{padding:18px;background:#14394f;border:1px solid #3b7992;border-radius:16px;max-width:920px}
.bp-purify h3{margin:0 0 8px}.bp-purify p{margin:0 0 14px;line-height:1.65}
.bp-purify-visual{background:#082536;border-radius:14px;overflow:hidden}
.bp-purify-svg{display:block;width:100%;height:auto;max-height:390px}
.bp-purify-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.bp-purify-explain{margin-top:14px;background:#0e2e42;border-left:4px solid #4fd5bb;border-radius:8px;padding:13px;line-height:1.7}
.bp-purify-svg .bpp-source,.bp-purify-svg .bpp-filter-target{outline:none}
.bp-purify-svg .bpp-source:hover rect:first-child,.bp-purify-svg .bpp-filter-target:hover rect:first-child{stroke:#56f0c8}
.bp-purify-svg .bpp-source.bpp-selected rect:first-child{stroke:#56f0c8;stroke-width:8}
.bp-purify-svg .bpp-flow,.bp-purify-svg .bpp-output-flow{opacity:.28}
.bp-purify.bpp-purifying .bpp-flow,.bp-purify.bpp-purifying .bpp-output-flow{opacity:1;animation:bpp-flow 0.65s linear infinite}
.bp-purify.bpp-purifying .bpp-source-particles{animation:bpp-fade 1.5s ease forwards}
.bp-purify.bpp-separated .bpp-trapped,.bp-purify.bpp-separated .bpp-waste,.bp-purify.bpp-separated .bpp-product-particles{opacity:1;transition:opacity .5s}
.bp-purify.bpp-separated .bpp-product-liquid{height:46px;y:218px;transition:height .5s}
.bp-purify.bpp-separated .bpp-source-particles{opacity:0}
.bp-purify.bpp-separated .bpp-flow,.bp-purify.bpp-separated .bpp-output-flow{opacity:.8}
@keyframes bpp-flow{to{stroke-dashoffset:-25}}@keyframes bpp-fade{to{opacity:.08}}
</style>
</head>

<script>
/* =========================================================

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function sv(tag, attrs = {}, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- 정리(cleanup) 관리 : 화면을 떠나면 애니메이션·타이머 정지 ---------- */
let cleanups = [];
function addCleanup(f) { cleanups.push(f); }
function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) { } }); cleanups = []; }
function loop(fn) {
  let alive = true, last = performance.now();
  function f(t) { if (!alive) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; fn(dt, t); requestAnimationFrame(f); }
  requestAnimationFrame(f); addCleanup(() => alive = false); return () => alive = false;
}
function later(fn, ms) { const id = setTimeout(fn, ms); addCleanup(() => clearTimeout(id)); return id; }

function onDoc(type, fn, opt) { document.addEventListener(type, fn, opt); addCleanup(() => document.removeEventListener(type, fn, opt)); }

/* ---------- 알림 ---------- */
function toast(msg, type = 'info', ms = 3600) {
  const t = el(`<div class="toast ${type}">${msg}</div>`);
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), ms);
}
const hint = m => toast('💡 ' + m, 'hint', 4500);
const good = m => toast('✔ ' + m, 'ok', 3600);
function modal(title, body, buttons) {
  const bg = el(`<div class="modal-bg"><div class="modal"><h3>${title}</h3><div>${body}</div><div class="mf"></div></div></div>`);
  buttons.forEach(b => { const x = el(`<button class="btn ${b.cls || ''}">${b.label}</button>`); x.onclick = () => { bg.remove(); b.fn && b.fn(); }; $('.mf', bg).appendChild(x); });
  document.body.appendChild(bg);
}
function shakeEl(e) { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }

/* ---------- 상태 저장 (localStorage) ---------- */
const STORE = 'bioHospital_v2';
function loadState() { try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.acts) return s; } catch (e) { } return { acts: {}, pts: {}, name: '' }; }
let S = loadState();
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { } }

/* ---------- 드래그 (마우스·터치 공통 pointer 이벤트) ---------- */
function makeDrag(elm, { onDrop, onMove, ghostScale = 1 } = {}) {
  elm.style.touchAction = 'none';
  elm.addEventListener('pointerdown', e => {
    if (elm.classList.contains('locked') || e.button > 0) return;
    e.preventDefault();
    const r = elm.getBoundingClientRect();
    const ghost = elm.cloneNode(true);
    ghost.classList.add('drag-ghost'); ghost.classList.remove('dragging');
    Object.assign(ghost.style, { width: r.width + 'px', height: r.height + 'px', left: r.left + 'px', top: r.top + 'px', margin: 0 });
    if (ghostScale !== 1) { ghost.style.width = Math.round(r.width * ghostScale) + 'px'; ghost.style.height = Math.round(r.height * ghostScale) + 'px'; ghost.style.minHeight = '0'; ghost.style.padding = '3px'; ghost.style.overflow = 'hidden'; ghost.style.pointerEvents = 'none'; ghost.style.zIndex = '99999'; }

    const ox = ghostScale === 1 ? e.clientX - r.left : Math.round(r.width * ghostScale / 2), oy = ghostScale === 1 ? e.clientY - r.top : Math.round(r.height * ghostScale / 2);
    if (ghostScale !== 1) { ghost.style.left = (e.clientX - ox) + 'px'; ghost.style.top = (e.clientY - oy) + 'px'; }
    elm.classList.add('dragging');
    let over = null;
    const mv = ev => {
      ghost.style.left = (ev.clientX - ox) + 'px'; ghost.style.top = (ev.clientY - oy) + 'px';
      const t = document.elementFromPoint(ev.clientX, ev.clientY);
      const z = t && t.closest('[data-drop]');
      if (over !== z) { over && over.classList.remove('over'); over = z; over && over.classList.add('over'); }
      onMove && onMove(ev, over);
    };
    const up = ev => {
      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
      ghost.remove(); elm.classList.remove('dragging'); over && over.classList.remove('over');
      onDrop && onDrop(over, ev);
    };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
  });
}

/* ---------- 분류 게임 : 카드를 알맞은 칸에 끌어다 놓기 ----------
   cards: [{text, bin, why, hint}]  bins: [{id, label, sub}] */
function dragSort(root, { cards, bins, cols, slot = false, onDone, onCorrect }) {
  const w = el(`<div class="sort"><div class="bins"></div><div class="pool"></div></div>`);
  const binsBox = $('.bins', w);
  binsBox.style.gridTemplateColumns = `repeat(${cols || bins.length}, minmax(0,1fr))`;
  bins.forEach(b => binsBox.appendChild(el(`<div class="bin ${slot ? 'slot' : ''}" data-drop="${b.id}"><div class="bh">${b.label}</div>${b.sub ? `<div class="bs">${b.sub}</div>` : ''}<div class="bb"></div></div>`)));
  let left = cards.length;
  shuffle(cards).forEach(c => {
    const d = el(`<div class="dcard">${c.text}</div>`);
    $('.pool', w).appendChild(d);
    makeDrag(d, {
      onDrop(z) {
        if (!z || !binsBox.contains(z)) return;
        if (z.dataset.drop === c.bin) {
          $('.bb', z).appendChild(d); d.classList.add('locked', 'pop');
          if (slot) z.classList.add('filled');
          if (c.why) good(c.why);
          onCorrect && onCorrect(c, z);
          if (--left === 0) later(() => onDone && onDone(), 500);
        } else {
          shakeEl(z); hint(c.hint || '이 칸이 아니에요. 카드의 내용을 다시 읽고 어떤 특징인지 생각해 보세요.');
        }
      }
    });
  });
  root.appendChild(w);
  return w;
}

/* ---------- 순서 맞히기 : 작동 순서대로 클릭 ---------- */
function orderSteps(root, { steps, onDone, onStep }) {
  const w = el(`<div class="order"><div class="odone"></div><div class="opool"></div></div>`);
  let i = 0;
  shuffle(steps.map((s, k) => ({ ...s, k }))).forEach(s => {
    const b = el(s.art ? `<button class="ostep" style="display:flex;flex-direction:column;align-items:center;gap:10px;width:210px;min-height:185px;padding:12px;border-radius:14px;white-space:normal;text-align:center;background:#153a50"><div style="width:100%;height:126px;overflow:hidden;border-radius:10px;background:#0b2332">${s.art}</div><b style="font-size:15px">${s.t}</b></button>` : `<button class="ostep">${s.icon ? s.icon + ' ' : ''}${s.t}</button>`);
    b.onclick = () => {
      if (s.k === i) {
        $('.odone', w).appendChild(el(`<div class="oitem pop"><span class="n">${i + 1}</span><div>${s.icon ? s.icon + ' ' : ''}<b>${s.t}</b>${s.d ? `<div class="muted" style="font-size:14px">${s.d}</div>` : ''}</div></div>`));
        b.remove(); i++;
        onStep && onStep(i, s);
        if (i === steps.length) later(() => onDone && onDone(), 400);
      } else { shakeEl(b); hint(steps[i].hint || `${i + 1}번째로 일어나는 일이 아니에요. 앞 단계가 먼저 끝나야 하는지 생각해 보세요.`); }
    };
    $('.opool', w).appendChild(b);
  });
  root.appendChild(w);
  return w;
}

/* ---------- 부품 연결 : 두 부품을 차례로 클릭해 전선 연결 ----------
   nodes: [{id,x,y,label,icon,color}], need: [[a,b,msg]], bad: {id: hint} */
function wiring(root, { width = 760, height = 360, nodes, need, bad = {}, wrongHint, onDone, title, ordered = false, onStep }) {
  const box = el(`<div></div>`);
  const svg = sv('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', style: `max-width:${width}px;background:#0A2030;border-radius:10px;display:block` });
  box.appendChild(svg);
  const gW = sv('g', {}, svg), gN = sv('g', {}, svg);
  const made = new Set(); let sel = null;
  const key = (a, b) => [a, b].sort().join('|');
  const N = {};

    const g = sv('g', { transform: `translate(${n.x},${n.y})`, style: 'cursor:pointer' }, gN);
    const r = sv('rect', { x: -70, y: -38, width: 140, height: 76, rx: 12, fill: '#143A50', stroke: n.color || '#2B5F7C', 'stroke-width': 2 }, g);
    sv('text', { x: 0, y: -6, 'text-anchor': 'middle', 'font-size': 26 }, g).textContent = n.icon;
    const t = sv('text', { x: 0, y: 24, 'text-anchor': 'middle', 'font-size': 14, fill: '#EAF6F4', 'font-weight': 700 }, g); t.textContent = n.label;
    N[n.id] = { ...n, g, r };
    g.addEventListener('click', () => {
      if (bad[n.id]) { shakeEl(box); hint(bad[n.id]); return; }
      if (!sel) { sel = n.id; r.setAttribute('stroke', '#FFB547'); r.setAttribute('stroke-width', 4); return; }
      const a = sel; sel = null; N[a].r.setAttribute('stroke', N[a].color || '#2B5F7C'); N[a].r.setAttribute('stroke-width', 2);
      if (a === n.id) return;

      const req = need.find(p => key(p[0], p[1]) === k);
      if (!req) { shakeEl(box); hint(wrongHint ? wrongHint(a, n.id) : '이 두 부품은 바로 연결하지 않아요. 신호와 전기가 어디를 거쳐야 하는지 생각해 보세요.'); return; }
      if (made.has(k)) return;
      if (ordered && key(need[made.size][0], need[made.size][1]) !== k) { hint('위 안내에 나온 순서대로 연결해 보세요. 지금은 ' + (made.size + 1) + '단계예요.'); return; }
      made.add(k);
      const A = N[a], B = N[n.id];
      const ln = sv('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, stroke: '#2EC4A0', 'stroke-width': 5, 'stroke-dasharray': '10 6', 'stroke-linecap': 'round' }, gW);
      ln.animate([{ strokeDashoffset: 32 }, { strokeDashoffset: 0 }], { duration: 600, iterations: Infinity });
      if (req[2]) good(req[2]);
      if (onStep) onStep(made.size);
      if (made.size === need.length) later(() => onDone && onDone(), 500);
    });
  });
  root.appendChild(box);
  return { svg, N };
}

/* ---------- 단계 진행 틀 ---------- */
function phases(root, list, onDone) {
  const dots = el(`<div class="phase-dots"></div>`);
  list.forEach((p, i) => dots.appendChild(el(`<span class="pd">${i + 1}. ${p.name}</span>`)));
  const body = el(`<div></div>`);
  root.appendChild(dots); root.appendChild(body);
  let i = 0;
  function go() {
    $$('.pd', dots).forEach((d, k) => { d.className = 'pd' + (k < i ? ' ok' : k === i ? ' cur' : ''); if (k < i) d.textContent = '✓ ' + list[k].name; });
    if (i >= list.length) { onDone && onDone(); return; }
    body.innerHTML = '';
    const p = list[i];
    if (p.title) body.appendChild(el(`<p class="ph-title">${p.title}</p>`));
    if (p.desc) body.appendChild(el(`<p class="ph-desc">${p.desc}</p>`));
    const area = el(`<div></div>`); body.appendChild(area);
    p.run(area, () => { i++; go(); });
  }
  go();
}
function nextBtn(root, label, fn) {
  const b = el(`<button class="btn" style="margin-top:12px;display:block">${label}</button>`);
  b.onclick = () => { b.disabled = true; fn(); };
  root.appendChild(b); return b;
}
function explain(root, html) { const e = el(`<div class="explain pop">${html}</div>`); root.appendChild(e); return e; }

/* ---------- 슬라이더 ---------- */
function slider(root, { label, min, max, step = 1, value, unit = '', fmt, onInput }) {
  const c = el(`<div class="ctrl"><label><span>${label}</span><b></b></label><input type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`);
  const inp = $('input', c), out = $('b', c);
  const show = () => { out.textContent = (fmt ? fmt(+inp.value) : inp.value) + unit; };
  inp.addEventListener('input', () => { show(); onInput && onInput(+inp.value); });
  show(); root.appendChild(c);

const app = () => $('#app');
const centerDone = c => c.acts.every(a => S.acts[a.id]);
const allCentersDone = () => CENTERS.every(centerDone);
const TOTAL_UNITS = () => CENTERS.reduce((n, c) => n + c.acts.length, 0) + PATIENTS.length;

function updateProgress() {
  const n = CENTERS.reduce((s, c) => s + c.acts.filter(a => S.acts[a.id]).length, 0) + PATIENTS.filter(p => S.pts[p.id]).length;
  const pct = Math.round(n / TOTAL_UNITS() * 100);
  $('#prog .fill').style.width = pct + '%';
  $('#prog .pct').textContent = `학습 진행률 ${pct}% (${n}/${TOTAL_UNITS()})`;
}
function completeAct(id) { if (!S.acts[id]) { S.acts[id] = true; save(); } updateProgress(); }

  a.innerHTML = `<div class="hub">

function openCenter(cid, aid) {
  runCleanups();
  const c = CENTERS.find(x => x.id === cid);
  const act = c.acts.find(x => x.id === aid) || c.acts.find(x => !S.acts[x.id]) || c.acts[0];
  const a = app(); a.scrollTop = 0;
  const backTo = () => renderHub();
  a.innerHTML = `<div class="center" style="--cc:${c.color}">
    <aside class="side">
      <button class="tbtn back">${S.view !== 'simple' && webglOK() ? '← 병원 건물로' : '← 층별 안내'}</button>
      <h2>${c.floor} ${c.name}</h2>
      <p class="sdesc">${c.desc}</p>
      <div class="alist">${c.acts.map(x => `<button class="aitem ${S.acts[x.id] ? 'done' : ''} ${x.id === act.id ? 'cur' : ''}" data-a="${x.id}"><span class="ck">${S.acts[x.id] ? '✓' : ''}</span><span class="at">${x.icon} ${x.title}</span></button>`).join('')}</div>
      ${c.notes ? `<div class="notes"><b>${c.notes.title}</b><ol>${c.notes.items.map(n => `<li class="${S.acts[n.by] ? 'got' : ''}">${S.acts[n.by] ? n.t : '???  (활동을 완료하면 공개)'}</li>`).join('')}</ol>${c.notes.caveat ? `<div class="caveat">${c.notes.caveat}</div>` : ''}</div>` : ''}
    </aside>
    <section class="main"></section>
  </div>`;
  $('.back', a).onclick = backTo;
  $$('.aitem', a).forEach(b => b.onclick = () => openCenter(cid, b.dataset.a));
  const main = $('.main', a);
  main.innerHTML = `<div class="act-head"><div><h2>${act.icon} ${act.title}</h2><p class="goal">🎯 ${act.goal}</p></div>
     <span class="tag ${S.acts[act.id] ? 'ok' : ''}">${S.acts[act.id] ? '완료한 활동 · 다시 해 볼 수 있어요' : '진행 중'}</span></div>
     <div class="stage"></div><div class="info-slot"></div>`;
  const stage = $('.stage', main);
  const showInfo = () => {
    const slot = $('.info-slot', main); slot.innerHTML = '';
    const idx = c.acts.indexOf(act), nxt = c.acts.slice(idx + 1).concat(c.acts.slice(0, idx)).find(x => !S.acts[x.id]);
    const card = el(`<div class="info pop"><div class="ih"><span>📘 학습 카드 · ${act.title}</span><span>${S.acts[act.id] ? '활동 완료 ✓' : ''}</span></div>
      <div class="ib">${act.info.map(([h, p]) => `<div><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>
      <div class="ifoot"></div></div>`);
    const foot = $('.ifoot', card);
    if (nxt) { const b = el(`<button class="btn">다음 활동: ${nxt.title}</button>`); b.onclick = () => openCenter(cid, nxt.id); foot.appendChild(b); }
    else { const b = el(`<button class="btn">층 이동하기</button>`); b.onclick = backTo; foot.appendChild(b); }
    slot.appendChild(card);
    if (centerDone(c)) {
      slot.appendChild(el(`<div class="complete-banner"><span>🏅 ${c.name} 완료! ${c.doneMsg || ''}</span></div>`));
    }
  };
  act.run(stage, () => {
    const first = !S.acts[act.id];
    completeAct(act.id);
    // 사이드바 갱신
    const it = $(`.aitem[data-a="${act.id}"]`, a); it.classList.add('done'); $('.ck', it).textContent = '✓';
    if (c.notes) $$('.notes li', a).forEach((li, k) => { const n = c.notes.items[k]; if (S.acts[n.by]) { li.className = 'got'; li.textContent = n.t; } });
    $('.act-head .tag', main).className = 'tag ok'; $('.act-head .tag', main).textContent = '완료!';
    showInfo();
    later(() => $('.info-slot', main).scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
    if (first && centerDone(c)) {
      later(() => modal(`🏅 ${c.name} 완료!`, `<p>${c.doneMsg || ''}</p>${allCentersDone() ? '<p><b>4개 센터를 모두 완료했어요! 5층 종합 진료실에도 도전해 보세요.</b></p>' : ''}`,
        [{ label: '계속 보기', cls: 'ghost' }, { label: allCentersDone() ? '종합 진료실로' : '층 이동하기', fn: allCentersDone() ? openFinal : backTo }]), 900);
    }
  });
  if (S.acts[act.id]) showInfo();
  updateProgress();
}

        }
        // Nine independent round cells in each of eight wells (3x3), rather than a spiral.
        const cells = [];
        for (let well = 0; well < 8; well++) {
          const q = well % 4, r = Math.floor(well / 4);

            cells.forEach(({g}, i) => {

              nextBtn($('.exp', box), '활동 완료하기', next);
            }
          });
        };

/* =========================================================
   2F 첨단 의료기술 센터
   ========================================================= */
function canvasPointer(cv) {
  const p = { x: -1, y: -1, inside: false, down: false };
  const upd = e => { const r = cv.getBoundingClientRect(); p.x = (e.clientX - r.left) * cv.width / r.width; p.y = (e.clientY - r.top) * cv.height / r.height; p.inside = p.x >= 0 && p.y >= 0 && p.x <= cv.width && p.y <= cv.height; };
  cv.addEventListener('pointermove', upd); cv.addEventListener('pointerdown', e => { upd(e); p.down = true; });
  cv.addEventListener('pointerleave', () => p.inside = false); onDoc('pointerup', () => p.down = false);
  return p;
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  const qx = ax + dx * t, qy = ay + dy * t;
  return { d: Math.hypot(px - qx, py - qy), qx, qy, t };
}
function polyNearest(px, py, P) {
  let best = { d: 1e9 };
  for (let i = 0; i < P.length - 1; i++) { const r = segDist(px, py, P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]); if (r.d < best.d) best = { ...r, i }; }
  return best;
}

  ST.forEach(s => { s.idx = nearestIdx(...s.at); const g = sv('g', {}, $('.stations', box)); s.c = sv('circle', { cx: S[s.idx][0], cy: S[s.idx][1], r: 16, fill: 'none', stroke: '#FFB547', 'stroke-width': 3, 'stroke-dasharray': '4 3' }, g); });
  let cur = 0, si = 0, limit = ST[0].idx, dragging = false, waiting = false, fin = false, logged = false;
  const place = () => { const a = S[cur], b = S[Math.min(N, cur + 3)]; pill.setAttribute('transform', `translate(${a[0]} ${a[1]}) rotate(${Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI})`); };
  place();
  const toSvg = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  pill.addEventListener('pointerdown', e => { e.preventDefault(); if (waiting) { hint('먼저 "데이터 수집"을 눌러 측정한 정보를 보내요.'); return; } dragging = true; pill.style.cursor = 'grabbing'; });
  onDoc('pointerup', () => { dragging = false; pill.style.cursor = 'grab'; });
  onDoc('pointermove', e => {
    if (!dragging || waiting || fin) return;
    const q = toSvg(e);
    for (let it = 0; it < 30; it++) {
      let b = cur, bd = (S[cur][0] - q.x) ** 2 + (S[cur][1] - q.y) ** 2;
      for (let j = Math.max(0, cur - 8); j <= Math.min(limit, cur + 8); j++) { const d = (S[j][0] - q.x) ** 2 + (S[j][1] - q.y) ** 2; if (d < bd) { bd = d; b = j; } }
      if (b === cur) break; cur = b;
    }
    place();
    if (cur >= limit) arrive();
  });
  function arrive() {
    dragging = false;
    if (si < ST.length) { waiting = true; const s = ST[si]; $('.stat', box).textContent = `${s.icon} ${s.name}에 도착! ${s.tip}`; $('.collect', box).disabled = false; s.c.setAttribute('stroke-dasharray', ''); }
    else if (!fin) {
      fin = true; $('.stat', box).textContent = '🚽 알약이 몸 밖으로 자연스럽게 배출되었어요.';
      const e = explain($('.exp', box), '스마트 알약은 <b>삼키는 작은 전자 기기</b>예요. 카메라나 센서가 소화관을 지나며 사진과 정보를 모으고 <b>무선으로 몸 밖에 보내요</b>. 내시경이 닿기 어려운 곳도 덜 아프게 검사할 수 있고, 필요한 곳에서 약을 내보내는 스마트 알약도 연구되고 있어요.');
      nextBtn(e, '활동 완료하기', done);
    }
  }
  $('.collect', box).onclick = () => {
    const s = ST[si]; $('.collect', box).disabled = true;
    const w = sv('circle', { cx: S[cur][0], cy: S[cur][1], r: 10, fill: 'none', stroke: '#3FC8F0', 'stroke-width': 3 }, $('.waves', box));
    w.animate([{ r: 10, opacity: 1 }, { r: 260, opacity: 0 }], { duration: 1100 }); later(() => w.remove(), 1100);
    if (!logged) { $('.log', box).innerHTML = ''; logged = true; }
    $('.log', box).appendChild(el(`<div class="pop" style="color:var(--text)">${s.icon} ${s.data}</div>`));
    s.c.setAttribute('fill', 'rgba(46,196,160,.4)'); s.c.setAttribute('stroke', '#2EC4A0');
    si++; waiting = false; limit = si < ST.length ? ST[si].idx : N;
    $('.stat', box).textContent = si < ST.length ? `정보 전송 완료! 다음은 ${ST[si].name}(으)로 이동해요.` : '모든 측정 완료! 끝까지 이동시켜 몸 밖으로 내보내요.';
  };
}

              nextBtn(e, '활동 완료하기', next);

        draw();

    $('.culture-check',box).textContent='영양분 '+(food?'✓':'○')+'　 산소 '+(oxygen?'✓':'○');

    <div class="col"><h3 class="stitle" style="margin:0 0 8px;color:var(--cc)"></h3><p class="stepdesc muted"></p><div class="sl"></div><div class="action"></div><div class="ctrl"><label><span>⭐ 품질 확인</span><b class="qv">0 / 3</b></label><div class="meter"><i class="quality" style="width:0;background:var(--cc)"></i></div></div><div class="exp"></div></div></div>`);

    <div class="bpwork" style="min-height:330px"></div>

  const names=['① 생산 준비','② 배양 원리 확인','③ 수확·분리·정제','④ 품질 검사'];
  const next=()=>{stage++;progress.style.width=(stage/4*100)+'%'; if(stage===4){work.replaceChildren();work.appendChild(el(`<div class="ctrl" style="text-align:center;padding:28px"><div style="font-size:68px">💉</div><h3>바이오 의약품 완성!</h3><p>세포 준비부터 품질 검사까지 직접 체험했어요.</p></div>`)); title.textContent='생산 완료'; nextBtn(work,'활동 완료하기',done);return;} render();};
  const msg=t=>{feedback.textContent=t;};
  const mk=(tag,attrs={},parent)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(parent)parent.appendChild(e);return e;};
  const picture=(count=0,filter=false)=>{
    let svg=`<svg viewBox="0 0 500 260" style="width:100%;max-width:560px;background:#082536;border-radius:14px" role="img" aria-label="세포 배양과 의약품 생산 과정"><defs><linearGradient id="bpGlass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5f8ff" stop-opacity=".35"/><stop offset="1" stop-color="#1d7187" stop-opacity=".24"/></linearGradient><radialGradient id="bpCell" cx="30%" cy="25%"><stop stop-color="#ffe2ed"/><stop offset=".5" stop-color="#f99dc4"/><stop offset="1" stop-color="#a74e89"/></radialGradient></defs>`;
    svg+=`<rect x="122" y="25" width="250" height="207" rx="42" fill="url(#bpGlass)" stroke="#a6e5f2" stroke-width="6"/><path d="M143 90 Q245 80 351 90 L351 200 Q245 213 143 200Z" fill="#2b8f9b" opacity=".5"/><path d="M160 48 Q145 80 149 124" fill="none" stroke="#d6faff" stroke-width="8" opacity=".55" stroke-linecap="round"/>`;
    for(let i=0;i<count;i++){let x=157+(i*67%182),y=104+(i*41%88);svg+=`<circle cx="${x}" cy="${y}" r="9" fill="url(#bpCell)" stroke="#ffd6e8" stroke-width="1.2"/><circle cx="${x+1}" cy="${y+1}" r="3" fill="#8052a0"/><circle cx="${x-3}" cy="${y-3}" r="2" fill="#fff" opacity=".8"/>`;}

    return svg;
  };
  function render(){title.textContent=names[stage];work.replaceChildren();feedback.textContent='';

      });
    }else if(stage===2){

        <h3>🧪 배양액을 필터로 보내 약 성분을 분리해요</h3>

            <defs>
              <linearGradient id="bpp-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8f5ff" stop-opacity=".35"/><stop offset="1" stop-color="#287b95" stop-opacity=".12"/></linearGradient>
              <linearGradient id="bpp-liquid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65d5d8"/><stop offset="1" stop-color="#267eaa"/></linearGradient>

    reasons: [{ t: '적은 양의 검체로 여러 병원체를 한꺼번에 빠르게 검사할 수 있어서', ok: 1 }, { t: '삼키면 소화관 속 사진을 찍어서', why: '그것은 스마트 알약이에요.' }, { t: '병에 걸리기 전에 미리 예방해서', why: '그것은 백신이에요. 이미 증상이 있어요.' }],

    result: '독감 A형으로 빠르게 확인되어 알맞은 치료를 바로 시작했어요.', contrib: '🔍 질병을 빠르고 정확하게 진단해요' },
  { id: 'p6', face: '🧑', name: '김태양', age: 16, sum: '치과 치료 뒤 이가 욱신거려요',
    exams: [['🦷 상태', '치료한 부위가 욱신거리고 아파요.'], ['📋 다른 증상', '열이나 기침, 소화 문제는 없어요.'], ['💬 의사·약사 안내', '일반적인 통증이라 먹는 약으로 통증을 줄이면 돼요.']],
    cat: 'synth', item: '진통제', catHint: '간편하게 먹을 수 있는 약이 필요해요. 대부분 알약으로 먹는 의약품은 무엇이었나요?', itemHint: '통증을 줄이는 약이에요.',
    reasons: [{ t: '분자가 작아 빠르게 흡수되고, 알약이라 먹기 편하며, 대량 생산되어 쉽게 구할 수 있어서', ok: 1 }, { t: '세포를 배양해 만들어 특정 환자만을 대상으로 해서', why: '그것은 바이오 의약품의 특징이에요.' }, { t: '유전자를 고쳐서 통증을 없애서', why: '유전자 치료제는 유전 질환을 치료하는 약이에요.' }],
    steps: [{ icon: '💊', t: '알약을 물과 함께 삼키기' }, { icon: '⚛️', t: '작은 약 분자가 장에서 흡수되어 혈액으로' }, { icon: '🩸', t: '혈액을 따라 이동해 통증을 줄임' }],
    result: '통증이 줄어 편안해졌어요. (약은 꼭 안내받은 양만 먹어요)', contrib: '🙂 일상의 불편함을 덜어 줘요' },
  { id: 'p7', face: '👩', name: '한미경', age: 52, sum: '암 진단을 받았어요',
    exams: [['🔬 조직 검사', '암세포 표면에 특정 단백질이 아주 많이 나타나요.'], ['💬 환자의 걱정', '정상 세포는 최대한 덜 다치게 치료받고 싶어요.'], ['📋 의료진 의견', '그 단백질만 골라 공격하는 맞춤형 치료를 검토해요.']],
    cat: 'bio', item: '항체 치료제', catHint: '특정 "표적"만 정확히 찾아가는, 살아 있는 세포를 이용해 만든 의약품이 필요해요.', itemHint: '표적 단백질에 딱 맞게 결합하는 의약품이에요.',
    reasons: [{ t: '특정 표적 단백질에만 결합하도록 만들어 정상 세포 피해를 줄이며 치료할 수 있어서', ok: 1 }, { t: '값이 싸고 쉽게 복제할 수 있어서', why: '그것은 합성 의약품의 특징이에요. 바이오 의약품은 생산 비용이 높아요.' }, { t: '병에 걸리기 전에 면역을 미리 만들어서', why: '그것은 백신이에요.' }],
    steps: [{ icon: '🧫', t: '세포를 배양해 항체를 생산' }, { icon: '💉', t: '주사로 몸에 넣기' }, { icon: '🎯', t: '항체가 암세포의 표적 단백질에 결합' }],
    result: '정상 세포의 피해를 줄이면서 암세포를 공격해 치료 효과가 나타나고 있어요.', contrib: '🎯 환자에게 맞춘 표적 치료' },
  { id: 'p8', face: '👦', name: '이준서', age: 20, sum: '감염병이 유행하는 지역에 가요',
    exams: [['📅 일정', '다음 달 해외 의료 봉사 활동을 떠나요.'], ['🩺 건강 상태', '지금은 아픈 곳 없이 건강해요.'], ['🌍 여행 정보', '그 지역에 특정 감염병이 유행하고 있어요.']],
    cat: 'bio', item: '백신', catHint: '아직 아프지 않아요. 병을 "예방"하는 의약품은 어느 연구소에서 배웠나요?', itemHint: '병에 걸리기 전에 맞는 의약품이에요!',
    reasons: [{ t: '병원체의 정보를 미리 면역 체계에 알려 주어 감염을 예방할 수 있어서', ok: 1 }, { t: '이미 생긴 통증을 빨리 줄여 줘서', why: '그것은 진통제예요. 지금은 아픈 곳이 없어요.' }, { t: '손상된 조직을 살아 있는 세포로 채워서', why: '그것은 세포 치료제예요.' }],
    steps: [{ icon: '💉', t: '백신을 접종' }, { icon: '🧠', t: '면역 세포가 병원체 정보를 학습·기억' }, { icon: '🛡️', t: '진짜 병원체가 들어오면 빠르게 방어' }],
    result: '면역이 생겨 건강하게 봉사 활동을 다녀왔어요.', contrib: '🛡️ 질병을 미리 예방해요' }
];

function openFinal() {
  runCleanups();
  // 5층은 다른 센터 완료 여부와 관계없이 상시 입장 가능.
  const a = app(); a.scrollTop = 0;
  const all = PATIENTS.every(p => S.pts[p.id]);
  a.innerHTML = `<div class="ward" style="--cc:var(--c-final)">
    <button class="tbtn back">${S.view !== 'simple' && webglOK() ? '← 병원 건물로' : '← 층별 안내'}</button>
    <h1 style="margin-top:14px">5F 종합 진료실</h1>
    <p class="muted" style="margin:0;max-width:760px">환자를 눌러 진료를 시작해요. 상태 확인 → 기술 판단 → 치료 선택 → 이유 확인 → 원리 체험 → 결과 확인 순서로 진행해요. 모든 환자는 학습용 가상 사례예요.</p>
    <div class="beds">${PATIENTS.map(p => `<button class="bed ${S.pts[p.id] ? 'done' : ''}" data-p="${p.id}">
      <div class="face" style="font-size:40px;display:grid;place-items:center;border-radius:50%;background:${S.pts[p.id] ? 'rgba(46,196,160,.2)' : 'var(--panel)'}">${p.face}</div>
      <div><h4>${p.name} (${p.age}세) ${S.pts[p.id] ? '✅' : ''}</h4><p>${p.sum}</p></div></button>`).join('')}</div>
    <div class="certslot"></div></div>`;
  $('.back', a).onclick = () => renderHub();
  $$('.bed', a).forEach(b => b.onclick = () => openPatient(PATIENTS.find(p => p.id === b.dataset.p)));
  if (all) showCert($('.certslot', a));
  updateProgress();
}

function openPatient(p) {
  runCleanups();
  const a = app(); a.scrollTop = 0;
  const names = ['상태 확인', '기술 판단', '치료 선택', '이유 확인', '원리 체험', '치료 결과'];
  a.innerHTML = `<div class="ward" style="--cc:var(--c-final)"><button class="tbtn back">← 병동 목록</button>
    <div class="row" style="align-items:center;margin-top:14px"><div style="font-size:52px">${p.face}</div><div><h1 style="font-size:30px">${p.name} 환자 (${p.age}세)</h1><div class="muted">${p.sum}</div></div></div>
    <div class="steps6">${names.map((n, i) => `<span>${i + 1}. ${n}</span>`).join('')}</div>
    <div class="stage pbody"></div></div>`;
  $('.back', a).onclick = openFinal;
  const body = $('.pbody', a);
  let step = 0, chosenCat = null;
  const mark = () => $$('.steps6 span', a).forEach((s, i) => s.className = i < step ? 'ok' : i === step ? 'cur' : '');
  const go = () => { mark(); body.innerHTML = ''; [s1, s2, s3, s4, s5, s6][step](); a.scrollTop = 0; };
  const adv = () => { step++; go(); };
  function s1() {
    body.appendChild(el(`<p class="ph-title">환자의 상태를 확인해요</p>`));
    body.appendChild(el(`<p class="ph-desc">세 가지 검사·기록을 모두 눌러 확인해요.</p>`));
    const ex = el(`<div class="exam"></div>`); body.appendChild(ex);
    const seen = new Set();
    p.exams.forEach(([h, r], i) => {
      const b = el(`<button>${h}<span class="res">눌러서 확인하기</span></button>`);
      b.onclick = () => { b.classList.add('seen'); $('.res', b).textContent = r; $('.res', b).style.color = 'var(--text)'; seen.add(i); if (seen.size === 3 && !body.querySelector('.nx')) { const n = nextBtn(body, '다음: 필요한 기술 판단하기', adv); n.classList.add('nx'); } };
      ex.appendChild(b);
    });
  }
  function s2() {
    body.appendChild(el(`<p class="ph-title">어떤 분야의 의료 기술이 필요할까요?</p>`));
    const ch = el(`<div class="choices"></div>`); body.appendChild(ch);
    Object.entries(CATS).forEach(([k, c]) => {
      const b = el(`<button class="choice"><b>${c.i} ${c.n}</b><span class="muted" style="font-size:13px">${c.items.join(', ')}</span></button>`);
      b.onclick = () => {
        if (k !== p.cat) { b.classList.add('wrong'); shakeEl(b); hint(p.catHint); return; }
        chosenCat = k; b.classList.add('right'); $$('.choice', ch).forEach(x => x.disabled = true); later(adv, 600);
      };
      ch.appendChild(b);
    });
  }
  function s3() {
    const c = CATS[chosenCat];
    body.appendChild(el(`<p class="ph-title">${c.i} ${c.n} 중에서 알맞은 것을 골라요</p>`));
    const ch = el(`<div class="choices"></div>`); body.appendChild(ch);
    c.items.forEach(it => {
      const b = el(`<button class="choice"><b>${it}</b></button>`);
      b.onclick = () => {
        if (it !== p.item) { b.classList.add('wrong'); shakeEl(b); hint(p.itemHint); return; }
        b.classList.add('right'); $$('.choice', ch).forEach(x => x.disabled = true); good(`${it}을(를) 선택했어요.`); later(adv, 600);
      };
      ch.appendChild(b);
    });
  }
  function s4() {
    body.appendChild(el(`<p class="ph-title">${p.item}을(를) 고른 가장 알맞은 이유는?</p>`));
    const ch = el(`<div class="choices" style="grid-template-columns:1fr"></div>`); body.appendChild(ch);
    shuffle(p.reasons).forEach(r => {
      const b = el(`<button class="choice">${r.t}</button>`);
      b.onclick = () => {
        if (!r.ok) { b.classList.add('wrong'); shakeEl(b); hint(r.why); return; }
        b.classList.add('right'); $$('.choice', ch).forEach(x => x.disabled = true); later(adv, 700);
      };
      ch.appendChild(b);
    });
  }
  function s5() {
    body.appendChild(el(`<p class="ph-title">${p.item}이(가) 작동하는 순서대로 눌러 치료를 진행해요</p>`));
    const vis = el(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap"></div>`); body.appendChild(vis);
    p.steps.forEach((s, i) => { vis.appendChild(el(`<div class="vs${i}" style="width:84px;height:84px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:36px;opacity:.3;transition:all .4s">${s.icon}</div>`)); if (i < 2) vis.appendChild(el(`<div style="font-size:24px;color:var(--dim)">→</div>`)); });
    orderSteps(body, {
      steps: p.steps.map((s, i) => ({ ...s, hint: i === 0 ? '치료가 시작되는 첫 단계는 무엇일까요?' : '앞 단계의 결과로 일어나는 일을 생각해 보세요.' })),
      onStep(i) { const v = $('.vs' + (i - 1), vis); v.style.opacity = 1; v.style.background = 'var(--c-final)'; v.classList.add('pop'); },
      onDone() { const n = nextBtn(body, '치료 결과 확인하기', adv); }
    });
  }
  function s6() {
    const first = !S.pts[p.id];
    S.pts[p.id] = true; save(); updateProgress();
    body.appendChild(el(`<p class="ph-title">치료 결과</p>`));
    const box = el(`<div class="row"><div style="font-size:80px" class="pf">${p.face}</div><div class="col">
      <div class="ctrl"><label><span>건강 상태</span><b class="hv">30%</b></label><div class="meter"><i style="width:30%"></i></div></div>
      <p style="font-size:17px">${p.result}</p><p><span class="tag ok" style="font-size:15px">의료 기술의 기여: ${p.contrib}</span></p>
      <p class="muted" style="font-size:13px">※ 학습용 가상 사례예요. 실제 치료는 의료진이 환자의 상태를 종합적으로 판단해 결정해요.</p></div></div>`);
    body.appendChild(box);
    tween(1500, u => { const v = Math.round(30 + 65 * ease(u)); $('.hv', box).textContent = v + '%'; $('.meter i', box).style.width = v + '%'; });
    $('.pf', box).classList.add('pop');
    const nextP = PATIENTS.find(q => !S.pts[q.id]);
    const row = el(`<div class="row" style="margin-top:12px"></div>`); body.appendChild(row);
    if (nextP) { const b = el(`<button class="btn">다음 환자: ${nextP.name}</button>`); b.onclick = () => openPatient(nextP); row.appendChild(b); }
    const b2 = el(`<button class="btn ghost">병동 목록으로</button>`); b2.onclick = openFinal; row.appendChild(b2);
    if (!nextP && first) later(() => modal('🎉 모든 환자를 치료했어요!', '<p>4개 센터와 종합 진료 미션을 모두 마쳤어요. 병동 목록에서 수료증을 확인해요.</p>', [{ label: '수료증 보기', fn: openFinal }]), 1200);
  }
  go();
}

function showCert(slot) {
  const c = el(`<div class="cert pop">
    <h2>바이오 병원 수료증</h2>
    <p style="text-align:center;margin:14px 0">이름: <input class="nm" maxlength="12" placeholder="이름을 써요" value="${(S.name || '').replace(/"/g, '')}"></p>
    <p style="text-align:center" class="muted">위 학생은 바이오 병원의 4개 전문 센터와 종합 진료 미션을 모두 마치고 다음 내용을 익혔음을 증명합니다.</p>
    <div class="info" style="--cc:var(--c-final)"><div class="ib">
      <div><h4>🫀 바이오 장기 3유형</h4><p>이종 장기 · 세포 기반 인공 장기 · 전자 기기 인공 장기</p></div>
      <div><h4>🤖 의료 로봇·기기 6가지</h4><p>수술용 로봇 · 나노로봇 · 보행 재활 로봇 · 스마트 알약 · 바이오칩 · 로봇 의수</p></div>
      <div><h4>💊 합성 의약품</h4><p>작은 분자·빠른 전달 / 저렴·쉬운 생산 / 알약 복용 / 쉬운 복제<br>진통제 · 소화제 · 감기약 · 항암제</p></div>
      <div><h4>🧫 바이오 의약품</h4><p>세포 배양과 정밀한 품질 관리 / 다양한 생산 방식 / 종류에 따른 효과와 부작용<br>백신 · 항체 · 유전자 · 세포 치료제</p></div>
      <div><h4>⚖️ 두 의약품의 차이</h4><p>만드는 방법(화학 합성 ↔ 세포 배양)에서 분자 크기, 비용, 복용 방법, 대상이 달라져요.</p></div>
      <div><h4>🌏 의료 기술이 삶에 기여하는 방식</h4><p>생명 연장 · 삶의 질 향상 · 정밀하고 안전한 치료 · 빠른 진단 · 맞춤 치료 · 질병 예방 · 장애 극복</p></div>
    </div></div>
    <p class="muted" style="font-size:14px;margin-top:14px"><b style="color:var(--text)">함께 생각해 봐요</b> 의료 기술은 높은 비용, 동물 이용과 같은 윤리 문제, 장기적인 안전성 등 함께 고민해야 할 점도 있어요. 기술을 누구나 공정하게 누리려면 어떻게 해야 할까요?</p>
    <p style="text-align:right;margin:0" class="muted">${new Date().toLocaleDateString('ko-KR')} · 바이오 병원장</p></div>`);
  $('.nm', c).addEventListener('input', e => { S.name = e.target.value; save(); });
  slot.appendChild(c);
}

/* ---------- 시작 ---------- */
bootTopbar();
renderHub();
</script>
</body></html>
