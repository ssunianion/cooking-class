<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO TIME MACHINE — 생명 기술 시간 여행</title>
<style>
:root{--bg:#07111f;--panel:#10264a;--line:#264d80;--teal:#22d3c5;--cyan:#7ee8ff;--text:#eaf4ff;--muted:#a3b9d8;--gold:#ffc857;--red:#ff6b7a;--green:#5ee39a;--purple:#b58cff;--r:16px;
--font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:clamp(14px,1.08vw,18px);line-height:1.5;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;font-size:inherit}
svg{display:block}
#app{display:flex;flex-direction:column;height:100vh}
.top{flex:none;height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(180deg,#0d2040,#091830);border-bottom:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.35);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.logo b{color:var(--teal)}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.pbar{width:clamp(80px,14vw,240px);height:10px;border-radius:99px;background:#06152a;border:1px solid var(--line);overflow:hidden;flex:none}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--cyan));box-shadow:0 0 10px var(--teal);transition:width .6s}
#ptext{font-weight:700;color:var(--cyan);white-space:nowrap;font-size:.9em}
.where{color:var(--muted);font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.ib{height:38px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:#0f2645;color:var(--text);cursor:pointer;font-size:.86em;white-space:nowrap}
.ib:hover{border-color:var(--teal);background:#133056}
#main{flex:1;overflow:auto;position:relative;background:radial-gradient(1100px 600px at 85% -10%,rgba(34,211,197,.13),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(126,232,255,.08),transparent 60%),linear-gradient(rgba(126,232,255,.035) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(126,232,255,.035) 1px,transparent 1px) 0 0/34px 34px,var(--bg)}
.screen{min-height:100%;padding:12px 20px 16px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,h4,p{margin:0}
h3{font-size:1.1em;margin-bottom:8px}
h4{font-size:.95em;color:var(--cyan);margin:0 0 6px}
.tiny{font-size:.8em;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{justify-content:center}
.panel{background:linear-gradient(180deg,rgba(22,51,95,.9),rgba(13,32,61,.92));border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;background:rgba(34,211,197,.14);color:var(--teal);font-weight:800;font-size:.85em;border:1px solid rgba(34,211,197,.45);white-space:nowrap}
.chip.gold{background:rgba(255,200,87,.14);color:var(--gold);border-color:rgba(255,200,87,.45)}
.btn{appearance:none;border:0;cursor:pointer;padding:9px 18px;border-radius:12px;font-weight:800;color:#03201d;background:linear-gradient(180deg,#45f2e0,#16b8aa);box-shadow:0 4px 0 #0b7a71,0 8px 18px rgba(34,211,197,.22);transition:transform .08s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0b7a71}
.btn:disabled{filter:grayscale(1) brightness(.55);cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--teal)}
.btn.big{padding:11px 24px;font-size:1.06em}
.btn.pulse{animation:pulse 1.3s infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #0b7a71,0 0 0 9px rgba(34,211,197,.22)}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* feedback */
.fb{margin-top:8px;border-radius:12px;font-size:.95em;padding:8px 12px}
.fb:empty{display:none}
.fb.ok{background:rgba(94,227,154,.12);border:1px solid rgba(94,227,154,.55);color:#d2ffe6}
.fb.bad{background:rgba(255,107,122,.12);border:1px solid rgba(255,107,122,.55);color:#ffe1e5}
.fb.info{background:rgba(126,232,255,.1);border:1px solid rgba(126,232,255,.45);color:#dff7ff}
.fb.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:none}}
/* drag */
.drag{cursor:grab;touch-action:none}
.dragging{opacity:.3}
.dghost{position:fixed!important;z-index:9999;pointer-events:none;margin:0!important;transform:rotate(-2deg) scale(1.05)!important;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55));transition:none}
.can-drop{outline:2px dashed rgba(34,211,197,.6);outline-offset:3px}
.over{outline:3px solid var(--gold)!important;outline-offset:3px}
.locked{cursor:default}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:#0f2a4f;border:1px solid var(--teal);color:var(--text);padding:10px 20px;border-radius:99px;font-weight:700;z-index:10000;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal-ov{position:fixed;inset:0;background:rgba(2,8,18,.7);display:grid;place-items:center;z-index:10001;animation:fade .2s}
.modal{max-width:640px;width:92vw;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:22px}
.modal ul{margin:0;padding-left:20px}.modal li{margin:4px 0}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:9998;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
/* title */
.title-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.tring{width:min(300px,40vh);aspect-ratio:1;position:relative;display:grid;place-items:center}
.tring .tm-rings{position:absolute;inset:0}
.tring .core{position:relative;font-size:clamp(40px,6vh,64px)}
.title-screen h1{font-size:clamp(34px,4.6vw,66px);letter-spacing:.06em;font-weight:900;background:linear-gradient(90deg,#7ee8ff,#22d3c5 50%,#ffc857);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-screen .sub{font-size:1.35em;font-weight:800;color:var(--cyan);margin-top:-6px}
.title-screen .lead{max-width:640px;color:#cfe2fb}
.spin{transform-origin:200px 200px;animation:spin 22s linear infinite}
.spin.s2{animation-duration:12s;animation-direction:reverse}
.spin.s3{animation-duration:34s}
@keyframes spin{to{transform:rotate(360deg)}}
/* map */
.map-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:14px}
.map-head h2{font-size:1.5em}
.tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1120px;margin:0 auto}
.tl-node{display:grid;grid-template-columns:62px 1fr;grid-template-rows:auto auto auto auto;column-gap:12px;text-align:left;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,#14305a,#0e2343);border:1.5px solid var(--line);color:var(--text);cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.tl-node:hover{transform:translateY(-2px)}
.tl-icon{grid-row:1/5;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#0a1b33;border:2px solid var(--line)}
.tl-n{font-size:.78em;font-weight:900;color:var(--cyan);letter-spacing:.05em}
.tl-era{font-size:.8em;color:var(--muted)}
.tl-t{font-weight:800;line-height:1.3}
.tl-s{font-size:.82em;font-weight:700;margin-top:2px}
.tl-node.open{border-color:var(--teal);box-shadow:0 0 0 3px rgba(34,211,197,.15)}
.tl-node.open .tl-icon{border-color:var(--teal);box-shadow:0 0 16px rgba(34,211,197,.45)}
.tl-node.open .tl-s{color:var(--teal)}
.tl-node.done{border-color:rgba(94,227,154,.7)}
.tl-node.done .tl-s{color:var(--green)}
.tl-node.locked{opacity:.5;filter:saturate(.3);cursor:not-allowed}
.tl-node.final{background:linear-gradient(180deg,#3a2e12,#1e1a10);border-color:rgba(255,200,87,.6)}
.tl-node.final.locked{border-color:var(--line)}
/* intro */
.intro{display:grid;grid-template-columns:minmax(240px,36%) 1fr;gap:28px;align-items:center;max-width:1200px;margin:0 auto;min-height:calc(100vh - 100px)}
.tm{width:min(100%,62vh);aspect-ratio:1;position:relative;display:grid;place-items:center;margin:0 auto}
.tm .tm-rings{position:absolute;inset:0}
.yr{position:relative;font-size:clamp(20px,2.3vw,36px);font-weight:900;color:var(--cyan);text-shadow:0 0 22px rgba(126,232,255,.6);font-variant-numeric:tabular-nums;text-align:center;padding:0 10px}
.tm-era{position:absolute;bottom:24%;left:0;right:0;text-align:center;color:var(--gold);font-weight:700;font-size:.9em;padding:0 22%}
.intro-info{display:flex;flex-direction:column;gap:12px;transition:.6s}
.intro-info.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
.intro-info h2{font-size:clamp(22px,2.3vw,34px);line-height:1.25}
.story p,.goal p{font-size:1.02em}
.story{border-left:4px solid var(--gold)}
.goal{border-left:4px solid var(--teal)}
/* stage */
.stage{display:flex;flex-direction:column;gap:6px;max-width:1500px;margin:0 auto;min-height:100%}
.stagebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:#0d203b;border:1px solid var(--line);color:var(--muted);font-size:.82em}
.stp b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#173257;font-size:.85em}
.stp.cur{color:var(--text);border-color:var(--teal)}.stp.cur b{background:var(--teal);color:#03201d}
.stp.done b{background:var(--green);color:#03201d}
.steph h2{font-size:1.28em}
.inst{margin-top:2px;color:#d3e6ff}
.work{flex:1;position:relative;padding:4px 0}
.stepfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px;border-top:1px solid rgba(38,77,128,.6)}
.note{color:var(--muted);font-size:.82em}
.mean-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start;margin-top:6px}
.mean ul{margin:0;padding-left:20px}.mean li{margin:7px 0}
.quiz .qq{font-weight:800;margin-bottom:6px}
.qopt{display:block;width:100%;text-align:left;padding:10px 14px;margin:6px 0;border-radius:12px;border:1.5px solid var(--line);background:#0f2645;color:var(--text);cursor:pointer;line-height:1.45}
.qopt:hover{border-color:var(--teal)}
.qopt.right{border-color:var(--green);background:rgba(94,227,154,.15)}
.qopt.wrong{border-color:var(--red);background:rgba(255,107,122,.1)}
/* clear & ending */
.clear,.ending{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.clear-badge{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:58px;background:radial-gradient(circle,#18406f,#0a1b33);border:3px solid var(--gold);box-shadow:0 0 40px rgba(255,200,87,.45);animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.2);opacity:0}}
.clear h2{font-size:1.6em}
.clear-msg{font-size:1.18em;font-weight:700;color:#fff3cf;max-width:760px;line-height:1.6}
.unlock{color:var(--teal);font-weight:800}
.ending h1{font-size:clamp(28px,3.4vw,48px);color:var(--gold)}
.tl-line{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:1300px;width:100%;position:relative;margin:10px 0}
.tl-line::before{content:"";position:absolute;left:4%;right:4%;top:28px;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--cyan))}
.tl-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.tl-dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#0d2342;border:3px solid var(--teal);z-index:1}
.tl-y{font-weight:900;color:var(--cyan);font-size:.86em}
.tl-tt{font-weight:800;font-size:.86em;line-height:1.3}
.tl-d{font-size:.76em;color:var(--muted);line-height:1.35}
/* sort */
.sort{display:flex;flex-direction:column;gap:10px}
.sort-main{display:flex;flex-direction:column;gap:12px}
.slots{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:10px 10px;padding-top:8px}
.slot{position:relative;min-height:74px;border:2px dashed #2d5a8f;border-radius:14px;padding:6px;display:flex;align-items:stretch;background:rgba(8,22,42,.5)}
.slot-n{position:absolute;top:-10px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#03201d;font-weight:900;display:grid;place-items:center;font-size:.8em;z-index:2}
.slot>.card{flex:1;margin:0;width:auto}
.slot.correct{border-color:var(--green);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:10px;border:1.5px dashed #2d5a8f;border-radius:14px;background:rgba(8,22,42,.35);align-content:flex-start}
.card{background:linear-gradient(180deg,#1c4176,#143058);border:1.5px solid #3c6dab;border-radius:12px;padding:8px 12px;font-weight:700;display:flex;flex-direction:column;justify-content:center;min-height:54px;box-shadow:0 4px 10px rgba(0,0,0,.25);line-height:1.35}
.pool>.card{width:clamp(150px,15vw,230px)}
.card .cs{font-weight:400;font-size:.82em;color:var(--muted)}
.card.right{border-color:var(--green);background:linear-gradient(180deg,#17493e,#103a33)}
.sort.vert .sort-main{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.sort.vert .slots{grid-template-columns:1fr}
.sort.vert .pool{flex-direction:column;flex-wrap:nowrap;min-height:100%}
.sort.vert .pool>.card{width:auto}
.sort .ptitle{font-size:.85em;color:var(--muted);margin-bottom:4px}
/* match */
.match{position:relative;display:grid;grid-template-columns:1fr minmax(50px,11%) 1fr;align-items:center}
.mcol{display:flex;flex-direction:column;gap:10px}
.mitem{position:relative;padding:10px 16px;border-radius:12px;background:#122d55;border:1.5px solid #34639f;cursor:pointer;font-weight:600;min-height:52px;display:flex;align-items:center;touch-action:none;line-height:1.4}
.mitem.R{padding-left:22px}.mitem.L{padding-right:22px}
.mitem .dot{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#0b1a30;border:3px solid var(--cyan)}
.mitem.L .dot{right:-9px}.mitem.R .dot{left:-9px}
.mitem.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,87,.25)}
.mitem.linked{border-color:var(--teal)}
.mitem.wrong{border-color:var(--red)}.mitem.right{border-color:var(--green)}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.mlines path{fill:none;stroke:var(--teal);stroke-width:3.5;stroke-linecap:round}
.mlines path.bad{stroke:var(--red)}.mlines path.good{stroke:var(--green)}.mlines path.temp{stroke:var(--gold);stroke-dasharray:8 6}
.mhead{display:grid;grid-template-columns:1fr minmax(50px,11%) 1fr;font-size:.85em;color:var(--muted);margin-bottom:6px}
/* bins */
.binrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.bin{border:2px dashed #2d5a8f;border-radius:16px;min-height:140px;padding:8px;background:rgba(8,22,42,.5)}
.bin-h{text-align:center;font-weight:900;font-size:1.15em;margin-bottom:6px}
.bin-b{display:flex;flex-direction:column;gap:6px}
.bin-b .card{min-height:0;font-size:.9em}
.counter{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:#0d223f;border:1px solid var(--line)}
.counter .cl{min-width:110px}
.counter .cb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#16345f;color:var(--text);font-weight:900;cursor:pointer;font-size:1.1em}
.counter b{min-width:28px;text-align:center;font-size:1.2em;color:var(--gold)}
/* lens */
.lensbox{position:relative;overflow:hidden;border-radius:18px;background:#000;border:2px solid var(--line);flex:none}
.lens-base{position:absolute;inset:0}
.lens-base.blurry{filter:blur(2.4px) brightness(.75)}
.lens-base svg,.lens-in svg{width:100%;height:100%}
.lens{position:absolute;border-radius:50%;overflow:hidden;border:5px solid #c8d8ea;box-shadow:0 0 0 3px #3c5a80,0 10px 30px rgba(0,0,0,.6);cursor:grab;touch-action:none;background:#000}
.lens-in{position:absolute;pointer-events:none}
.lens::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 40%);pointer-events:none}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{padding:8px 12px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:.92em}
.clue.found{border-style:solid;border-color:var(--green);color:var(--text);background:rgba(94,227,154,.08)}
/* ===== stage 1 ===== */
.s1a{display:grid;grid-template-columns:160px 1fr 250px;gap:14px;align-items:start}
.shelf{display:flex;flex-direction:column;gap:8px}
.ing{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:#0f2645;border:1.5px solid var(--line);font-weight:700}
.ing-ic{width:46px;height:46px;flex:none}
.bowls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bowl-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:16px;background:rgba(10,27,51,.6);border:1px solid var(--line)}
.bowl-title{font-weight:800}
.bowl{position:relative;width:220px;height:170px;margin-top:30px;border-radius:20px;touch-action:none}
.bowl::before{content:"";position:absolute;left:10px;right:10px;top:62px;height:38px;border-radius:50%;background:#1b3658;border:3px solid #7fb5e2}
.bowl::after{content:"";position:absolute;left:10px;right:10px;top:80px;bottom:6px;border-radius:0 0 100px 100px/0 0 80px 80px;background:linear-gradient(180deg,#5fa4dc,#2a5d92);border:3px solid #7fb5e2;border-top:none;z-index:2}
.dough{position:absolute;left:50%;bottom:84px;width:150px;height:0;transform:translateX(-50%);border-radius:50% 50% 44% 44%/90% 90% 12% 12%;background:radial-gradient(circle at 40% 30%,#fffaf0,#ead2a1);z-index:1;transition:height .5s,width .5s}
.dough.slow{transition:height 2.8s ease-out,width 2.8s ease-out}
.dough.lumpy{background:radial-gradient(circle at 30% 40%,#fff 0 8%,transparent 9%),radial-gradient(circle at 65% 30%,#fff 0 7%,transparent 8%),radial-gradient(circle at 50% 60%,#f8f0dc 0 10%,transparent 11%),#e8dbc0}
.dough.wet{box-shadow:inset 0 -6px 0 rgba(90,170,255,.45)}
.bubbles{position:absolute;left:30%;right:30%;bottom:90px;height:90px;z-index:3;pointer-events:none}
.bub{position:absolute;bottom:0;width:8px;height:8px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:rise 1.6s ease-in infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.mixlab{position:absolute;left:0;right:0;bottom:24px;text-align:center;z-index:3;font-weight:800;font-size:.9em;color:#fff;text-shadow:0 1px 3px #000}
.bowl.mixready{cursor:grab}
.bowl.mixing{cursor:grabbing}
.bowl.pick{cursor:pointer}
.bowl.pick:hover{box-shadow:0 0 0 3px var(--gold)}
.btags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:24px}
.tag{font-size:.78em;padding:1px 8px;border-radius:99px;background:#1b3e6c;border:1px solid #3c6dab}
.ctrl{display:flex;flex-direction:column;gap:10px}
.sl{display:flex;flex-direction:column;gap:2px;font-weight:700}
.sl b{color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--teal);cursor:pointer;height:22px}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}
.clock{font-size:.9em;color:var(--cyan);min-height:22px}
.s1b{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.farm-side{display:flex;flex-direction:column;gap:8px}
.gen{font-size:1.15em;font-weight:900;color:var(--gold)}
.goal-t{font-size:.88em;padding:6px 10px;border-radius:10px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.4)}
.seeds{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:30px}
.seedbag{display:flex;align-items:center;gap:6px;padding:4px 6px;line-height:1.25;border-radius:10px;background:#3b2a16;border:1.5px solid #a8824a;font-weight:700;font-size:.88em}
.seedbag svg{width:30px;height:30px}
.can{width:78px;height:62px;cursor:grab;touch-action:none;position:relative;z-index:20;transition:transform .25s}
.can.pour{transition:none;cursor:grabbing}
.meter{flex:1;height:12px;border-radius:99px;background:#06152a;border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fb3ff,#7ee8ff)}
.field{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#5a3d22,#3f2a16);border:3px solid #7a5532;box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.plot{position:relative;height:min(23vh,180px);border-radius:12px;background:rgba(0,0,0,.12);display:flex;align-items:flex-end;justify-content:center;cursor:pointer;border:2px solid transparent}
.plot svg{width:100%;height:100%}
.plot.grow svg{animation:grow 1.2s ease-out}
@keyframes grow{from{transform:scaleY(.2);transform-origin:bottom;opacity:.4}}
.plot.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,87,.4)}
.plot.best{background:rgba(94,227,154,.12)}
.ptag{position:absolute;top:4px;left:4px;right:4px;font-size:.7em;line-height:1.3;background:rgba(5,15,30,.82);border-radius:8px;padding:3px 6px;text-align:center}
.ptag .g{color:var(--green);font-weight:800}.ptag .r{color:#ffb38a;font-weight:800}
.ptag .st{color:var(--gold)}
.drop-w{position:fixed;width:6px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7ec8ff;z-index:9998;pointer-events:none;animation:dropw .5s linear forwards}
@keyframes dropw{to{transform:translateY(60px);opacity:0}}
.gchart{display:flex;gap:8px;align-items:flex-end;height:78px;padding:6px;border-radius:10px;background:#0a1b33}
.gbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.72em;color:var(--muted)}
.gbar i{display:block;width:70%;background:linear-gradient(180deg,var(--green),#2a9e66);border-radius:4px 4px 0 0;min-height:2px}
.gbar b{color:var(--text)}
/* ===== stage 2 ===== */
.s2{display:grid;grid-template-columns:150px 220px 1fr 250px;gap:12px;align-items:start}
.tray{display:flex;flex-direction:column;gap:8px}
.slide{height:46px;border-radius:6px;background:linear-gradient(180deg,rgba(220,240,255,.35),rgba(170,210,240,.2));border:1.5px solid #b9d9f3;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:.82em;font-weight:700}
.slide i{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
.scope{position:relative;width:220px;height:312px}
.scope>svg{width:100%;height:100%}
.stagezone{position:absolute;left:12%;top:52%;width:60%;height:12%;border-radius:8px;display:flex;align-items:center;justify-content:center}
.stagezone .slide{height:30px;font-size:.7em;width:100%}
.knob{position:absolute;left:68%;top:56%;width:56px;height:56px;border-radius:50%;background:conic-gradient(#9fb4cc 0 10deg,#5c7594 10deg 30deg,#9fb4cc 30deg 40deg,#5c7594 40deg 60deg,#9fb4cc 60deg 70deg,#5c7594 70deg 90deg,#9fb4cc 90deg 100deg,#5c7594 100deg 120deg,#9fb4cc 120deg 130deg,#5c7594 130deg 150deg,#9fb4cc 150deg 160deg,#5c7594 160deg 180deg,#9fb4cc 180deg 190deg,#5c7594 190deg 210deg,#9fb4cc 210deg 220deg,#5c7594 220deg 240deg,#9fb4cc 240deg 250deg,#5c7594 250deg 270deg,#9fb4cc 270deg 280deg,#5c7594 280deg 300deg,#9fb4cc 300deg 310deg,#5c7594 310deg 330deg,#9fb4cc 330deg 340deg,#5c7594 340deg 360deg);border:3px solid #dbe7f4;cursor:grab;touch-action:none;box-shadow:0 0 0 4px rgba(255,200,87,.0)}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:6px;height:16px;margin-left:-3px;border-radius:3px;background:var(--gold)}
.knob:hover{box-shadow:0 0 0 4px rgba(255,200,87,.5)}
.knob-lab{position:absolute;left:52%;top:75%;background:#0b1a30;padding:1px 8px;border-radius:99px;border:1px solid var(--gold);font-size:.72em;color:var(--gold);font-weight:800;white-space:nowrap}
.viewcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.mview{position:relative;width:min(300px,42vh);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#000;border:10px solid #22344d;box-shadow:0 0 0 3px #4d6b90,inset 0 0 40px rgba(0,0,0,.8)}
.mview .inner{position:absolute;left:-50%;top:-50%;width:200%;height:200%;transition:transform .35s}
.mview .inner svg{width:100%;height:100%}
.mview.empty::after{content:"표본 없음";position:absolute;inset:0;display:grid;place-items:center;color:#56708f;font-weight:700}
.mview::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 50px rgba(0,0,0,.75);z-index:2;pointer-events:none}
.obj{cursor:pointer}
.obj:hover>*{stroke:#ffc857}
.obj.pick>*{stroke:#ff3b6b!important;stroke-width:5}
.swim{animation:swim 6s ease-in-out infinite alternate}
@keyframes swim{to{transform:translate(40px,-20px) rotate(8deg)}}
.vstat{font-weight:800;color:var(--cyan);min-height:24px;text-align:center}
.magbtns{display:flex;gap:6px}
.magbtns button{padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:#0f2645;color:var(--text);font-weight:800;cursor:pointer}
.magbtns button.on{background:var(--teal);color:#03201d;border-color:var(--teal)}
.lightrow{display:flex;align-items:center;gap:8px;width:100%;max-width:320px;font-weight:700;white-space:nowrap}
.notebook{background:#f6f1e4;color:#2b2416;border-radius:14px;padding:12px;min-height:250px;box-shadow:0 6px 20px rgba(0,0,0,.35);background-image:repeating-linear-gradient(transparent 0 27px,#d9cdb3 27px 28px)}
.notebook h4{color:#6b4b1f}
.nb-entry{font-size:.9em;font-weight:700;margin:4px 0;color:#1f5d3a}
.nb-empty{font-size:.85em;color:#8a7a5c}
.nb-choice{margin-top:10px;padding:8px;border-radius:10px;background:#fff8e6;border:1.5px solid #e2c27a}
.nb-choice .row button{flex:1}
/* ===== stage 3 ===== */
.s3c{display:grid;grid-template-columns:200px 1fr 1fr;gap:14px;align-items:start}
.syringe{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:14px;background:#0f2645;border:1.5px solid var(--line);font-weight:700;text-align:center;font-size:.9em}
.syringe svg{width:120px;height:46px}
.syringe.used{opacity:.35}
.group{display:flex;flex-direction:column;gap:6px}
.gbadge{align-self:flex-start;font-size:.85em;font-weight:800;padding:2px 10px;border-radius:99px;background:#1a2f4f;color:var(--muted)}
.gbadge.on{background:rgba(34,211,197,.18);color:var(--teal)}
.people{display:grid;grid-template-columns:repeat(12,1fr);gap:4px 6px;max-width:460px}
.pp{color:#a9c6e8;transition:color .3s}
.pp svg{width:100%;height:auto}
.group.vacc .pp{color:#7fe7d9}
.group .pp.sick,.group.vacc .pp.sick{color:var(--red)}
.pp.sick{color:var(--red);animation:pop .4s}
/* ===== stage 4 ===== */
.s4{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
.peas{display:flex;flex-direction:column;gap:8px}
.pea{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:12px;background:#0f2645;border:1.5px solid var(--line);font-size:.84em;font-weight:700;line-height:1.3}
.pea svg{width:46px;height:52px;flex:none}
.pea small{display:block;color:var(--gold);font-weight:900}
.crossrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pslot{width:150px;height:120px;border:2px dashed #2d5a8f;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8em;color:var(--muted);text-align:center;background:rgba(8,22,42,.5)}
.pslot svg{width:62px;height:70px}
.pslot.filled{border-style:solid;border-color:var(--teal);color:var(--text)}
.xmark{font-size:2em;font-weight:900;color:var(--gold)}
.offs{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px;border-radius:14px;background:rgba(40,80,40,.25);border:1px solid #2f6b44;min-height:70px}
.off{display:flex;flex-direction:column;align-items:center;font-size:.72em;font-weight:900;color:var(--gold)}
.off svg{width:100%;max-width:56px;height:auto}
.off.bloom{animation:popin .5s cubic-bezier(.2,1.6,.4,1) both}
.rec{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ===== stage 5 ===== */
.s5a{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.dish-click{width:min(360px,52vh);aspect-ratio:1;cursor:crosshair;position:relative}
.dish-click svg{width:100%;height:100%}
.mark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid var(--gold);pointer-events:none;animation:popin .4s}
.mark.bad{border-color:var(--red)}
.s5c{display:grid;grid-template-columns:180px 1fr 1fr;gap:14px;align-items:start}
.dishbox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:16px;background:rgba(10,27,51,.6);border:1.5px solid var(--line)}
.dishbox .d{width:min(250px,36vh);aspect-ratio:1}
.dishbox .d svg{width:100%;height:100%}
.dishbox.pickable{cursor:pointer}
.dishbox.pickable:hover{border-color:var(--gold)}
.moldpiece{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:14px;background:#0f2645;border:1.5px solid var(--line);font-weight:700;font-size:.9em;text-align:center}
.moldpiece.used{opacity:.35}
/* ===== stage 6 ===== */
.s6b{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
.ladder{display:flex;flex-direction:column;gap:5px;align-items:center}
.rung{display:flex;align-items:center;gap:0}
.base{width:52px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:1.15em;color:#08121f;border:2px solid rgba(255,255,255,.4)}
.bA{background:#ff8a8a}.bT{background:#ffd56b}.bG{background:#6fe39a}.bC{background:#7ec8ff}
.bond{width:70px;height:6px;background:repeating-linear-gradient(90deg,#9fb6d6 0 6px,transparent 6px 10px)}
.bslot{width:52px;height:38px;border-radius:9px;border:2px dashed #3c6dab;background:rgba(8,22,42,.5)}
.bslot .base{width:100%;height:100%;border-radius:7px}
.rail{width:14px;height:38px;background:#5c7594;border-radius:4px}
.basepool{display:grid;grid-template-columns:1fr 1fr;gap:10px;justify-items:center}
.basepool .base{width:64px;height:48px;font-size:1.4em}
.rule{padding:10px;border-radius:12px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.45);font-weight:700}
.s6c{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.helixbox{position:relative;width:min(300px,50vh);margin:0 auto;border-radius:18px;background:radial-gradient(circle at 50% 40%,#13355e,#0a1b33);border:1px solid var(--line)}
.helixbox svg{width:100%;height:auto}
.railzone{position:absolute;top:4%;bottom:4%;width:22%;border-radius:12px;border:2px dashed rgba(126,232,255,.5);display:grid;place-items:center;color:var(--muted);font-size:.8em;font-weight:700;writing-mode:vertical-rl}.railzone.set{border-color:transparent;color:transparent}
.railzone.l{left:2%}.railzone.r{right:2%}
.bbstrip{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#0f2645;border:1.5px solid var(--line);font-weight:700;font-size:.88em}
.bbstrip i{width:16px;height:60px;border-radius:6px;background:repeating-linear-gradient(180deg,#b58cff 0 10px,#7ee8ff 10px 20px);flex:none}
.bbstrip.used{opacity:.3}
/* ===== stage 7 ===== */
.sheeprow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sheep{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:16px;background:rgba(10,27,51,.6);border:1.5px solid var(--line);text-align:center;font-weight:800;font-size:.9em}
.sheep svg{width:120px;height:90px}
.sheep.pickable{cursor:pointer}
.sheep.pickable:hover{border-color:var(--gold)}
.sheep.right{border-color:var(--green);background:rgba(94,227,154,.1)}
.sheep.wrong{border-color:var(--red)}
.s7{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;align-items:start}
.bench{display:flex;align-items:center;justify-content:space-around;gap:12px;padding:14px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#173a63,#0b1d36);border:1.5px solid var(--line);min-height:260px;position:relative}
.bench-lab{position:absolute;top:8px;left:12px;font-size:.8em;color:var(--muted);font-weight:700}
.egg{position:relative;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff4f7,#ffc4d4);border:6px solid rgba(255,225,233,.6);box-shadow:0 0 0 12px rgba(255,200,215,.12)}
.egg.small{width:64px;height:64px;border-width:3px;box-shadow:none}
.nuc{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d4a8ff,#6b38b8);border:2px solid #f1e3ff}
.nuc.donor{background:radial-gradient(circle at 35% 35%,#a6fff4,#119c8f);border-color:#e0fffb}
.egg.small .nuc{width:18px;height:18px;margin:-9px 0 0 -9px}
.egg.fused{animation:flash 1s 2}
@keyframes flash{50%{box-shadow:0 0 0 14px rgba(255,200,87,.6),0 0 50px rgba(255,200,87,.9)}}
.waste{width:120px;height:120px;border-radius:50%;border:3px dashed #5c7594;display:grid;place-items:center;text-align:center;font-size:.8em;color:var(--muted);position:relative;background:rgba(8,22,42,.5)}
.waste .nuc{position:static;margin:0}
.somatic{position:relative;width:130px;height:100px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;background:radial-gradient(circle at 40% 40%,#effbff,#a9d6ef);border:4px solid rgba(220,245,255,.6)}
.somatic .nuc{width:42px;height:42px;margin:-21px 0 0 -21px}
.cellsrc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82em;font-weight:700;text-align:center}
.mini-egg{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff4f7,#ffc4d4);border:3px solid rgba(255,225,233,.6);position:relative}
.mini-egg::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#7b45c4}
.mini-som{width:62px;height:48px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;background:radial-gradient(circle at 40% 40%,#effbff,#a9d6ef);position:relative}
.mini-som::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#119c8f}
.dolly{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:16px;border:2px solid var(--gold);background:rgba(255,200,87,.08);font-weight:900}
.dolly svg{width:150px;height:112px}
/* ===== stage 8 ===== */
.chromo{width:100%;max-width:900px;margin:0 auto 10px}
.fragrow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.fslot{min-height:58px;border:2px dashed #2d5a8f;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(8,22,42,.5);position:relative}
.fslot .fnum{position:absolute;top:-9px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#03201d;font-weight:900;font-size:.75em;display:grid;place-items:center}
.frag{display:inline-flex;padding:8px 10px;border-radius:10px;background:#122d55;border:1.5px solid #3c6dab;font-family:Consolas,"Courier New",monospace;font-weight:900;font-size:1.05em;letter-spacing:.06em}
.frag .os{color:#ffd56b}.frag .oe{color:#7ee8ff}.frag .both{color:#b9ffd6}
.fslot .frag{border-color:var(--green)}
.fpool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px;border:1.5px dashed #2d5a8f;border-radius:14px;margin-top:12px;min-height:66px}
.seqout{margin-top:10px;font-family:Consolas,"Courier New",monospace;font-weight:900;font-size:1.15em;letter-spacing:.12em;text-align:center;color:var(--green);word-break:break-all}
.patient{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.patient .av{width:64px;height:64px;border-radius:50%;background:#16345f;display:grid;place-items:center;font-size:32px;flex:none;border:2px solid var(--teal)}
@media (max-width:1200px){.s2{grid-template-columns:140px 200px 1fr 220px}.s1a{grid-template-columns:150px 1fr 220px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{.top,.ending .row{display:none}#main,body{overflow:visible;height:auto}*{color:#000!important;background:#fff!important;box-shadow:none!important;-webkit-text-fill-color:#000!important}}
.tl-item{animation:popin .6s cubic-bezier(.2,1.6,.4,1) both}
.gwrap{position:relative;max-width:920px;margin:14px auto 0;padding:22px 0 64px}
.gstrip{display:flex;height:76px;border-radius:38px;overflow:hidden;border:3px solid #7ee8ff;box-shadow:0 0 24px rgba(126,232,255,.25)}
.gband{flex:1;border-right:2px solid rgba(7,17,31,.5);opacity:.55;transition:opacity .15s}
.gband.lit{opacity:1}
.gband.found{background:#ff3b5c!important;opacity:1;box-shadow:inset 0 0 0 3px #fff}
.scanner{position:absolute;top:8px;width:64px;height:150px;margin-left:-32px;border:3px solid var(--gold);border-radius:16px;background:rgba(255,200,87,.15);cursor:grab;touch-action:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:800;font-size:.85em;color:var(--gold)}
.scanner.on{cursor:grabbing;background:rgba(255,200,87,.3)}
.gtally{text-align:center;font-size:1.2em;font-weight:900;color:var(--gold)}
.intro-info .story p{font-size:1.15em;line-height:1.7}
.mean li{font-size:1.08em}
.nb-guide{font-size:.82em;line-height:1.5;padding:6px 8px;margin-bottom:6px;border-radius:8px;background:#fff8e6;border:1px solid #e2c27a;color:#4a3a1a}
.nb-opts{display:flex;flex-direction:column;gap:6px}
.nb-opt{text-align:left;padding:8px 10px;border-radius:10px;border:2px solid #c9a54a;background:#fffdf5;color:#2b2416;cursor:pointer;display:flex;flex-direction:column;gap:2px;line-height:1.35}
.nb-opt b{font-size:1.05em}.nb-opt span{font-size:.8em;color:#5c4a28}
.nb-opt:hover{border-color:#16b8aa;background:#eafffb}
.pea-off{opacity:.38;filter:grayscale(.8);cursor:not-allowed;border-style:dashed}
.pea .lockmsg{color:var(--muted)!important;font-weight:700!important;font-size:.9em}

/* ===== 밝고 친근한 과학 체험실 테마 (기존 학습 동작 유지) ===== */
:root{--bg:#f5faff;--panel:#ffffff;--line:#c9ddec;--teal:#087f84;--cyan:#176b9e;--text:#223a50;--muted:#5a7083;--gold:#ac6500;--red:#b43d55;--green:#16774c;--purple:#7953ae}
body{background:var(--bg);color:var(--text)}
.top{background:linear-gradient(110deg,#ffffff,#e6f7ff);border-bottom:1px solid #c5dfe9;box-shadow:0 3px 14px rgba(39,94,120,.1)}
#main{background:radial-gradient(900px 460px at 95% 0%,rgba(140,222,246,.27),transparent 70%),radial-gradient(850px 460px at 0% 100%,rgba(255,224,160,.25),transparent 65%),linear-gradient(rgba(55,145,190,.035) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(55,145,190,.035) 1px,transparent 1px) 0 0/34px 34px,#f6fbff}
.panel{background:linear-gradient(180deg,#ffffff,#f6fbff);border-color:#cbdfea;box-shadow:0 5px 18px rgba(37,96,131,.07)}
.ib{background:#ffffff;color:#26445b;border-color:#b9d7e7}.ib:hover{background:#e9f8ff;border-color:#3e9fbc}
.pbar,.meter{background:#dcecf4}.pbar i{background:linear-gradient(90deg,#4abca7,#55aee7);box-shadow:none}
#ptext,.logo b,.tl-n,.yr,.tl-y,.vstat,.clock{color:#176b9e}

<div id="app">
<header class="top">
 <div class="logo" id="logo" title="처음 화면">⏳ <span>BIO <b>TIME MACHINE</b></span></div>
 <div class="prog"><div class="pbar"><i id="pfill"></i></div><span id="ptext">0 / 8 완료</span><span id="where" class="where"></span></div>
 <div class="tools">
  <button class="ib" id="btnMap">🗺️ 지도</button>
  <button class="ib" id="btnReset" title="지금 하는 활동을 처음 상태로 되돌려요">↺ 실험 초기화</button>
  <button class="ib" id="btnHelp">❓ 도움말</button>
  <button class="ib" id="btnSound" title="소리 켜기/끄기">🔊 소리</button>
  <button class="ib" id="btnFull">⛶ 전체 화면</button>
 </div>
</header>
<main id="main"></main>
</div>
<div id="toast"></div>
<script>
'use strict';
/* ================= 공통 도구 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs,...kids){const el=document.createElement(tag);attrs=attrs||{};for(const k in attrs){const v=attrs[k];if(v===false||v==null)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k==='style')el.style.cssText=v;else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);else el.setAttribute(k,v);}
 for(const c of kids.flat(3)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}return el;}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};}

/* ================= 저장 ================= */
const KEY='bioTimeMachine.v1';
const S={done:[],step:{},sound:true,finalDone:false,finishedAt:null};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)Object.assign(S,d);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ================= 효과음 ================= */
let AC=null;
function tone(f,d=.12,type='sine',v=.07,delay=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const SFX={
 pick:()=>tone(520,.06,'triangle',.05),
 drop:()=>tone(700,.08,'triangle',.07),
 ok:()=>{tone(660,.1);tone(880,.16,'sine',.07,.1);},
 bad:()=>tone(200,.2,'sawtooth',.04),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.08,i*.12)),
 warp:()=>{if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(1400,t+1.2);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+1.5);}catch(e){}}
};

/* ================= 화면 공통 ================= */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2300);}
function fb(box,type,msg){box.className='fb '+type;box.innerHTML=msg;box.classList.remove('pop');void box.offsetWidth;box.classList.add('pop');if(type==='bad')SFX.bad();if(type==='ok')SFX.ok();}
function modal(content,buttons){const ov=h('div',{class:'modal-ov'});const m=h('div',{class:'modal panel'});m.append(typeof content==='string'?h('div',{html:content}):content);const row=h('div',{class:'row center'});(buttons||[{t:'닫기'}]).forEach(b=>row.append(h('button',{class:'btn '+(b.cls||''),onclick:()=>{ov.remove();b.fn&&b.fn();}},b.t)));m.append(row);ov.append(m);ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});document.body.append(ov);}
function confetti(){const c=['#22d3c5','#ffc857','#ff6b7a','#7ee8ff','#b58cff','#5ee39a'];for(let i=0;i<70;i++){const s=h('i',{class:'cf',style:`left:${Math.random()*100}vw;background:${c[i%6]};animation-delay:${Math.random()*.7}s;animation-duration:${2+Math.random()*1.6}s`});document.body.append(s);setTimeout(()=>s.remove(),4500);}}
let screenTok=0;
const alive=t=>t===screenTok;
function show(el){screenTok++;const m=$('#main');m.innerHTML='';m.scrollTop=0;el.classList.add('screen');m.append(el);}
const RINGS=(()=>{let ticks='';for(let i=0;i<24;i++){const a=i*15*Math.PI/180;ticks+=`<line x1="${200+Math.cos(a)*108}" y1="${200+Math.sin(a)*108}" x2="${200+Math.cos(a)*(i%2?114:120)}" y2="${200+Math.sin(a)*(i%2?114:120)}" stroke="#7ee8ff" stroke-width="2"/>`;}
 return `<svg viewBox="0 0 400 400"><defs><radialGradient id="rg"><stop offset="0" stop-color="#22d3c5" stop-opacity=".32"/><stop offset="1" stop-color="#22d3c5" stop-opacity="0"/></radialGradient></defs><circle cx="200" cy="200" r="196" fill="url(#rg)"/><g class="spin"><circle cx="200" cy="200" r="182" fill="none" stroke="#22d3c5" stroke-width="2" stroke-dasharray="4 10" opacity=".75"/></g><g class="spin s2"><circle cx="200" cy="200" r="154" fill="none" stroke="#7ee8ff" stroke-width="7" stroke-dasharray="60 30 10 30" opacity=".45"/></g><g class="spin s3"><circle cx="200" cy="200" r="128" fill="none" stroke="#ffc857" stroke-width="2" stroke-dasharray="2 7" opacity=".8"/>${ticks}</g><circle cx="200" cy="200" r="100" fill="#071427" stroke="#22d3c5" stroke-width="3"/></svg>`;})();

/* ================= 드래그 앤 드롭 ================= */
function draggable(el,opt){
 el.classList.add('drag');
 el.addEventListener('pointerdown',e=>{
  if(e.button!==0||el.classList.contains('locked'))return;
  e.preventDefault();e.stopPropagation();
  const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
  const g=el.cloneNode(true);g.classList.add('dghost');g.classList.remove('dragging');
  Object.assign(g.style,{width:r.width+'px',height:r.height+'px',left:r.left+'px',top:r.top+'px'});
  document.body.append(g);el.classList.add('dragging');SFX.pick();
  const tg=((typeof opt.targets==='function'?opt.targets():opt.targets)||[]).filter(Boolean);
  tg.forEach(t=>t.classList.add('can-drop'));
  let over=null;
  const hit=ev=>{const els=document.elementsFromPoint(ev.clientX,ev.clientY);return tg.find(t=>els.includes(t))||null;};
  const mv=ev=>{g.style.left=(ev.clientX-ox)+'px';g.style.top=(ev.clientY-oy)+'px';const t=hit(ev);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over');}};
  const up=ev=>{
   window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
   tg.forEach(t=>t.classList.remove('can-drop','over'));el.classList.remove('dragging');
   const t=ev.type==='pointercancel'?null:hit(ev);let ok=false;
   if(t){try{ok=opt.drop(t,ev)===true;}catch(err){console.error(err);}}
   if(ok){SFX.drop();g.remove();}

 for(let i=0;i<30;i++){const a=R2()*6.283,d=R2()*MR;mold+=`<circle cx="${(MOLD.x+Math.cos(a)*d).toFixed(1)}" cy="${(MOLD.y+Math.sin(a)*d).toFixed(1)}" r="${(6+R2()*9).toFixed(1)}" fill="${R2()<.5?'#3f8f7a':'#5fb39a'}"/>`;}

function growDish(withMold,t){

}
