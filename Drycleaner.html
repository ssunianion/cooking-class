<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세탁소 사장님 — 의복 재료와 의복 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#CDEDE7; --tile2:#B7E2DA; --teal:#1E5F66; --teal2:#2E8A8F; --pink:#F6A9B8; --pink2:#EE7F96;
  --butter:#FFE08A; --ink:#22323A; --paper:#FFFEF8; --kraft:#EBD6AE; --red:#D9483B; --green:#2F9E6A;
  --sky:#8FD0F2; --shadow:0 3px 0 rgba(30,95,102,.25);
  --disp:'Do Hyeon','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --body:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#7FC4BC;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none}
#stage{position:absolute;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--tile);
  background-image:linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px);
  background-size:48px 48px;border-radius:6px}
.hidden{display:none!important}
button{font-family:var(--body);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--pink2);outline-offset:2px}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:400;margin:0}

/* ---------- buttons ---------- */
.btn{border:2px solid var(--teal);background:var(--paper);border-radius:12px;padding:8px 14px;font-size:17px;box-shadow:var(--shadow);transition:transform .08s}
.btn:hover{background:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.main{background:var(--teal);color:#fff;font-family:var(--disp);font-size:22px;padding:10px 22px}
.btn.main:hover{background:var(--teal2)}
.btn.pink{background:var(--pink);border-color:var(--pink2)}
.btn.sel{background:var(--butter);border-color:#C79A10;box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{font-size:14px;padding:5px 10px;border-radius:9px}

/* ---------- title ---------- */
#title{position:absolute;inset:0;background:linear-gradient(#9EDCF5 0 58%,#CDEDE7 58%)}
#title .art{position:absolute;left:0;top:0;width:1600px;height:900px}
#title .logo{position:absolute;left:96px;top:70px;width:560px}
#title .logo h1{font-size:104px;line-height:1;color:var(--teal);letter-spacing:-2px;text-shadow:4px 4px 0 #fff,8px 8px 0 var(--pink)}
#title .logo p{font-size:22px;margin:18px 0 0;line-height:1.5;background:var(--paper);display:inline-block;padding:8px 16px;border-radius:10px;border:2px dashed var(--teal2)}
#title .menu{position:absolute;left:96px;top:390px;display:flex;flex-direction:column;gap:14px;width:300px}
#title .menu .btn{font-size:24px;font-family:var(--disp);padding:12px 18px;text-align:left}
#title .ver{position:absolute;left:96px;bottom:28px;font-size:14px;color:#33585c}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;width:1600px;height:64px;background:var(--teal);color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px;z-index:5}
#hud .sign{font-family:var(--disp);font-size:30px;background:var(--paper);color:var(--teal);padding:2px 14px;border-radius:10px;border:3px solid var(--pink)}
#game.neon #hud .sign{animation:neon 2.4s infinite;border-color:#FF6FA6;box-shadow:0 0 12px #FF6FA6}
@keyframes neon{0%,100%{box-shadow:0 0 6px #FF6FA6}50%{box-shadow:0 0 18px #FF6FA6,0 0 4px #fff}}
#hud .stat{display:flex;flex-direction:column;line-height:1.1}
#hud .stat small{font-size:12px;opacity:.85}
#hud .stat b{font-family:var(--disp);font-weight:400;font-size:22px}
#hud .satbar{width:110px;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:3px}
#hud .satbar i{display:block;height:100%;background:var(--butter)}
#hud .sp{flex:1}
#hud .btn{font-size:15px;padding:6px 12px}

/* ---------- nav ---------- */
#nav{position:absolute;left:0;top:64px;width:124px;height:836px;background:#F2FBF9;border-right:3px solid var(--teal);display:flex;flex-direction:column;padding:6px;gap:4px;z-index:4}
#nav button{border:2px solid transparent;background:transparent;border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;line-height:1.15}
#nav button .ic{font-size:27px;line-height:1;height:30px;display:flex;align-items:center}
#nav button:hover{background:#fff;border-color:var(--tile2)}
#nav button.on{background:var(--butter);border-color:#C79A10}
#nav button.hint .ic{animation:bob 1.3s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- scene ---------- */
#scene{position:absolute;left:124px;top:64px;width:1206px;height:836px;overflow:hidden}
#game.tiles #scene{background-image:linear-gradient(rgba(255,255,255,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.6) 2px,transparent 2px);background-size:36px 36px;background-color:#F8D7DF}
.guide{position:absolute;left:16px;top:12px;right:16px;min-height:52px;background:var(--paper);border:2px solid var(--teal);border-radius:14px;padding:8px 16px;display:flex;align-items:center;gap:14px;z-index:3;box-shadow:var(--shadow)}
.guide h2{font-size:26px;color:var(--teal);white-space:nowrap}
.guide .gt{font-size:17px;line-height:1.4}
.abs{position:absolute}
.panel{position:absolute;background:var(--paper);border:2px solid var(--teal);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.panel h3{font-size:21px;color:var(--teal);margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:14px;color:#46636a;margin:10px 0 4px}
.note{font-size:14px;line-height:1.5;color:#3d555b}
.drop{border:3px dashed rgba(30,95,102,.45);border-radius:18px;transition:background .15s,border-color .15s}
.drop.over{background:rgba(255,224,138,.55);border-color:#C79A10}
.dragging{opacity:.35}
.ghost{position:absolute;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25));transform:rotate(-4deg)}
.ghost svg{width:100%;height:auto;display:block}
.grab{cursor:grab;touch-action:none}
.grab:active{cursor:grabbing}
.gsvg{display:block;width:100%;height:auto}
.prog{height:14px;background:#E3F1EE;border-radius:8px;overflow:hidden;border:2px solid var(--teal)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal2),#55C2B4);transition:width .15s}
.steps{list-style:none;margin:0;padding:0;font-size:15px}
.steps li{padding:4px 0 4px 26px;position:relative;line-height:1.35}
.steps li:before{content:'';position:absolute;left:2px;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid #9bb}
.steps li.now{font-weight:bold;color:var(--teal)}
.steps li.now:before{border-color:var(--teal);background:var(--butter)}
.steps li.ok{color:#6b8a8f;text-decoration:line-through}
.steps li.ok:before{background:var(--green);border-color:var(--green)}

/* ---------- tray ---------- */
#tray{position:absolute;right:0;top:64px;width:270px;height:836px;background:#FDF4E3;border-left:3px solid var(--teal);padding:10px 12px;overflow-y:auto;z-index:4}
#tray h3{font-size:20px;color:var(--teal)}
.ticket{position:relative;background:var(--kraft);border-radius:8px;padding:10px 12px 10px 30px;margin-top:8px;border:1.5px solid #C9AE7C}
.ticket:before{content:'';position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#FDF4E3;border:1.5px solid #C9AE7C}
.ticket:after{content:'';position:absolute;left:22px;top:6px;bottom:6px;border-left:2px dotted #B89A64}
.ticket .no{font-family:var(--disp);font-size:20px;color:#7A5320}
.tabs{display:flex;gap:4px;margin-top:6px}
.tabs button{flex:1;border:2px solid #C9AE7C;background:#fff;border-radius:8px;font-size:13px;padding:3px}
.tabs button.on{background:var(--kraft);font-weight:bold}
.mini{width:150px;margin:6px auto 0;background:radial-gradient(#fff,#F1E6CF);border-radius:14px;padding:6px}
.bars{margin-top:8px}
.bar{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.bar .t{height:9px;border-radius:5px;background:#E8DCC4;overflow:hidden}
.bar .t i{display:block;height:100%}
.chk{font-size:13.5px;margin-top:8px;line-height:1.55}
.chk span{display:block}
.chk .d{color:var(--green)}
.chk .p{color:#99886a}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;background:rgba(20,50,55,.55);z-index:60;display:flex;align-items:center;justify-content:center}
#modal .box{background:var(--paper);border:3px solid var(--teal);border-radius:20px;padding:22px 26px;max-height:840px;overflow:auto;position:relative;box-shadow:0 10px 0 rgba(30,95,102,.35)}
#modal .x{position:absolute;right:14px;top:12px;font-size:20px;border:2px solid var(--teal);background:#fff;border-radius:50%;width:38px;height:38px}
#modal h2{font-size:32px;color:var(--teal);margin-bottom:10px}
.dex{display:grid;grid-template-columns:230px 1fr;gap:18px;width:1240px;height:760px}
.dex nav{overflow-y:auto;border-right:2px dashed var(--tile2);padding-right:10px}
.dex nav button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:9px;font-size:16px}
.dex nav button.on{background:var(--butter)}
.dex .ct{overflow-y:auto;padding-right:10px;font-size:16.5px;line-height:1.65}
.dex .ct h3{font-size:26px;color:var(--teal);margin:4px 0 8px}
.dex .ct h4{font-family:var(--disp);font-weight:400;font-size:20px;margin:14px 0 4px;color:var(--teal2)}
.dex table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.dex th,.dex td{border:1.5px solid #BFD9D4;padding:6px 8px;text-align:left;vertical-align:top}
.dex th{background:#E6F5F2}
.fcard{display:grid;grid-template-columns:130px 1fr;gap:14px;border:2px solid #BFD9D4;border-radius:14px;padding:10px 12px;margin:10px 0;background:#fff}
.dots{letter-spacing:2px;color:var(--teal2)}
.callout{background:#FFF4CC;border-left:5px solid #E2B33B;padding:8px 12px;border-radius:6px;margin:10px 0;font-size:15.5px}
.sym{display:inline-block;width:76px;vertical-align:top;text-align:center;font-size:12.5px;line-height:1.3;margin:4px}
.sym svg{width:70px;height:60px;display:block;margin:0 auto;background:#fff;border:1.5px solid #ddd;border-radius:8px}

/* label modal */
.labelcard{width:920px;background:#fff;border-radius:10px;border:2px solid #ccc;padding:18px 22px;font-size:16px;position:relative}
.labelcard:before{content:'';position:absolute;left:0;right:0;top:-2px;height:10px;background:repeating-linear-gradient(90deg,#fff 0 10px,#ddd 10px 12px)}
.labelcard .syms{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}
.labelcard .s{text-align:center;font-size:13px;line-height:1.35}
.labelcard .s svg{width:88px;height:76px;border:1.5px solid #333;border-radius:6px;background:#fff}
.labelcard .s .m{min-height:52px;color:#2a6a55;margin-top:4px;visibility:hidden}
.labelcard.help .s .m{visibility:visible}

#insP .lbl{font-size:19px;font-weight:bold;color:var(--ink);margin:16px 0 8px;line-height:1.45}
#insP .lbl b{color:var(--teal)}
/* 돈 획득 효과 */
.earn{position:absolute;left:230px;top:66px;z-index:80;background:#FFE08A;border:3px solid #C79A10;border-radius:14px;padding:6px 14px;font-size:18px;pointer-events:none;animation:earnUp 2.2s ease-out forwards}
@keyframes earnUp{0%{transform:translateY(16px);opacity:0}15%{transform:translateY(0);opacity:1}75%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
/* toasts */
#toasts{position:absolute;left:50%;top:138px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--paper);border:2.5px solid var(--teal);border-radius:14px;padding:10px 18px;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.15);max-width:760px;line-height:1.45;animation:tin .25s ease-out}
.toast.bad{border-color:var(--red);background:#FFF0EE}
.toast.good{border-color:var(--green);background:#ECFAF2}
.toast.warn{border-color:#D9A21B;background:#FFF8E0}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}

/* result */
.result{width:1040px;display:grid;grid-template-columns:300px 1fr;gap:20px}
.stamp{font-family:var(--disp);font-size:44px;border:5px solid;border-radius:14px;display:inline-block;padding:2px 16px;transform:rotate(-6deg);margin:8px 0}
.loglist{max-height:420px;overflow-y:auto;font-size:15.5px;line-height:1.5}
.loglist div{padding:6px 10px 6px 34px;border-radius:10px;margin:5px 0;position:relative}
.loglist div b{position:absolute;left:10px;top:6px}
.loglist .good{background:#ECFAF2}.loglist .bad{background:#FFEDEA}.loglist .warn{background:#FFF6D9}.loglist .info{background:#EEF6FA}

/* animations */
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .9s linear infinite;transform-box:fill-box;transform-origin:center}
.spin-slow{animation-duration:1.6s}.spin-fast{animation-duration:.35s}
@keyframes wob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.95)}}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-60px);opacity:0}}
.bub{animation:rise 1.4s ease-in infinite}
@keyframes dripf{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
.drip{animation:dripf .9s ease-in infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.shake{animation:shake .12s infinite}
@keyframes walkout{to{transform:translateX(-520px);opacity:0}}
.walkout{animation:walkout .9s ease-in forwards}
@keyframes walkin{from{transform:translateX(-300px);opacity:0}}
.walkin{animation:walkin .6s ease-out}
@keyframes steam{from{transform:translateY(0) scale(.6);opacity:.8}to{transform:translateY(-50px) scale(1.4);opacity:0}}
.steam{animation:steam 1.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.bub,.drip,.steam,#nav button.hint .ic{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="title"></div>
  <div id="game" class="hidden">
    <div id="hud"></div>
    <div id="nav"></div>
    <div id="scene"></div>
    <div id="tray"></div>
  </div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
</div>
<script>
'use strict';
/* ====================== 1. 섬유 데이터 ====================== */
const CAT = {
  plant:'천연 섬유 · 식물성 섬유', animal:'천연 섬유 · 동물성 섬유',
  regen:'인조 섬유 · 재생 섬유', syn:'인조 섬유 · 합성 섬유'
};
// 1~3 단계(낮음·보통·높음)
const FIBERS = {
  cotton:{name:'면', cat:'plant', raw:'목화 씨앗에 붙은 솜털', absorb:3, breath:3, warm:2, stretch:1, crease:3,
    heat:'열에 강한 편 — 고온(3단) 다림질 가능', shrink:'뜨거운 물·기계 건조에서 줄어들 수 있음',
    care:'알칼리에 강해 약알칼리성 세제로 세탁할 수 있음. 흰색 의복은 표시를 확인하고 표백할 수 있음.', feel:'촉감이 부드럽고 땀을 잘 흡수해 속옷·티셔츠에 많이 쓰임'},
  linen:{name:'마', cat:'plant', raw:'아마·모시·대마(삼) 등 식물의 줄기', absorb:3, breath:3, warm:1, stretch:1, crease:3,
    heat:'열에 강한 편 — 고온(3단) 다림질 가능', shrink:'구김이 매우 잘 생기고 줄어들 수 있음',
    care:'통기성이 좋아 시원함. 비틀어 짜면 깊은 구김이 생기므로 표시를 확인함.', feel:'시원하고 까슬까슬해 여름옷에 쓰임'},
  silk:{name:'견', cat:'animal', raw:'누에고치에서 뽑은 실', absorb:3, breath:2, warm:2, stretch:2, crease:2,
    heat:'열에 약한 편 — 중온(2단) 이하, 천을 덮고 다림', shrink:'물속 마찰에 광택이 줄고 형태가 변할 수 있음',
    care:'단백질 섬유라 알칼리에 약함 → 중성세제. 염소계 표백제 금지. 햇빛에 누렇게 변해 그늘 건조.', feel:'광택이 아름답고 촉감이 매끄러움'},
  wool:{name:'모', cat:'animal', raw:'양 등 동물의 털', absorb:3, breath:2, warm:3, stretch:3, crease:1,
    heat:'열에 약한 편 — 중온(2단) 이하, 천을 덮거나 스팀', shrink:'물속에서 비비거나 뜨거운 물·마찰을 주면 섬유가 엉켜 줄어듦(축융)',
    care:'단백질 섬유라 알칼리에 약함 → 중성세제로 흔들어 빨기. 니트는 뉘어서 그늘 건조.', feel:'보온성이 매우 좋고 탄력이 있어 구김이 잘 생기지 않음'},
  rayon:{name:'레이온', cat:'regen', raw:'목재 펄프 등의 셀룰로오스를 녹여 다시 뽑아낸 섬유', absorb:3, breath:3, warm:1, stretch:1, crease:3,
    heat:'열에 약한 편 — 저온(1단) 다림질', shrink:'물에 젖으면 강도가 크게 약해지고 줄어들기 쉬움',
    care:'물세탁 금지 표시가 많음 → 드라이클리닝 또는 표시에 따른 약한 손세탁.', feel:'흡습성이 좋고 광택·촉감이 견과 비슷해 인조 견이라고도 함'},
  acetate:{name:'아세테이트', cat:'regen', raw:'목재 펄프 등의 셀룰로오스에 아세트산을 반응시켜 만든 섬유', absorb:2, breath:2, warm:2, stretch:1, crease:2,
    heat:'열에 약함 — 저온(1단), 높은 열에 녹거나 광택이 변함', shrink:'열과 마찰에 변형되기 쉬움',
    care:'아세톤 같은 일부 용제에 녹음. 드라이클리닝 표시를 확인함. 매끄러워 안감에 많이 쓰임.', feel:'광택이 있고 매끄러워 정장 안감에 쓰임'},
  nylon:{name:'나일론', cat:'syn', raw:'석유를 원료로 합성', absorb:1, breath:1, warm:1, stretch:2, crease:1,
    heat:'열에 약함 — 저온(1단)', shrink:'높은 열에 녹거나 변형됨',
    care:'가볍고 질기며 마찰에 강함. 햇빛(자외선)에 누렇게 변할 수 있어 그늘 건조.', feel:'가볍고 질겨 바람막이·스타킹에 쓰임'},
  polyester:{name:'폴리에스테르', cat:'syn', raw:'석유를 원료로 합성', absorb:1, breath:1, warm:2, stretch:1, crease:1,

function shade(hex,amt){const c=hexRgb(hex).map(v=>amt<0?Math.round(v*(1+amt)):Math.round(v+(255-v)*amt));return '#'+c.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}

function shapeMatrix(st){
  const loss = Math.max(0,Math.min(.7,(100-st.shape)/100));
  if(loss<.02) return [1,0,0,1,0,0];
  if(st.shapeType==='stretch'){const sx=1-loss*.22, sy=1+loss*.38;return [sx,0,0,sy,100-100*sx,0];}
  if(st.shapeType==='shrink'){const s=1-loss*.45;return [s,0,0,s,100-100*s,115-115*s];}
  const k=loss*.42;return [1,0,k,1,-k*115,0];
}
function colorFilter(st){
  const cl=100-st.color; if(cl<1) return '';
  if(st.colorType==='yellow') return `sepia(${Math.min(1,cl/55)}) saturate(${1+cl/90})`;
  return `saturate(${Math.max(.15,1-cl/55)}) brightness(${1+cl/220})`;
}
function texDefs(id,g){
  const d=shade(g.color,-.3);
  if(g.struct==='woven') return `<pattern id="${id}t" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 1.5 H3 M3 4.5 H6 M1.5 3 V6 M4.5 0 V3" stroke="${d}" stroke-width=".8" opacity=".5"/></pattern>`;
  return `<pattern id="${id}t" width="8" height="7" patternUnits="userSpaceOnUse"><path d="M0 1 L4 6 L8 1" fill="none" stroke="${d}" stroke-width=".9" opacity=".55"/></pattern>`;
}
function printLayer(g,c){
  if(g.print==='floral'){const r=rng('fl'+g.id);let s='';for(let i=0;i<16;i++){const x=40+r()*120,y=20+r()*190;s+=`<g transform="translate(${x} ${y})">${[0,72,144,216,288].map(a=>`<circle cx="${Math.cos(a*Math.PI/180)*4}" cy="${Math.sin(a*Math.PI/180)*4}" r="3.4" fill="#FFF3E6"/>`).join('')}<circle r="2.4" fill="#F7C548"/></g>`;}return s;}
  if(g.print==='stripe')return `<rect x="0" y="108" width="200" height="14" fill="${shade(c,.55)}"/><rect x="0" y="132" width="200" height="6" fill="${shade(c,-.25)}"/>`;
  if(g.print==='cable'){let s='';[76,124].forEach(x=>{for(let y=30;y<190;y+=16)s+=`<path d="M${x-7} ${y} Q${x} ${y+8} ${x+7} ${y+16} M${x+7} ${y} Q${x} ${y+8} ${x-7} ${y+16}" stroke="${shade(c,-.3)}" stroke-width="2.5" fill="none"/>`;});return s;}
  if(g.print==='dots'){let s='';for(let y=36;y<206;y+=18)for(let x=(y%36?30:39);x<182;x+=18)s+=`<circle cx="${x}" cy="${y}" r="3.4" fill="#fff" opacity=".85"/>`;return s;}
  if(g.print==='denim'){let s='';for(let i=-240;i<240;i+=5)s+=`<path d="M${i} 0 L${i+230} 230" stroke="${shade(c,.2)}" stroke-width=".8" opacity=".5"/>`;return s;}
  return '';
}
const WRK = (()=>{const r=rng('wrinkles');const a=[];for(let i=0;i<18;i++){const x=48+r()*104,y=38+r()*160,l=14+r()*22,a1=r()*Math.PI;a.push(`M${x.toFixed(1)} ${y.toFixed(1)} q${(Math.cos(a1)*l/2).toFixed(1)} ${(Math.sin(a1)*l/2+5).toFixed(1)} ${(Math.cos(a1)*l).toFixed(1)} ${(Math.sin(a1)*l).toFixed(1)}`);}return a;})();
const PILLS = (()=>{const r=rng('pills');const a=[];for(let i=0;i<40;i++)a.push([40+r()*120,40+r()*160]);return a;})();

/* 의복 SVG — g: 의복 데이터, st: 상태 */
function garmentSVG(g,st,opt={}){
  st = st || {soil:0,moisture:0,wrinkle:0,shape:100,color:100,damage:0,scorch:[],pills:0};
  const id='gs'+(UID++), sh=SHAPES[g.type], c=g.color, d=shade(c,c==='#FFFFFF'?-.28:-.35);
  const m=shapeMatrix(st), f=colorFilter(st);
  let s=`<svg viewBox="-10 -14 220 250" class="gsvg" style="overflow:visible;${f?'filter:'+f:''}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${id}c"><path d="${sh.body}"/></clipPath>${texDefs(id,g)}<radialGradient id="${id}s"><stop offset="0" stop-color="${g.soil.color}" stop-opacity=".95"/><stop offset=".6" stop-color="${g.soil.color}" stop-opacity=".55"/><stop offset="1" stop-color="${g.soil.color}" stop-opacity="0"/></radialGradient></defs>`;
  s+=`<g transform="matrix(${m.join(' ')})">`;
  if(sh.back) s+=sh.back(g,c,d);
  s+=`<path d="${sh.body}" fill="${c}"/>`;
  s+=`<g clip-path="url(#${id}c)"><rect x="-10" y="-10" width="220" height="250" fill="url(#${id}t)" opacity=".3"/>${printLayer(g,c)}</g>`;
  s+=sh.extra(g,c,d);
  s+=`<g clip-path="url(#${id}c)">`;
  if(!opt.noSoil && st.soil>1){const o=Math.min(1,st.soil/60);g.soil.spots.forEach(([x,y,r])=>{s+=`<ellipse cx="${x}" cy="${y}" rx="${r*1.25}" ry="${r}" fill="url(#${id}s)" opacity="${o.toFixed(2)}"/>`;});}
  if(!opt.noWrinkle && st.wrinkle>3){const n=Math.round(st.wrinkle/100*WRK.length);for(let i=0;i<n;i++)s+=`<path d="${WRK[i]}" stroke="${shade(c,-.45)}" stroke-width="1.6" fill="none" opacity=".45" stroke-linecap="round"/>`;}
  if(st.pills>0){const gone=st.pillGone||[];for(let i=0;i<Math.min(40,st.pills);i++){if(gone.includes(i))continue;const p=PILLS[i];s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${shade(c,.4)}" stroke="${shade(c,-.25)}" stroke-width=".7"/><circle cx="${p[0]-.8}" cy="${p[1]-.8}" r=".9" fill="#fff" opacity=".6"/>`;}}
  (st.scorch||[]).forEach(([x,y,k])=>{s+= k==='melt'?`<ellipse cx="${x}" cy="${y}" rx="9" ry="6" fill="#3d3d3d" opacity=".45"/><ellipse cx="${x-2}" cy="${y-2}" rx="5" ry="2" fill="#fff" opacity=".55"/>`:`<ellipse cx="${x}" cy="${y}" rx="10" ry="7" fill="#7A4A1A" opacity=".42"/>`;});
  if(st.damage>35){const r=rng('fray'+g.id);for(let i=0;i<Math.min(10,(st.damage-30)/5);i++){const x=50+r()*100,y=40+r()*160;s+=`<path d="M${x} ${y} l6 3 l-3 4" stroke="${shade(c,-.5)}" stroke-width="1.3" fill="none"/>`;}}
  if(st.damage>65){s+=`<ellipse cx="118" cy="138" rx="6" ry="4" fill="#00000055"/><ellipse cx="80" cy="96" rx="4" ry="3" fill="#00000055"/>`;}
  if(st.moisture>2) s+=`<rect x="-10" y="-10" width="220" height="250" fill="#174E7A" opacity="${(st.moisture/100*.32).toFixed(2)}"/>`;
  s+=`</g><path d="${sh.body}" fill="none" stroke="${d}" stroke-width="2.4" stroke-linejoin="round"/>`;
  if(st.moisture>55 && !opt.noDrip){[70,100,130].forEach((x,i)=>s+=`<path class="drip" style="animation-delay:${i*.3}s" d="M${x} ${218} q-4 7 0 10 q4 -3 0 -10z" fill="#4AA8E0"/>`);}
  s+=`</g></svg>`;
  return s;
}
function pillsLeft(st){if(!st.pills)return 0;const n=Math.min(40,st.pills);return n-(st.pillGone||[]).filter(i=>i<n).length;}
function garmentPath2D(g,st){const p=new Path2D(),b=new Path2D(SHAPES[g.type].body);const m=shapeMatrix(st);p.addPath(b,new DOMMatrix(m));return p;}

/* 확대경 속 옷감 조직 */
function weaveSVG(g){
  const c=g.color, d=shade(c,c==='#FFFFFF'?-.3:-.4), l=shade(c,.3);
  let s=`<svg viewBox="0 0 160 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="160" fill="${shade(c,-.15)}"/>`;
  if(g.struct==='woven'){
    for(let r=0;r<8;r++)for(let k=0;k<8;k++){const x=k*20,y=r*20,over=(r+k)%2===0;
      if(over){s+=`<rect x="${x}" y="${y+4}" width="20" height="12" rx="5" fill="${c}" stroke="${d}"/><rect x="${x+4}" y="${y}" width="12" height="4" fill="${l}" stroke="${d}"/><rect x="${x+4}" y="${y+16}" width="12" height="4" fill="${l}" stroke="${d}"/>`;}
      else{s+=`<rect x="${x+4}" y="${y}" width="12" height="20" rx="5" fill="${l}" stroke="${d}"/><rect x="${x}" y="${y+4}" width="4" height="12" fill="${c}" stroke="${d}"/><rect x="${x+16}" y="${y+4}" width="4" height="12" fill="${c}" stroke="${d}"/>`;}}
    s+=`<text x="6" y="154" font-size="11" fill="#fff" stroke="#0008" stroke-width="2.5" paint-order="stroke">날실 ↕ · 씨실 ↔ 교차</text>`;
  }else{
    for(let r=-1;r<9;r++)for(let k=0;k<8;k++){const x=k*20+10,y=r*18+10;
      s+=`<path d="M${x-9} ${y-6} Q${x-9} ${y+12} ${x} ${y+16} Q${x+9} ${y+12} ${x+9} ${y-6}" fill="none" stroke="${d}" stroke-width="7" stroke-linecap="round"/><path d="M${x-9} ${y-6} Q${x-9} ${y+12} ${x} ${y+16} Q${x+9} ${y+12} ${x+9} ${y-6}" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`;}
    s+=`<text x="6" y="154" font-size="11" fill="#fff" stroke="#0008" stroke-width="2.5" paint-order="stroke">실이 고리로 이어진 모양</text>`;
  }
  return s+`</svg>`;
}

  if(look.style===0) hair=`<path d="M38 80 Q36 30 80 28 Q124 30 122 80 Q118 52 80 50 Q44 52 38 80Z" fill="${h}"/>`;
  else if(look.style===1){ back=`<path d="M34 122 Q26 34 80 28 Q134 34 126 122 Z" fill="${h}"/>`; hair=`<path d="M40 78 Q40 30 80 30 Q120 30 120 78 Q102 50 80 56 Q58 50 40 78Z" fill="${h}"/>`; }
  else if(look.style===2) hair=`<path d="M40 76 Q40 28 80 26 Q120 28 120 76 Q104 44 70 50 Q52 54 40 76Z" fill="${h}"/><circle cx="80" cy="22" r="14" fill="${h}"/>`;
  else hair=`<path d="M36 90 Q30 30 80 28 Q130 30 124 90 Q122 64 108 56 Q90 66 60 58 Q42 64 36 90Z" fill="${h}"/>`;

    : mood==='sad'?`<circle cx="68" cy="80" r="4" fill="#2a2a2a"/><circle cx="94" cy="80" r="4" fill="#2a2a2a"/><path d="M60 70 L74 66 M102 70 L88 66" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/><path d="M66 88 q-3 8 0 10 q3 -2 0 -10z" fill="#6EC1F0"/>`
    : `<circle cx="68" cy="80" r="4.2" fill="#2a2a2a"/><circle cx="94" cy="80" r="4.2" fill="#2a2a2a"/><circle cx="69.5" cy="78.5" r="1.3" fill="#fff"/><circle cx="95.5" cy="78.5" r="1.3" fill="#fff"/>`;
  const mouth = {neutral:'<path d="M72 100 q9 4 18 0" stroke="#7a3b2e" stroke-width="3" fill="none" stroke-linecap="round"/>',
    happy:'<path d="M70 98 q11 12 22 0" stroke="#7a3b2e" stroke-width="3" fill="none" stroke-linecap="round"/>',
    joy:'<path d="M68 96 q13 18 26 0 z" fill="#B5473A"/><path d="M73 104 q8 5 16 0" fill="#F28B82"/>',
    sad:'<path d="M70 106 q11 -10 22 0" stroke="#7a3b2e" stroke-width="3" fill="none" stroke-linecap="round"/>',
    angry:'<path d="M70 106 q11 -9 22 0 z" fill="#7a3b2e"/>',
    worry:'<path d="M70 102 q5 -4 10 0 t10 0 t6 0" stroke="#7a3b2e" stroke-width="3" fill="none" stroke-linecap="round"/>'}[mood]||'';
  const extra = mood==='joy'?`<path d="M128 40 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4z" fill="#FFD447"/>`:mood==='angry'?`<path d="M126 44 l6 -6 m0 6 l-6 -6 m10 10 l6 -6 m0 6 l-6 -6" stroke="#E2574C" stroke-width="3"/>`:'';
  return `<svg viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;overflow:visible"><path d="M18 200 Q22 132 80 126 Q138 132 142 200 Z" fill="${sh}"/><path d="M62 128 Q80 146 98 128" fill="${shade(sh,-.2)}"/><rect x="70" y="108" width="20" height="22" fill="${shade(sk,-.08)}"/>${back}<ellipse cx="80" cy="80" rx="42" ry="44" fill="${sk}"/>${hair}<ellipse cx="58" cy="94" rx="7" ry="4" fill="#F4978E" opacity="${mood==='angry'?.9:.5}"/><ellipse cx="104" cy="94" rx="7" ry="4" fill="#F4978E" opacity="${mood==='angry'?.9:.5}"/>${eyes}${mouth}${extra}</svg>`;
}

const X = `<path d="M10 8 L60 52 M60 8 L10 52" stroke="#D9483B" stroke-width="4" stroke-linecap="round"/>`;
function txt(x,y,t,sz=11,w='bold'){return `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" text-anchor="middle" fill="#222" font-family="'Malgun Gothic',sans-serif">${t}</text>`;}
function careSymbol(kind,L){
  const W=(inner)=>`<svg viewBox="0 0 70 60" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

      } else logp(o,'good',st,p.det==='neu'?'섬세한 의복에 맞게 중성세제를 사용했어요.':'튼튼한 옷감에 세척력이 좋은 약알칼리성 세제를 사용했어요.');
      if(method==='hand'){handEval(o,g,p.hand);if(L.wash.mode==='machine')logp(o,'info',st,'세탁기 세탁이 가능한 옷도 손세탁할 수 있어요. 대신 시간과 힘이 더 들어요.');}
      else if(L.wash.mode!=='hand') logp(o,'good',st,'세탁기 사용이 가능한 의복이라 기계 세탁을 했어요.');
    }
  } else {
    if(!L.dc){
      const why=(g.id==='leggings'?'스판덱스는 드라이클리닝 용제에 손상되어 탄력을 잃을 수 있어요.':g.id==='nylon'?'방수 코팅이 유기 용제에 녹거나 벗겨질 수 있어요.':'옷감·염료·부자재가 용제에 손상될 수 있어요.')+' 이 옷은 물세탁 표시를 따라 세탁해야 해요.';
      hurt(o,{damage:26,shape:10,shapeType:'deform'});
      logp(o,'bad',st,'드라이클리닝 금지 표시가 있는 의복을 드라이클리닝했어요. '+why);
    } else {
      logp(o,'good',st,'물세탁 금지·드라이클리닝 표시를 보고 드라이클리닝을 선택했어요. 물 대신 유기 용제를 써서 물에 의한 수축·변형을 막았어요.');
      if(g.soil.kind==='water') logp(o,'info',st,'땀·음료 같은 수용성 오염은 유기 용제로 잘 빠지지 않아요. 기름 얼룩에는 드라이클리닝이, 수용성 오염에는 물세탁이 효과적이에요.');

  else if(method==='hand') r=.9*{shake:.86,press:.94,knead:1.03,rub:1.14}[p.hand]*{20:.78,30:.92,40:1}[p.temp]*(p.det==='alk'?1:.93);
  else r=g.soil.kind==='oil'?.97:.55;
  if(water&&has(g,'acrylic')){const add=method==='machine'?({'약':12,'보통':18,'강':24}[p.str]||14):({shake:10,knead:16,rub:22}[p.hand]||12);s.pills=Math.min(40,(s.pills||0)+add);
    logp(o,'info',st,'아크릴은 마찰에 약해 세탁 중에 보풀이 생겼어요. 다림질 전에 보풀 제거기로 정리해요.');}
  if(water&&g.soil.level>=70){
    if(o.flags.prewashed){r*=1.08;logp(o,'good',st,'애벌빨래로 때를 불려 두어서 본세탁에서 찌든 때가 잘 빠졌어요.');}
    else{r*=.8;logp(o,'warn',st,'오염도가 70% 이상인 찌든 옷은 본세탁 전에 애벌빨래를 하면 훨씬 깨끗해져요. 이번엔 때가 조금 남았어요.');}
  }

  if(g.soil.bleachStain&&!o.flags.bleached){s.soil=Math.max(s.soil,28);}

  s.wrinkle=clamp(g.wrinkle+(method==='machine'&&p.str==='강'?10:0)-(method==='dry'?g.wrinkle*.35:0),0,100);
  if(!o.paid){o.paid=Math.round(g.price*.5/100)*100;G.money+=o.paid;if(typeof earnFx==='function')earnFx(o.paid,'세탁 완료! 세탁 요금');}
  o.steps.wash=method;o.steps.iron=null;
  o.steps.dewater=method==='dry'?'dc':null;o.steps.dry=method==='dry'?'dc':null;
  save();
}
function doPrewash(o,p){

  else logp(o,'good',st,'오염도가 70% 이상인 찌든 옷을 본세탁 전에 애벌빨래했어요. 세제 물에 담가 때를 불린 뒤 빨면 본세탁에서 오염이 잘 빠져요.');
  if(p.temp===30)logp(o,'good',st,'미지근한 물(30℃)에 세제를 풀어 담갔어요. 때가 잘 불어나요.');
  else if(p.temp===20)logp(o,'warn',st,'찬물에서는 때가 잘 불지 않아요. 애벌빨래는 미지근한 물이 알맞아요.');

  else logp(o,'info',st,'따뜻한 물도 괜찮지만, 애벌빨래는 미지근한 물이면 충분해요.');
  if(p.det==='alk'&&(L.wash.neutral||isProtein(g))){hurt(o,{damage:4,color:3,colorType:'fade'});logp(o,'warn',st,'표시에 중성세제가 적힌 옷은 애벌빨래도 중성세제로 해요.');}

function doBleach(o,k){

    else logp(o,'good',st,'세탁만으로 빠지는 얼룩이라 표백하지 않았어요. 표백은 꼭 필요할 때만 해요.');
    save();return 'none';

      logp(o,'good',st,k==='chlorine'?'흰색 면 의복에 염소계 표백제를 사용해 누런 얼룩을 없앴어요. 표시에서 염소계 표백을 허용했기 때문에 쓸 수 있어요.':'표시에서 허용한 산소계 표백제로 누런 얼룩을 없앴어요. 산소계는 비교적 순해 색깔 옷에도 쓸 수 있는 경우가 많아요.');}
    else {o.st.soil=Math.max(0,o.st.soil-8);logp(o,'info',st,'표시에서 허용한 표백제라 손상은 없지만, 이 얼룩은 세탁만으로도 빠지는 정도라 표백이 꼭 필요하지는 않았어요.');}
    save();return 'ok';
  }
  if(k==='chlorine'&&L.bleach==='oxygen'){hurt(o,{color:32,colorType:'fade',damage:6});logp(o,'bad',st,'산소계 표백만 가능한 의복에 염소계 표백제를 써서 색이 빠졌어요(탈색). 염소계는 표백력이 강해 염료까지 파괴해요.');}
  else if(isProtein(g)){hurt(o,{color:28,colorType:'yellow',damage:20});logp(o,'bad',st,'표백 금지 표시가 있어요. 견·모 같은 단백질 섬유는 표백제에 손상되고 누렇게 변해요.');}
  else if(has(g,'spandex')&&pct(g,'spandex')>=10){hurt(o,{damage:26,shape:12,shapeType:'stretch',color:10,colorType:'fade'});logp(o,'bad',st,'표백 금지 표시가 있어요. 스판덱스가 섞인 의복은 표백제(특히 염소계)에 탄력을 잃고 늘어나요.');}
  else {hurt(o,{color:26,colorType:'fade',damage:8});logp(o,'bad',st,'표백 금지 표시가 있는 의복을 표백해 색이 빠지고 옷감이 상했어요.');}
  save();return 'bad';

function doIron(o,info){

  const line=(ok,t,v)=>`<span class="${ok?'d':'p'}">${ok?'✔':'○'} ${t}${v?' — '+v:''}</span>`;
  const dry=s.dry==='dc'?'필요 없음':s.dry==='machine'?'기계 건조':s.dry?({sun:'햇빛',shade:'그늘'}[s.dry.split('-')[0]]+' · '+{hang:'옷걸이',rack:'건조대',flat:'뉘어서'}[s.dry.split('-')[1]]):'';
  return `<div class="chk">${line(true,'접수')}${line(inspected(o),'검사(구조·섬유·라벨)')}${GD(o).soil.level>=70||o.flags.prewashed?line(!!o.flags.prewashed,'애벌빨래 (오염 70% 이상)',o.flags.prewashed?'완료':''):''}${line(!!s.bleach,'표백 (필요할 때)',B[s.bleach])}${line(!!s.wash,'세탁',W[s.wash])}${line(!!s.dewater,'탈수',s.dewater==='dc'?'필요 없음':s.dewater?DEWATER[s.dewater].name:'')}${line(!!s.dry,'건조',dry)}${line(!!s.iron,'다림질 (필요할 때)',s.iron==='skip'?'생략':s.iron?'완료':'')}</div>`;
}
function renderTray(){

  if(!G.orders.length){T.innerHTML=`<h3>작업 바구니</h3><p class="note" style="margin-top:12px">비어 있어요.<br>고객 접수대에서 손님의 옷을 받아 주세요.</p><p class="note">동시에 맡을 수 있는 주문: ${maxOrders()}건</p>`;return;}
  if(!act())G.active=G.orders[0].no;
  const o=act();const g=GD(o);
  const pt=x=>G.mode==='challenge'&&x.due?patBar(x.due,x.dueT,46):'';
  T.innerHTML=`<h3>작업 바구니 <small style="font-size:13px;color:#777">${G.orders.length}/${maxOrders()}</small></h3>
  ${G.orders.length>1?`<div class="tabs" style="flex-wrap:wrap">${G.orders.map(x=>{const m=x.loc&&(G.mach[x.loc]||G.nat[x.loc]);return `<button data-no="${x.no}" class="${x.no===o.no?'on':''}" style="min-width:70px">No.${x.no}${m?(m.st==='done'?' ✅':m.st==='running'?' ⏳':' 📍'):''}<br>${pt(x)}</button>`;}).join('')}</div>`:''}
  <div class="ticket"><div class="no">No.${o.no} · ${o.cust.name} 님</div><div style="font-size:15px">${g.name}</div><div style="font-size:12.5px;color:#6b5530">${mixText(g)}</div>
   ${G.mode==='challenge'&&o.due?`<div style="font-size:12.5px;margin-top:3px">약속 시간 ${patBar(o.due,o.dueT,90)} <b data-until="${o.due}"></b></div>`:''}</div>
  <div class="mini" id="trayG">${o.loc?`<div style="text-align:center;padding:26px 4px;color:#555;font-size:14px;line-height:1.5">${locStatus(o)}</div>`:garmentSVG(g,o.st)}</div>

  T.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{G.active=+b.dataset.no;save();renderTray();renderNav();if(['inspect','prewash','bleach','hand','iron','deliver','spin'].includes(STATION)&&!(STATION==='spin'&&S.method&&S.method.startsWith('spin')))go(STATION,{unit:S.unit});});
  $('#trayLabel').onclick=()=>openLabel(o,STATION==='inspect');
  const tg=$('#trayGo');if(tg)tg.onclick=()=>{const l=locStation(o);go(l[0],l[1]);};
  if(!o.loc) draggable($('#trayG'),{kind:'garment'},garmentSVG(g,o.st),{w:170});
  updTimers();
}

  if(G)G.orders.forEach(o=>{if(FG.includes(o.loc)){o.loc=null;}});

/* ---------- 결과(고객 전달) ---------- */
function deliverOrder(o){
  $('#toasts').innerHTML='';
  const g=GD(o),q=quality(o);
  let grade,mood,mult,dsat,col;
  if(q>=88){grade='완벽한 세탁';mood='joy';mult=1.3;dsat=5;col='#2F9E6A';}
  else if(q>=72){grade='좋은 세탁';mood='happy';mult=1;dsat=2;col='#2E8A8F';}
  else if(q>=50){grade='일부 오류';mood='worry';mult=.6;dsat=-4;col='#D9A21B';}
  else {grade='심각한 손상';mood='angry';mult=-.8;dsat=-10;col='#D9483B';}
  const late=G.mode==='challenge'&&o.due&&GT()>o.due, fast=G.mode==='challenge'&&o.due&&!late&&(o.due-GT())>o.dueT*.4;
  const deco=['plants','neon','tiles'].filter(k=>G.upg[k]).length;
  let m2=mult; if(m2>0){ if(late)m2*=.6; else { if(fast)m2+=.1; m2+=deco*.05*(m2>=1?1:0); } }
  if(late)dsat-=4;
  const total=Math.round(g.price*m2/100)*100, paid=o.paid||0, money=total-paid;
  G.money+=money;if(money>0)setTimeout(()=>earnFx(money,'전달 정산'),300);G.sat=clamp(G.sat+dsat,0,100);G.served[g.id]=(G.served[g.id]||0)+1;G.done++;
  if(mult>=1){G.success++;}
  G.xp+=mult>=1.3?3:mult>=1?2:mult>0?1:0;
  G.orders=G.orders.filter(x=>x.no!==o.no);G.active=G.orders.length?G.orders[0].no:null;
  const c=complaints(o);
  const say0={joy:pick(['우와, 새 옷 같아요! 정말 고마워요!','완벽해요! 다음에도 꼭 여기로 올게요.']),happy:pick(['깔끔하네요. 고맙습니다!','잘 맡긴 것 같아요.']),worry:'음… '+(c[0]||'조금 아쉬워요.'),angry:(c[0]||'옷이 상했어요!')+' 보상해 주세요!'}[mood];
  const say=(late?'너무 오래 기다렸어요… ':fast&&mult>=1?'이렇게 빨리요? ':'')+say0;
  let up='';
  if(G.tier<3&&G.success>=TIER_NEED[G.tier+1]){G.tier++;up=G.tier;}
  fillQueue();save();
  const groups={bad:'❌',warn:'⚠️',good:'✅',info:'💡'};
  const logs=[...o.log].sort((a,b)=>['bad','warn','info','good'].indexOf(a.t)-['bad','warn','info','good'].indexOf(b.t));
  openModal(`<div class="result"><div style="text-align:center"><div style="width:220px;margin:0 auto">${personSVG(o.cust.look,mood)}</div>
    <div style="background:#fff;border:2px solid var(--teal);border-radius:14px;padding:10px;margin-top:8px;font-size:17px">“${say}”</div>
    <div class="stamp" style="color:${col};border-color:${col}">${grade}</div>
    <div style="font-size:18px">작업 점수 <b>${q}</b>점</div>
    <div style="font-size:15px;margin-top:6px;line-height:1.6;background:#FFF9EE;border-radius:10px;padding:6px">세탁 완료 때 받은 요금 <b>+${won(paid)}</b><br>전달 정산(${late?'늦어서 요금 할인':mult<0?'보상 비용':m2>1?'팁 포함':mult<1?'요금 할인':'남은 요금'}) <b style="color:${money<0?'#D9483B':'#2F9E6A'}">${money>=0?'+':''}${won(money)}</b></div>
    <div style="font-size:20px;margin-top:4px;color:${total<0?'#D9483B':'#2F9E6A'}">이 주문의 최종 ${total<0?'손해':'수익'} ${won(total)}</div>
    <div class="note">고객 만족도 ${dsat>0?'+':''}${dsat}%${late?' (약속 시간 초과)':fast?' · ⚡ 빠른 서비스 팁 +10%':''}${deco&&mult>=1&&!late?` · 🪴 인테리어 팁 +${deco*5}%`:''}</div></div>
    <div><h2>${o.cust.name} 님의 ${g.name}</h2><div style="width:180px;float:right;margin-left:10px">${garmentSVG(g,o.st)}</div>${statusBars(o.st)}
    <h3 style="font-family:var(--disp);font-size:21px;color:var(--teal);margin-top:12px;clear:both">작업 돌아보기</h3>
    <div class="loglist">${logs.map(l=>`<div class="${l.t}"><b>${groups[l.t]}</b>[${l.step}] ${l.msg}</div>`).join('')||'<div class="info"><b>💡</b>기록이 없어요.</div>'}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn main" id="rNext">다음 손님 맞이하기</button></div></div></div>`,()=>{if(up)showTierUp(up);});
  $('#rNext').onclick=()=>{closeModal();go('reception');};
}
function showTierUp(t){
  const nw=GARMENTS.filter(g=>g.tier===t).map(g=>g.name).join(', ');
  openModal(`<div style="width:640px;text-align:center"><h2>🎉 ${TIERS[t]}(으)로 승급!</h2><p style="font-size:18px">새로운 의복을 맡길 손님이 찾아와요.</p><div class="callout" style="text-align:left">새 의복: ${nw}</div><p class="note">상점에서 작업 바구니를 늘리고 기계를 더 들이면 여러 주문을 동시에 처리하기 쉬워져요.</p><button class="btn main" id="tuOk">계속하기</button></div>`);

}

function openShop(tab='supply'){

  $('#mMode').onclick=()=>{G.mode=G.mode==='challenge'?'practice':'challenge';G.queue.forEach(c=>c.arr=GT());G.orders.forEach(o=>{if(G.mode==='challenge'&&!o.due){o.dueT=dueTime(o);o.due=GT()+o.dueT;}if(G.mode==='practice'){o.due=null;}});if(G.mode==='practice')fillQueue();else G.nextArr=GT()+15;save();closeModal();go(STATION);toast(G.mode==='challenge'?'⏱️ 도전 모드! 손님이 기다리다 지치기 전에 처리해요.':'🌱 연습 모드: 시간 제한 없이 천천히 해요.','good');};
  $('#mTeach').onclick=()=>{closeModal();openTeacher();};
  $('#mTitle').onclick=()=>{save();closeModal();showTitle();};
  $('#mReset').onclick=()=>{if(confirm('저장된 진행 상황을 모두 지우고 처음부터 시작할까요?')){try{localStorage.removeItem(SAVE_KEY);}catch(e){}closeModal();showTitle();}};
}
function openTeacher(){
  openModal(`<div style="width:620px"><h2>교사 설정</h2>${G.teacher?'':`<p class="note">교사 확인 번호를 입력하면 모든 단계를 개방할 수 있어요. (기본 번호: 교사용 안내 참고)</p><div class="row"><input id="tc" type="password" inputmode="numeric" style="font-size:18px;padding:8px;border-radius:10px;border:2px solid var(--teal);width:200px" placeholder="확인 번호"><button class="btn main" id="tcOk">확인</button></div>`}
  ${G.teacher?`<p>모든 단계가 열려 있어요. 이번 차시에 등장할 의복을 고르세요.</p><div class="row" id="tf">${[0,1,2,3].map(t=>`<button class="btn ${G.tierFilter===t?'sel':''}" data-t="${t}">${t?TIERS[t]+' 의복':'전체 의복'}</button>`).join('')}</div><p class="note" style="margin-top:10px">초급: 면·마·견·모 / 중급: 나일론·폴리에스테르·아크릴·스판덱스 / 고급: 레이온·아세테이트·혼방 의복. 바꾼 뒤 새로 오는 손님부터 적용돼요.</p>`:''}</div>`);
  if(!G.teacher){$('#tcOk').onclick=()=>{if($('#tc').value.trim()==='2022'){G.teacher=true;G.tier=3;save();toast('교사 모드: 모든 단계를 개방했어요.','good');closeModal();go(STATION);openTeacher();}else toast('확인 번호가 맞지 않아요.','bad');};}
  else document.querySelectorAll('#tf button').forEach(b=>b.onclick=()=>{G.tierFilter=+b.dataset.t;G.queue=[];fillQueue();save();closeModal();go(STATION);toast('대기 손님을 새로 불렀어요.','good');});
}

 ['nat','천연 섬유와 인조 섬유'],['pa','식물성 섬유와 동물성 섬유'],['rs','재생 섬유와 합성 섬유'],['n4','면·마·견·모의 특성'],['ra','레이온·아세테이트의 특성'],['s4','나일론·폴리에스테르·아크릴·스판덱스'],
 ['ws','직물과 편성물의 차이'],['wash','세탁 방법'],['det','세제의 종류'],['bl','표백제의 종류'],['dw','탈수 방법'],['dry','건조 방법'],['iron','다림질 온도'],['care','취급 주의 표시']];
function dots(n){return '●'.repeat(n)+'○'.repeat(3-n);}
function fiberCard(k){const f=FIBERS[k];const sample=GARMENTS.find(g=>g.main===k&&g.mix[0].items.length===1&&g.mix.length===1&&!['quilt','blanket'].includes(g.type))||GARMENTS.find(g=>has(g,k));
  return `<div class="fcard"><div>${garmentSVG(sample,null)}<div style="text-align:center;font-family:var(--disp);font-size:24px">${f.name}</div></div><div><b>${CAT[f.cat]}</b><br>원료: ${f.raw}<br>
  <span class="dots">흡습성 ${dots(f.absorb)} · 통기성 ${dots(f.breath)} · 보온성 ${dots(f.warm)} · 신축성 ${dots(f.stretch)} · 구김 발생 ${dots(f.crease)}</span><br>
  열에 대한 반응: ${f.heat}<br>수축·변형: ${f.shrink}<br>관리: ${f.care}<br><span class="note">${f.feel}</span></div></div>`;}

  case 'pa':return `<h3>식물성 섬유와 동물성 섬유</h3><table><tr><th>구분</th><th>성분</th><th>섬유</th><th>관리의 특징</th></tr><tr><td>식물성 섬유</td><td>셀룰로오스</td><td>면, 마</td><td>알칼리에 강해 약알칼리성 세제 사용 가능, 열에 강해 고온 다림질 가능</td></tr><tr><td>동물성 섬유</td><td>단백질</td><td>견, 모</td><td>알칼리에 약해 중성세제 사용, 염소계 표백제 금지, 열·마찰에 약함</td></tr></table>`;
  case 'rs':return `<h3>재생 섬유와 합성 섬유</h3><p>인조 섬유는 원료에 따라 재생 섬유와 합성 섬유로 나눠요.</p><table><tr><th>구분</th><th>만드는 방법</th><th>섬유</th></tr><tr><td>재생 섬유</td><td>목재 펄프 등 천연의 셀룰로오스를 원료로, 화학적으로 처리해 다시 섬유로 뽑아냄</td><td>레이온, 아세테이트</td></tr><tr><td>합성 섬유</td><td>석유 등을 원료로 화학적으로 합성함</td><td>나일론, 폴리에스테르, 아크릴, 스판덱스</td></tr></table><p>재생 섬유는 흡습성이 좋은 편이고, 합성 섬유는 대체로 질기고 구김이 적으며 빨리 마르지만 흡습성이 낮고 열에 약해요.</p>`;
  case 'n4':return `<h3>면·마·견·모의 특성</h3>${['cotton','linen','silk','wool'].map(fiberCard).join('')}`;
  case 'ra':return `<h3>레이온·아세테이트의 특성</h3>${['rayon','acetate'].map(fiberCard).join('')}`;
  case 's4':return `<h3>합성 섬유의 특성</h3>${['nylon','polyester','acrylic','spandex'].map(fiberCard).join('')}`;
  case 'ws':{const a=GBY.shirt,b=GBY.tee;return `<h3>직물과 편성물의 차이</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="fcard" style="display:block"><h4>직물</h4><div style="width:160px;height:160px;border-radius:50%;overflow:hidden;border:4px solid var(--teal)">${weaveSVG(a)}</div><p>날실과 씨실을 서로 교차하여 만든 옷감. 형태 안정성이 비교적 좋아요.</p><p class="note">예: 셔츠, 블라우스, 정장 바지, 청바지</p></div><div class="fcard" style="display:block"><h4>편성물</h4><div style="width:160px;height:160px;border-radius:50%;overflow:hidden;border:4px solid var(--pink2)">${weaveSVG(b)}</div><p>실로 연속적인 고리를 만들어 짠 옷감. 신축성이 좋지만 젖으면 늘어나기 쉬워요.</p><p class="note">예: 니트, 스웨터, 티셔츠, 레깅스</p></div></div><div class="callout">관리의 차이: 형태 변형에 민감한 편성물(특히 니트)은 비틀어 짜지 않고 수건으로 눌러 물기를 빼며, 평평하게 뉘어서 말리는 경우가 많아요. 하지만 모든 편성물이 그런 것은 아니에요. 섬유의 특성과 취급 주의 표시를 함께 봐야 해요.</div>`;}

  case 'det':return `<h3>세제의 종류</h3><table><tr><th>세제</th><th>특징</th><th>알맞은 의복</th></tr><tr><td>약알칼리성 세제</td><td>세척력이 좋아 찌든 때를 잘 뺌</td><td>면·마·합성 섬유의 일반 세탁</td></tr><tr><td>중성세제</td><td>섬유 손상이 적고 순함</td><td>견·모 등 알칼리에 약한 단백질 섬유, 섬세한 의복, 표시에 '중성'이 있는 옷</td></tr></table>`;
  case 'bl':return `<h3>표백제의 종류</h3><table><tr><th>표백제</th><th>특징</th><th>주의</th></tr><tr><td>산소계 표백제</td><td>비교적 순해 색깔 옷에도 쓸 수 있는 경우가 많음</td><td>모든 의복에 쓸 수 있는 것은 아님 — 표시 확인</td></tr><tr><td>염소계 표백제</td><td>표백력이 강해 흰 면·마 등에 사용</td><td>색깔 옷은 탈색, 견·모·스판덱스 등은 손상 — 표시 확인</td></tr></table><div class="callout">표백 가능 여부는 <b>취급 주의 표시가 우선</b>이에요. 표백이 필요 없으면 하지 않는 것이 올바른 선택이에요. 서로 다른 표백제나 세제를 <b>절대 섞지 않아요</b>(유독 가스가 생길 수 있어요).</div>`;

}

     <div style="width:100%;height:170px">${basketSVG()}</div><div style="text-align:center;font-family:var(--disp);font-size:22px;color:#7A5320">접수 바구니</div></div>`+plants();

  if(!full) draggable($('#recG'),{kind:'recv'},garmentSVG(g,null),{w:200});
  DROP.basket=(p)=>{
    if(p.kind!=='recv')return;
    if(G.orders.length>=maxOrders()){toast('작업 바구니가 가득 찼어요.','warn');return;}
    const o=newOrder(c);if(G.mode==='challenge'){o.dueT=dueTime(o);o.due=GT()+o.dueT;}G.orders.push(o);G.active=o.no;G.queue.shift();fillQueue();save();
    $('#recG').innerHTML='';$('#cust').classList.add('walkout');
    toast(`No.${o.no} ${g.name} 접수 완료!`+(G.mode==='challenge'?` 약속 시간은 ${fmtT(o.dueT)}이에요.`:' 의복 검사대로 옮겨 검사해 보세요.'),'good');
    refresh();setTimeout(()=>{if(STATION==='reception')go('reception');},950);
  };
};

/* ---------- 2. 의복 검사대 ---------- */
SCENES.inspect=function(){
  if(needOrder('의복 검사대'))return;
  const o=act(),g=GD(o);
  sc().innerHTML=guide('의복 검사대','<b>확대경</b>을 끌어 옷 위로 움직이며 옷감의 조직을 관찰해요. 그다음 오른쪽 질문에 답해요.')+
  `<div class="abs" style="left:30px;top:84px;width:650px;height:730px;background:#5FAF8F;border-radius:22px;border:6px solid #3E8A6E;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);background-size:30px 30px"></div>
   <div id="insG" class="abs" style="left:110px;top:120px;width:460px">${garmentSVG(g,o.st)}</div>
   <div id="lens" class="abs grab" style="left:470px;top:600px;width:200px;height:200px;z-index:6">
     <div style="position:absolute;left:150px;top:150px;width:26px;height:90px;background:#7A5320;border-radius:10px;transform:rotate(-45deg);transform-origin:top center"></div>
     <div id="lensIn" style="position:absolute;inset:0;border-radius:50%;overflow:hidden;border:12px solid #2F4B55;background:radial-gradient(#ffffffcc,#e6f7ffaa);box-shadow:0 8px 16px rgba(0,0,0,.3)"><div style="padding:56px 14px;text-align:center;font-size:14px;color:#2F4B55">확대경을<br>옷 위로 옮겨요</div></div></div>
   <div class="panel" id="insP" style="left:700px;top:84px;width:490px;max-height:740px;overflow:auto"></div>`;
  S.look=0;S.looked=o.steps.struct;
  const path=garmentPath2D(g,o.st);const cv=document.createElement('canvas').getContext('2d');
  const lens=$('#lens');let dragging=false,off={x:0,y:0};
  lens.addEventListener('pointerdown',e=>{dragging=true;const p=lp(e,lens);off={x:p.x,y:p.y};lens.setPointerCapture(e.pointerId);e.preventDefault();});
  lens.addEventListener('pointermove',e=>{if(!dragging)return;const p=lp(e,sc());const x=p.x-off.x,y=p.y-off.y;lens.style.left=x+'px';lens.style.top=y+'px';
    const gr=$('#insG').getBoundingClientRect(),lr=$('#lensIn').getBoundingClientRect();
    const cx=(lr.left+lr.width/2-gr.left)/SCALE,cy=(lr.top+lr.height/2-gr.top)/SCALE,W=gr.width/SCALE,H=gr.height/SCALE;
    const gx=cx/W*220-10,gy=cy/H*250-14;
    const inside=cv.isPointInPath(path,gx,gy);
    if(inside){if(!S.inW){$('#lensIn').innerHTML=weaveSVG(g);S.inW=true;}S.look++;if(S.look>8&&!S.looked){S.looked=true;renderP();}}
    else if(S.inW){S.inW=false;$('#lensIn').innerHTML='<div style="padding:62px 14px;text-align:center;font-size:14px;color:#2F4B55">옷 위로<br>옮겨요</div>';}
  });
  lens.addEventListener('pointerup',()=>dragging=false);
  const fib=FIBERS[g.quiz];
  const q2=g.id==='acetate'?`안감 섬유인 <b>아세테이트</b>는 어떤 섬유로 분류될까요?`:g.mix[0].items.length>1?`가장 많이 섞인 섬유인 <b>${fib.name}</b>은(는) 어떤 섬유로 분류될까요?`:`<b>${fib.name}</b> 섬유는 어떤 섬유로 분류될까요?`;
  function renderP(){
    const P=$('#insP');const s=o.steps;
    P.innerHTML=`<h3>${g.name} 검사하기</h3><p class="note" style="margin:0">오염 상태: ${g.soil.desc} (${soilWord(g.soil.level)})</p>
    <div class="lbl">① 옷감 구조 — 확대경으로 본 조직은?</div>
    ${s.struct?`<div class="callout" style="margin:4px 0">✔ ${g.struct==='woven'?'날실과 씨실이 교차하는 <b>직물</b>':'실이 고리 모양으로 이어진 <b>편성물</b>'}이에요. ${g.main==='cotton'&&g.mix[0].items.length===1?(g.struct==='knit'?'같은 면이라도 셔츠는 직물, 티셔츠는 편성물이에요.':'같은 면이라도 티셔츠는 편성물, 셔츠는 직물이에요.'):'섬유의 종류와 옷감의 구조는 서로 다른 개념이에요.'}</div>`
      :`<div class="row"><button class="btn" data-s="woven" ${S.looked?'':'disabled'}>직물</button><button class="btn" data-s="knit" ${S.looked?'':'disabled'}>편성물</button>${S.looked?'':'<span class="note">먼저 확대경으로 관찰해요</span>'}</div>`}
    <div class="lbl">② 섬유 분류 — ${q2}</div>
    ${s.fiber?`<div class="callout" style="margin:4px 0">✔ ${fib.name}: ${CAT[fib.cat]}. ${fib.feel}.</div>`
      :`<div class="row" style="gap:6px">${Object.entries(CAT).map(([k,v])=>`<button class="btn small" data-c="${k}">${v}</button>`).join('')}</div>`}
    <div class="lbl">③ 취급 주의 표시 확인</div>
    ${s.label?'<div class="callout" style="margin:4px 0">✔ 라벨을 확인했어요. 작업 중에도 오른쪽 작업 바구니에서 언제든 다시 볼 수 있어요.</div>':'<button class="btn pink" id="insL">🏷️ 라벨 확대해서 읽기</button>'}
    ${inspected(o)?`<div class="callout" style="background:#ECFAF2;border-color:#2F9E6A;margin-top:14px"><b>검사 완료!</b> 오염도가 <b>70% 이상</b>이면 먼저 애벌빨래를 해요. 그다음 라벨을 보고 표백이 필요한지, 어떤 방법으로 세탁할지 정해요.</div><div class="row"><button class="btn" data-g="prewash">🪣 애벌빨래</button><button class="btn" data-g="bleach">🧴 표백 작업대</button><button class="btn" data-g="machine">🫧 기계 세탁</button><button class="btn" data-g="hand">🖐️ 손세탁</button><button class="btn" data-g="dryclean">🌀 드라이클리닝</button></div>`:''}`;
    P.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      if(b.dataset.s===g.struct){o.steps.struct=true;logp(o,'good','검사',`옷감 구조를 ${g.struct==='woven'?'직물':'편성물'}로 바르게 판단했어요.`);toast('정답! '+(g.struct==='woven'?'직물이에요.':'편성물이에요.'),'good');}
      else{if(!S.wrongS){S.wrongS=true;logp(o,'warn','검사','처음에 옷감 구조를 잘못 판단했어요. 직물은 날실과 씨실이 교차하고, 편성물은 실이 고리로 이어져 있어요.');}
        toast(b.dataset.s==='woven'?'직물은 날실과 씨실이 교차해요. 확대경 속 조직을 다시 살펴봐요.':'편성물은 실이 고리 모양으로 이어져요. 확대경 속 조직을 다시 살펴봐요.','bad');}
      save();renderP();renderTray();});
    P.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.c===fib.cat;
      if(ok){o.steps.fiber=true;logp(o,'good','검사',`${fib.name}을(를) ${CAT[b.dataset.c]}로 바르게 분류했어요.`);toast('정답!','good');}
      else{if(!S.wrongF){S.wrongF=true;logp(o,'warn','검사',`처음에 ${fib.name}의 분류를 틀렸어요. ${fib.name}의 원료는 '${fib.raw}'이에요.`);}toast(`다시 생각해 봐요. ${fib.name}의 원료는 '${fib.raw}'이에요.`,'bad');}
      save();renderP();renderTray();});
    const L=$('#insL');if(L)L.onclick=()=>openLabel(o,true);
    P.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g));
    renderNav();
  }
  S.refreshInspect=renderP;renderP();
};

/* ---------- 3-0. 애벌빨래 ---------- */
SCENES.prewash=function(){
  ensureMach();
  const m=G.mach.soak1,mo=m.o?orderByNo(m.o):null,ao=act();
  const eligMsg=o=>!o?'작업 바구니에 옷이 없어요.':o.loc?locStatus(o):!inspected(o)?'먼저 의복 검사대에서 검사해요.':o.steps.wash?'이미 본세탁을 마친 옷이에요. 애벌빨래는 본세탁 전에 해요.':o.flags.prewashed?'이미 애벌빨래를 마쳤어요. 이제 본세탁을 해요.':GD(o).label.wash.mode==='none'?'물세탁 금지 표시가 있는 옷은 물에 담그는 애벌빨래도 하지 않아요. 드라이클리닝을 해요.':'';
  const tempBtn=(t,n)=>`<button class="btn ${m.set.temp===t?'sel':''}" data-pt="${t}" ${m.st!=='loaded'?'disabled':''}>${n}<br><small>${t}℃</small></button>`;
  sc().innerHTML=guide('애벌빨래',m.st==='empty'?'찌든 때가 심한 옷(<b>오염도 70% 이상</b>)은 본세탁 전에 세제 물에 담가 때를 불린 뒤 가볍게 빨아요. 옷을 통에 끌어다 넣어요.':m.st==='loaded'?'물 온도와 세제를 고르고 <b>담가 두기</b>를 눌러요.':m.st==='running'?'때를 불리는 중이에요. 그동안 다른 일을 해도 돼요.':'다 불렸어요! 통 속 옷을 <b>5번 클릭</b>해 가볍게 주물러 빨고 꺼내요.')+
  `<div class="abs" style="left:30px;top:420px;width:780px;height:400px;background:#C99A64;border-radius:14px;border-top:14px solid #A7773F"></div>
   <div id="soak" class="abs drop" data-drop="soak" style="left:150px;top:200px;width:520px;height:360px">
     <svg viewBox="0 0 520 360" width="100%" height="100%" style="position:absolute;inset:0"><ellipse cx="260" cy="90" rx="240" ry="60" fill="#DDEFF3" stroke="#2F4B55" stroke-width="6"/><path d="M20 90 L60 320 Q260 360 460 320 L500 90" fill="#E8F3F6" stroke="#2F4B55" stroke-width="6"/>${m.st!=='empty'?`<ellipse cx="260" cy="100" rx="220" ry="50" fill="${m.set.temp===20?'#BFE6F5':m.set.temp===40?'#CDE9DF':'#C7E8EC'}"/>`:''}${(m.st==='running'||m.st==='done')&&m.set.det?Array.from({length:18},()=>`<circle class="bub" style="animation-delay:${(Math.random()*1.4).toFixed(2)}s" cx="${70+Math.random()*380}" cy="${80+Math.random()*40}" r="${6+Math.random()*10}" fill="#fff" opacity=".9"/>`).join(''):''}</svg>
     <div id="soakG" class="abs" style="left:150px;top:20px;width:220px;cursor:pointer;transition:transform .12s">${mo?garmentSVG(GD(mo),mo.st,{noDrip:true}):''}</div>
     <div class="abs" style="left:0;right:0;bottom:4px;text-align:center;font-family:var(--disp);font-size:20px;color:#2F4B55">애벌빨래 통</div></div>
   <div class="panel" style="left:830px;top:84px;width:360px;max-height:740px;overflow:auto">
     <h3>애벌빨래 — ${{empty:'비어 있음',loaded:'준비 중',running:'불리는 중',done:'다 불림'}[m.st]}</h3>
     ${mo?`<div class="ticket" style="margin:2px 0 8px"><div class="no">No.${mo.no} · ${mo.cust.name} 님</div>${GD(mo).name}<br><small>처음 오염도 ${GD(mo).soil.level}%</small></div>`:''}
     ${m.st==='empty'?`<p class="note" style="font-size:15.5px">${ao&&!eligMsg(ao)?`작업 바구니의 No.${ao.no}(처음 오염도 <b>${GD(ao).soil.level}%</b>)을 통에 넣을 수 있어요.`:eligMsg(ao)}</p>`:''}
     <div class="lbl">물 온도</div><div class="row">${tempBtn(20,'찬물')}${tempBtn(30,'미지근한 물')}${tempBtn(40,'따뜻한 물')}</div>
     <div class="lbl">세제 풀기</div><div class="row">
       <button class="btn small ${m.set.det==='alk'?'sel':''}" data-pd="alk" ${m.st!=='loaded'||m.set.det?'disabled':''}>약알칼리성 세제<br><small>남은 ${G.stock.alk}회</small></button>
       <button class="btn small ${m.set.det==='neu'?'sel':''}" data-pd="neu" ${m.st!=='loaded'||m.set.det?'disabled':''}>중성세제<br><small>남은 ${G.stock.neu}회</small></button></div>
     <div class="row" style="margin-top:12px"><button class="btn main" id="soakGo" ${m.st==='loaded'&&m.set.temp&&m.set.det?'':'disabled'}>⏳ 담가 두기</button><button class="btn small" id="soakLab">🏷️ 라벨</button></div>
     ${m.st==='running'?`<div class="callout">때를 불리는 중… <b data-until="${m.start+m.dur}"></b></div>`:''}
     ${m.st==='done'?`<div class="lbl">가볍게 주물러 빨기 ${m.set.rub||0}/5</div><div class="prog"><i style="width:${(m.set.rub||0)*20}%"></i></div>`:''}
     <div class="callout" style="font-size:14px">애벌빨래는 찌든 때가 심한 옷을 <b>미지근한 물에 세제를 풀어 담가 두었다가</b> 가볍게 빠는 거예요. 때가 불어서 본세탁에서 훨씬 잘 빠져요.</div></div>`+plants();
  const re=()=>go('prewash');
  S.onUnit=u=>{if(u==='soak1'&&!DRAG)re();};
  DROP.soak=(p)=>{if(p.kind!=='garment')return;const o=act();
    if(m.st!=='empty'){toast('통에 이미 다른 옷이 있어요.','warn');return;}
    const msg=eligMsg(o);if(msg){toast(msg,'warn',4200);return;}
    m.o=o.no;o.loc='soak1';m.st='loaded';m.set={};save();refresh();re();};
  document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{m.set.temp=+b.dataset.pt;save();re();});
  document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{if(m.set.det)return;if(!useStock(b.dataset.pd))return;m.set.det=b.dataset.pd;save();re();});
  $('#soakLab').onclick=()=>{const o=mo||ao;if(o)openLabel(o,false);};
  $('#soakGo').onclick=()=>{if(m.st!=='loaded'||!m.set.temp||!m.set.det)return;m.st='running';m.start=GT();m.dur=durOf('soak');save();refresh();re();toast('세제 물에 담가 두었어요. 그동안 다른 일을 해요!','good');};
  $('#soakG').onclick=()=>{
    if(!mo)return;
    if(m.st==='loaded'){if(m.set.det){toast('세제를 이미 풀었어요. 담가 두기를 눌러요.','warn');return;}mo.loc=null;m.o=null;m.st='empty';m.set={};save();refresh();re();return;}
    if(m.st!=='done')return;
    m.set.rub=(m.set.rub||0)+1;const gEl=$('#soakG');gEl.style.transform='scale(1.06,.9)';setTimeout(()=>gEl.style.transform='',120);
    if(m.set.rub>=5){const p={temp:m.set.temp,det:m.set.det};mo.loc=null;m.o=null;m.st='empty';m.set={};doPrewash(mo,p);G.active=mo.no;
      const l=mo.log.filter(x=>x.step==='애벌빨래');const b=l.find(x=>x.t==='bad')||l.find(x=>x.t==='warn');toast(b?b.msg:'애벌빨래 완료! 이제 본세탁(기계 세탁·손세탁)을 해요.',b?'warn':'good',4500);refresh();re();return;}
    save();const pr=document.querySelector('.panel .prog i');if(pr)pr.style.width=(m.set.rub*20)+'%';const lb=[...document.querySelectorAll('.panel .lbl')].pop();if(lb)lb.textContent=`가볍게 주물러 빨기 ${m.set.rub}/5`;
  };
};

/* ---------- 3. 표백 작업대 ---------- */
function bottleSVG(k){
  if(k==='oxygen')return `<svg viewBox="0 0 120 150" width="100%"><rect x="14" y="30" width="92" height="112" rx="14" fill="#fff" stroke="#2F6FB0" stroke-width="4"/><rect x="20" y="16" width="80" height="20" rx="6" fill="#4A90D9"/><rect x="22" y="58" width="76" height="58" rx="6" fill="#DCEEFF"/><text x="60" y="80" font-size="15" text-anchor="middle" font-weight="bold" fill="#1D4E89">산소계</text><text x="60" y="100" font-size="13" text-anchor="middle" fill="#1D4E89">표백제</text><circle cx="60" cy="126" r="7" fill="#9BD1FF"/></svg>`;
  return `<svg viewBox="0 0 120 150" width="100%"><path d="M30 40 Q30 28 44 26 L76 26 Q90 28 90 40 L96 140 L24 140 Z" fill="#fff" stroke="#B53A2E" stroke-width="4"/><rect x="46" y="8" width="28" height="20" rx="4" fill="#E2574C"/><rect x="30" y="58" width="60" height="56" rx="6" fill="#FFE3DF"/><text x="60" y="80" font-size="15" text-anchor="middle" font-weight="bold" fill="#8F2A20">염소계</text><text x="60" y="100" font-size="13" text-anchor="middle" fill="#8F2A20">표백제</text><path d="M60 118 l9 15 h-18z" fill="#FFD447" stroke="#333" stroke-width="1.5"/><text x="60" y="131" font-size="10" text-anchor="middle">!</text></svg>`;
}
SCENES.bleach=function(){
  if(needOrder('표백 작업대'))return;
  const o=act(),g=GD(o);
  if(o.loc&&o.loc!=='bleach')return blockMsg('표백 작업대','이 옷은 지금 다른 곳에 있어요',locStatus(o)+' 작업 바구니에서 다른 주문을 고르거나, 작업이 끝난 뒤 다시 와요.');
  if(!inspected(o))return blockMsg('표백 작업대','먼저 의복을 검사해요','의복 검사대에서 옷감 구조·섬유·라벨을 확인한 뒤 표백 여부를 정할 수 있어요.','의복 검사대로 가기','inspect');
  if(o.steps.wash){blockMsg('표백 작업대','표백은 세탁 전에 해요','표백제는 세탁 전에 물에 풀어 담가 두거나 세탁할 때 함께 넣어 사용해요. 이 의복은 이미 세탁을 마쳐 표백 단계가 지났어요.'+(o.steps.bleach?'':' 다음 의복부터는 세탁 전에 표백 여부를 판단해요.'));const p=$('.panel');p.insertAdjacentHTML('beforeend',goNextBtn());bindNext();return;}
  if(o.steps.bleach){blockMsg('표백 작업대','표백 단계를 마쳤어요',`선택: ${{oxygen:'산소계 표백제',chlorine:'염소계 표백제',none:'표백하지 않기'}[o.steps.bleach]}. 표백제는 한 가지만 사용하고, 다른 표백제나 세제와 섞지 않아요. 이제 세탁 방법을 골라요.`);$('.panel').insertAdjacentHTML('beforeend',`<div class="row" style="justify-content:center"><button class="btn" data-g="machine">🫧 기계 세탁</button><button class="btn" data-g="hand">🖐️ 손세탁</button><button class="btn" data-g="dryclean">🌀 드라이클리닝</button></div>`);document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g));return;}
  sc().innerHTML=guide('표백 작업대','라벨의 <b>표백 기호</b>와 오염 상태를 확인해요. 표백이 필요하면 의복을 표백 통에 넣고 알맞은 표백제를 끌어다 부어요. 필요 없거나 금지되어 있으면 <b>표백하지 않기</b>를 골라요.')+
  `<div class="abs" style="left:30px;top:420px;width:780px;height:400px;background:#C99A64;border-radius:14px;border-top:14px solid #A7773F"></div>
   <div id="tub" class="abs drop" data-drop="tub" style="left:160px;top:250px;width:500px;height:330px">
     <svg viewBox="0 0 500 330" width="100%" height="100%" style="position:absolute;inset:0"><ellipse cx="250" cy="90" rx="230" ry="60" fill="#E8F3F6" stroke="#2F4B55" stroke-width="6"/><path d="M20 90 L60 300 Q250 340 440 300 L480 90" fill="#E8F3F6" stroke="#2F4B55" stroke-width="6"/><ellipse id="bWater" cx="250" cy="100" rx="210" ry="48" fill="#BFE6F5"/></svg>
     <div id="tubG" class="abs" style="left:150px;top:20px;width:200px"></div>
     <div class="abs" style="left:0;right:0;bottom:6px;text-align:center;font-family:var(--disp);font-size:20px;color:#2F4B55">표백 통 (담그기)</div></div>
   <div id="pour" class="abs" style="left:420px;top:120px;width:110px;opacity:0;transition:opacity .2s;transform:rotate(-70deg);z-index:5"></div>
   <div class="panel" style="left:830px;top:84px;width:360px">
     <h3>표백제 고르기</h3><p class="note" style="margin-top:0">오염: ${g.soil.desc}</p>
     <div class="row" style="justify-content:space-around;margin:6px 0">
       <div style="text-align:center"><div id="bO" style="width:110px">${bottleSVG('oxygen')}</div><div class="note">비교적 순함</div></div>
       <div style="text-align:center"><div id="bC" style="width:110px">${bottleSVG('chlorine')}</div><div class="note">표백력이 강함</div></div></div>
     <p class="note">표백제 용기를 표백 통으로 끌어다 놓아요. 남은 양: 산소계 ${G.stock.oxy}회 · 염소계 ${G.stock.chl}회</p>
     <button class="btn" id="noB" style="width:100%">🚫 표백하지 않기</button>
     <button class="btn small" id="bLab" style="width:100%;margin-top:8px">🏷️ 라벨의 표백 기호 확인하기</button>
     <div class="callout" style="font-size:14px">⚠️ 두 가지 표백제를 섞지 않아요. 한 번에 한 가지만 사용해요.</div></div>`;
  $('#bLab').onclick=()=>openLabel(o,false);
  draggable($('#bO'),{kind:'bl',k:'oxygen'},bottleSVG('oxygen'),{w:100});
  draggable($('#bC'),{kind:'bl',k:'chlorine'},bottleSVG('chlorine'),{w:100});
  $('#noB').onclick=()=>{o.loc=null;doBleach(o,'none');toast('표백하지 않기로 했어요.','');refresh();go('bleach');};
  DROP.tub=(p)=>{
    if(p.kind==='garment'){o.loc='bleach';S.placed=true;$('#tubG').innerHTML=garmentSVG(g,o.st);setGuide('이제 알맞은 표백제를 끌어다 표백 통에 부어요. 또는 <b>표백하지 않기</b>를 골라요.');return;}
    if(p.kind!=='bl')return;
    if(!S.placed){toast('먼저 오른쪽 작업 바구니의 의복을 표백 통에 넣어요.','warn');return;}
    if(S.busy)return;if(!useStock(p.k==='oxygen'?'oxy':'chl'))return;S.busy=true;BUSY=true;
    $('#pour').innerHTML=bottleSVG(p.k);$('#pour').style.opacity=1;
    $('#bWater').setAttribute('fill',p.k==='oxygen'?'#D7EEFF':'#F1F7D9');
    for(let i=0;i<10;i++){const b=document.createElement('div');b.className='abs bub';b.style.cssText=`left:${190+Math.random()*300}px;top:${300+Math.random()*60}px;width:${10+Math.random()*16}px;height:${10+Math.random()*16}px;border-radius:50%;background:#fff;border:2px solid #9cd;animation-delay:${Math.random()}s`;sc().appendChild(b);}
    setTimeout(()=>{$('#pour').style.opacity=0;},1300);
    setTimeout(()=>{BUSY=false;o.loc=null;const r=doBleach(o,p.k);$('#tubG').innerHTML=garmentSVG(g,o.st);
      const last=o.log[o.log.length-1];toast(last.msg,r==='bad'?'bad':r==='ok'?'good':'',5200);refresh();
      setTimeout(()=>{if(STATION==='bleach')go('bleach');},2600);},2400);
  };
};

function machineScene(dc){
  ensureMach();
  const title=dc?'드라이클리닝실':'기계 세탁실';
  const units=dc?['dc1']:Object.keys(G.mach).filter(k=>k.startsWith('washer')).sort();
  if(!S.unit||!units.includes(S.unit))S.unit=units[0];
  const id=S.unit,m=G.mach[id],mo=m.o?orderByNo(m.o):null,mg=mo?GD(mo):null,ao=act();
  const stName={empty:'비어 있음',loaded:'준비 중',running:'작동 중',done:'완료'};
  const tabs=units.length>1?`<div class="abs row" style="left:60px;top:84px;z-index:4">${units.map(u=>{const x=G.mach[u];return `<button class="btn small ${u===id?'sel':''}" data-unit="${u}">${unitName(u)} · ${stName[x.st]}${x.st==='running'?` <b data-until="${x.start+x.dur}"></b>`:''}${x.st==='done'?' ✅':''}</button>`;}).join('')}</div>`:'';
  const top=units.length>1?124:84;
  sc().innerHTML=guide(title,dc?'드라이클리닝은 물 대신 <b>유기 용제</b>로 오염을 빼요. 문을 열고 옷을 넣은 뒤 문을 닫고 작동해요. 기계가 도는 동안 <b>다른 일</b>을 해도 돼요.':'세탁기 <b>문을 클릭</b>해 열고 작업 바구니의 옷을 드럼에 넣어요. 세제·물 온도·세탁 강도를 정하고 문을 닫아 작동해요. 도는 동안 <b>다른 일</b>을 해도 돼요!')+tabs+
  `<div id="washer" class="abs" style="left:60px;top:${top}px;width:520px;height:700px;transform:scale(${units.length>1?.95:1});transform-origin:top left">${washerSVG(dc)}
     <div id="drumDrop" class="abs" data-drop="drum" style="left:${dc?80:110}px;top:250px;width:300px;height:300px;border-radius:50%"></div>
     <div id="wIn" class="abs" data-drop="drum" style="left:${dc?130:160}px;top:300px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;cursor:pointer"></div>
     <div id="door" class="abs" data-drop="drum" style="left:${dc?44:68}px;top:218px;width:384px;height:384px;border-radius:50%;border:18px solid ${dc?'#5C6970':'#C9DCE0'};background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),rgba(170,215,235,.25) 60%,rgba(120,180,200,.3));transition:transform .55s;transform-origin:left center;cursor:pointer;box-shadow:inset 0 0 0 4px #1E5F6655;transform:${m.door?'perspective(1100px) rotateY(-72deg)':'none'}">
       <div style="position:absolute;right:-30px;top:150px;width:26px;height:70px;border-radius:10px;background:${dc?'#3B4A52':'#1E5F66'}"></div></div></div>
   <div class="panel" id="mP" style="left:610px;top:84px;width:580px;max-height:740px;overflow:auto"></div>`+plants();
  document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>go(STATION,{unit:b.dataset.unit}));
  // 기계 모습
  if(mo){$('#wIn').innerHTML=`<div id="wInG" style="width:170px" class="${m.st==='running'?'spinning'+(dc?'':''):''}">${garmentSVG(mg,mo.st,{noDrip:true})}</div>`;}
  const disp=$('#wDisp');
  if(m.st==='running'){$('#wWater').style.transition='none';$('#wWater').style.transform='translateY(150px)';$('#wDrum').classList.add('spinning');
    disp.setAttribute('data-until',m.start+m.dur);disp.setAttribute('data-pre',dc?'용제 세탁 ':'세탁 중 ');
    if(!dc){let b='';for(let i=0;i<16;i++)b+=`<circle class="bub" style="animation-delay:${(Math.random()*1.4).toFixed(2)}s" cx="${120+Math.random()*280}" cy="${420+Math.random()*120}" r="${4+Math.random()*9}" fill="#fff" opacity=".85"/>`;$('#wBub').innerHTML=b;}
    else{$('#solv').setAttribute('y','360');$('#solv').setAttribute('height','82');}}
  else if(m.st==='done')disp.textContent='완료!';
  else if(m.st==='loaded'&&!dc)disp.textContent=`${m.set.temp||'-'}℃ · ${m.set.str||'-'}`;
  if(!dc&&m.set.det)$('#wDet').setAttribute('fill',m.set.det==='alk'?'#7FB6EE':'#F7B9C6');
  const setDoor=open=>{if(m.st==='running'){toast('작동 중에는 문이 잠겨 있어요.','warn');return;}m.door=open;save();go(STATION,{unit:id});};
  $('#door').onclick=()=>setDoor(!m.door);
  $('#wIn').onclick=()=>{
    if(!mo)return;
    if(!m.door){toast('문을 먼저 열어요.','warn');return;}
    if(m.st==='running')return;
    if(m.st==='loaded'){mo.loc=null;m.o=null;m.st='empty';m.set={};save();toast('옷을 다시 꺼냈어요.','');refresh();go(STATION,{unit:id});return;}
    if(m.st==='done'){mo.loc=null;m.o=null;m.st='empty';m.set={};G.active=mo.no;save();
      toast(dc?`No.${mo.no}을 꺼냈어요. 드라이클리닝은 건조까지 끝나서 바로 다림질 여부를 판단해요.`:`No.${mo.no}을 꺼냈어요. 탈수 작업대로 가서 물기를 빼요.`,'good');refresh();go(STATION,{unit:id});}
  };
  DROP.drum=(p)=>{
    if(p.kind!=='garment')return;const o=act();
    if(m.st!=='empty'){toast(`${unitName(id)}에는 이미 다른 옷이 들어 있어요.`+(units.length>1?' 다른 기계를 골라 보세요.':''),'warn');return;}
    if(!m.door){toast('먼저 기계 문을 클릭해 열어요.','warn');return;}
    if(!inspected(o)){toast('이 옷은 아직 검사하지 않았어요. 의복 검사대에서 옷감 구조·섬유·라벨을 먼저 확인해요.','warn');return;}
    if(o.steps.wash){toast(`No.${o.no}은 이미 '${{machine:'기계 세탁',hand:'손세탁',dry:'드라이클리닝'}[o.steps.wash]}'을 했어요. 세탁은 물세탁과 드라이클리닝 중 한 가지만 해요.`,'warn',4200);return;}
    m.o=o.no;o.loc=id;m.st='loaded';m.set={};save();refresh();go(STATION,{unit:id});
  };
  function start(){
    if(m.st!=='loaded')return;
    if(m.door){toast('문을 닫아야 작동해요.','warn');return;}
    if(dc&&!m.set.solv){toast('드라이클리닝 전용 세제를 먼저 넣어요.','warn');return;}
    if(!dc){if(!m.set.det||!m.set.temp||!m.set.str){toast('세제·물 온도·세탁 강도를 모두 정해요.','warn');return;}if(!useStock(m.set.det))return;}
    m.st='running';m.start=GT();m.dur=durOf(dc?'dc':'washer');save();
    toast(`${unitName(id)} 작동! ${fmtT(m.dur)} 동안 다른 옷을 처리해 보세요.`,'good');refresh();go(STATION,{unit:id});
  }
  const P=$('#mP');const step=(ok,t)=>`<li class="${ok?'ok':''}">${t}</li>`;
  const who=mo?`<div class="ticket" style="margin:4px 0 8px"><div class="no">No.${mo.no} · ${mo.cust.name} 님</div>${mg.name}</div>`:'';
  let elig='';
  if(m.st==='empty'){
    if(!ao)elig='작업 바구니에 옷이 없어요. 고객 접수대에서 옷을 받아 와요.';
    else if(ao.loc)elig=`작업 바구니에서 고른 No.${ao.no}은 지금 ${unitName(ao.loc)}에 있어요. 다른 주문을 골라 넣을 수 있어요.`;
    else if(!inspected(ao))elig=`No.${ao.no}은 아직 검사 전이에요.`;
    else if(ao.steps.wash)elig=`No.${ao.no}은 이미 '${{machine:'기계 세탁',hand:'손세탁',dry:'드라이클리닝'}[ao.steps.wash]}'을 마쳤어요. 세탁은 한 가지 방법으로만 해요.`;
    else elig=m.door?`작업 바구니의 No.${ao.no} ${GD(ao).name}을 드럼 안으로 끌어다 넣어요.`:'기계 문을 클릭해 열어요.';
  }
  if(dc){
    P.innerHTML=`<h3>${unitName(id)} — ${stName[m.st]}</h3>${who}
     ${m.st==='empty'?`<p class="note" style="font-size:15.5px">${elig}</p>`:''}
     ${m.st==='loaded'?`<ul class="steps">${step(true,'옷 넣기')}${step(!!m.set.solv,'드라이클리닝 전용 세제 넣기')}${step(!m.door,'문 닫기')}<li>작동하기</li></ul>`:''}
     <div class="lbl">드라이클리닝 전용 세제 — 클릭하면 기계의 용제 탱크에 넣어요</div>
     <button class="btn ${m.set.solv?'sel':''}" id="solvB" ${m.st!=='loaded'||m.set.solv?'disabled':''} style="display:flex;align-items:center;gap:10px"><svg width="38" height="50" viewBox="0 0 38 50"><rect x="5" y="12" width="28" height="36" rx="4" fill="#E8C35A" stroke="#7A5A10" stroke-width="2"/><rect x="12" y="3" width="14" height="10" rx="2" fill="#7A5A10"/><rect x="9" y="22" width="20" height="14" rx="2" fill="#fff"/><text x="19" y="32" font-size="8" text-anchor="middle" font-weight="bold">DRY</text></svg><span style="text-align:left">드라이클리닝 전용 세제<br><small>유기 용제용 · 남은 ${G.stock.dcs}회</small></span></button>
     ${m.st==='running'?`<div class="callout">🌀 드라이클리닝 중… 남은 시간 <b data-until="${m.start+m.dur}"></b><br>그동안 다른 옷을 검사하거나 다림질해요!</div>`:''}
     ${m.st==='done'?'<div class="callout" style="background:#ECFAF2;border-color:#2F9E6A">완료! 문을 열고 옷을 클릭해 꺼내요.</div>':''}

     <button class="btn" id="dNeu" style="width:130px"><svg width="40" height="54" viewBox="0 0 34 46"><rect x="4" y="10" width="26" height="34" rx="6" fill="#F6A9B8"/><rect x="11" y="2" width="12" height="9" rx="2" fill="#EE7F96"/></svg><br>중성세제<br><small>섬세 의류용 · ${G.stock.neu}회</small></button></div>
   <div class="abs" style="left:600px;top:110px;width:190px"><div class="note">물 온도 레버</div><div class="row" style="flex-direction:column;align-items:stretch;gap:5px">

        <div class="abs" style="left:150px;top:580px;width:450px;text-align:center"><div class="note">비튼 정도: <b id="twN">0</b>바퀴 — <b id="twW" style="color:#777">아직 덜 짰어요</b></div>
          <div style="position:relative;height:22px;border:2px solid var(--teal);border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#E3F1EE 0 25%,#CFF0DC 25% 70%,#F9D3CE 70%)"><i id="twP" style="position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(30,95,102,.55)"></i></div>

    <div class="note" id="heat">${!S.tier?'온도를 골라요.':hot?'🔥 다리미가 데워졌어요!':'⏳ 다리미를 데우는 중…'}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px;cursor:pointer"><input type="checkbox" id="cov" ${S.cover?'checked':''} style="width:20px;height:20px"> 의복 위에 천(덧천) 덮기</label>
    <button class="btn small" id="irLab" style="width:100%;margin-top:10px">🏷️ 다림질 기호 확인</button>
    <button class="btn" id="skip" style="width:100%;margin-top:10px">다림질하지 않고 넘어가기</button>
    ${S.ironed?`<div class="note" style="margin-top:8px">남은 구김: <b id="avgW">${Math.round(avg())}</b></div>`:''}`;
    P.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{S.tier=+b.dataset.tier;S.heatAt=Date.now()+1300;$('#ironEl').innerHTML=ironIconSVG(0);renderP();setTimeout(()=>{if(STATION==='iron'&&S.tier){$('#ironEl').innerHTML=ironIconSVG(S.tier);renderP();}},1350);});
    $('#cov').onchange=e=>{S.cover=e.target.checked;$('#cloth').style.display=S.cover&&S.placed?'block':'none';};
    $('#irLab').onclick=()=>openLabel(o,false);
    $('#skip').onclick=()=>{if(S.ironed){toast('이미 다림질을 시작했어요. 다리미를 거치대에 놓으면 끝나요.','warn');return;}doIron(o,{ironed:false});const l=o.log[o.log.length-1];toast(l.msg,l.t==='warn'?'warn':'good',4200);o.loc=null;refresh();go('deliver');};
  }
  // 구김 격자
  const cells=[];let path=null;const cv=$('#wc'),ctx=cv.getContext('2d'),test=document.createElement('canvas').getContext('2d');
  function setup(){
    path=garmentPath2D(g,o.st);cells.length=0;const r=rng('cell'+o.no);
    for(let j=0;j<23;j++)for(let i=0;i<20;i++){const x=i*10+5,y=j*10+5;if(test.isPointInPath(path,x,y)){const w=clamp(o.st.wrinkle+(r()-.5)*30,0,100);cells.push({x,y,w,w0:w,need:clamp(Math.ceil(w/20),1,5),h:0,inR:false,a:r()*Math.PI,s:r()});}}
    draw();
  }
  function draw(){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,800,910);const k=K*2;ctx.setTransform(k,0,0,k,10*k,14*k);
    ctx.save();ctx.clip(path);ctx.lineCap='round';
    for(const c of cells){if(c.w<4)continue;ctx.strokeStyle=`rgba(40,40,50,${(c.w/100*.55).toFixed(2)})`;ctx.lineWidth=.9;ctx.beginPath();const dx=Math.cos(c.a)*6,dy=Math.sin(c.a)*6;ctx.moveTo(c.x-dx,c.y-dy);ctx.quadraticCurveTo(c.x+dy*.5,c.y-dx*.5+2,c.x+dx,c.y+dy);ctx.stroke();
      if(c.w>45){ctx.beginPath();ctx.moveTo(c.x-dx*.6+2,c.y-dy*.6+3);ctx.lineTo(c.x+dx*.6+2,c.y+dy*.6+3);ctx.stroke();}}
    ctx.restore();
  }
  const avg=()=>cells.length?cells.reduce((a,c)=>a+c.w,0)/cells.length:0;
  function placeG(){$('#iG').innerHTML=garmentSVG(g,o.st,{noWrinkle:true,noDrip:true});}
  DROP.board=(p)=>{if(p.kind!=='garment'||S.placed)return;if(act()!==o){toast('처음 고른 옷을 펼쳐요.','warn');return;}S.placed=true;o.loc='board';$('#bHint').remove();$('#ironWrap').classList.remove('drop');placeG();setup();renderTray();
    if(S.cover)$('#cloth').style.display='block';if(pillsLeft(o.st))setGuide('보풀이 생겼어요! 먼저 오른쪽 아래 <b>보풀 제거기</b>를 끌어 옷 위를 쓸어 보풀을 없애요. 그다음 온도를 골라 다림질해요.');else setGuide('의복을 펼쳤어요. 라벨의 다림질 기호를 확인하고 온도를 골라요. 다리미로 구김 위를 <b>쓱 지나가면</b> 펴져요(구김이 심한 곳은 최대 5번). 다림질이 필요 없으면 <b>넘어가기</b>를 눌러요.');};
  // 다리미 조작
  const iron=$('#ironEl');let dragging=false,off={x:0,y:0},lastP=null,raf=0,warned=false;
  iron.addEventListener('pointerdown',e=>{
    if(!S.placed){toast('먼저 의복을 다림판에 펼쳐 놓아요.','warn');return;}
    if(!S.tier){toast('먼저 다리미 온도를 골라요.','warn');return;}
    dragging=true;iron.setPointerCapture(e.pointerId);const p=lp(e,iron);off=p;iron.style.cursor='grabbing';e.preventDefault();});
  iron.addEventListener('pointermove',e=>{
    if(!dragging)return;const p=lp(e,sc());const x=p.x-off.x,y=p.y-off.y;iron.style.left=x+'px';iron.style.top=y+'px';
    const hot=Date.now()>=S.heatAt;
    const gx=(x+75-270)/K-10,gy=(y+88-110)/K-14;
    if(lastP&&Math.hypot(gx-lastP.x,gy-lastP.y)<1)return;lastP={x:gx,y:gy};
    if(gx<-20||gx>220||gy<-20||gy>250)return;
    if(!hot){if(!warned){toast('다리미가 아직 데워지지 않았어요. 잠시 기다려요.','warn');warned=true;}return;}
    const R=G.upg.steam?32:24,t=L.iron,c=S.tier;const floor=t===0?0:c>=t?0:(t-c===1?42:66);const over=t===0||c>t;
    let changed=false;
    for(const cl of cells){const d=Math.hypot(cl.x-gx,cl.y-gy);
      if(d>R){cl.inR=false;continue;}
      if(cl.inR)continue; cl.inR=true; // 다리미가 이 부분을 새로 지나갈 때만 1회로 셈
      const step=Math.max(4,cl.w0/cl.need)*(S.cover?.9:1);
      const nw=Math.max(floor,Math.round((cl.w-step)*10)/10);if(nw!==cl.w){cl.w=nw;changed=true;}
      if(over){cl.h++;if(cl.h===2&&o.st.scorch.length<28){const melt=SYNTH.includes(g.main)||has(g,'polyester')||has(g,'spandex')||has(g,'acrylic');
        o.st.scorch.push([cl.x+(Math.random()-.5)*4,cl.y+(Math.random()-.5)*4,melt?'melt':'burn']);
        const d2=t===0?2:(c-t);hurt(o,{damage:2.2*d2*(S.cover&&c-t===1?.5:1),color:1.2,colorType:melt?'fade':'yellow'});placeG();renderTray();
        if(!S.warnHot){S.warnHot=true;toast(melt?'앗! 옷감이 번들거리고 녹는 자국이 생겨요!':'앗! 옷감이 누렇게 그을려요!','bad');}}}
    }
    if(changed){S.ironed=true;if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw();const a=$('#avgW');if(a)a.textContent=Math.round(avg());else renderP();});}
    if(Math.random()<.35){const s=document.createElement('div');s.className='abs steam';s.style.cssText=`left:${x+30+Math.random()*80}px;top:${y-10}px;width:22px;height:22px;border-radius:50%;background:#ffffffcc;pointer-events:none;z-index:7`;sc().appendChild(s);setTimeout(()=>s.remove(),1200);}
  });
  iron.addEventListener('pointerup',e=>{
    if(!dragging)return;dragging=false;cells.forEach(c=>c.inR=false);iron.style.cursor='grab';lastP=null;
    const r=$('#rest').getBoundingClientRect(),ir=iron.getBoundingClientRect();
    const cx=ir.left+ir.width/2,cy=ir.top+ir.height/2;
    if(cx>r.left&&cx<r.right&&cy>r.top&&cy<r.bottom){iron.style.left='995px';iron.style.top='665px';
      if(S.ironed&&!S.finished){S.finished=true;const cl=$('#cloth');if(cl){cl.style.transition='opacity .5s';cl.style.opacity='0';setTimeout(()=>{cl.style.display='none';},500);}doIron(o,{scorched:o.st.scorch.length,ironed:true,tier:S.tier,cover:S.cover,avg:avg()});o.st.wrinkle=Math.round(avg());o.loc=null;
        const l=o.log.filter(x=>x.step==='다림질');const b=l.find(x=>x.t==='bad')||l.find(x=>x.t==='warn');toast(b?b.msg:l[0].msg,b?(b.t==='bad'?'bad':'warn'):'good',5600);refresh();
        P.innerHTML=`<h3>다림질 완료</h3><p class="note">남은 구김 ${Math.round(avg())}</p>${goNextBtn()}`;bindNext();setGuide('다리미를 거치대에 놓았어요. 보관·출고대로 이동해요.');}}
  });
  // 보풀 제거기
  const shv=$('#shaver');let sd=false,soff={x:0,y:0};
  shv.addEventListener('pointerdown',e=>{if(!S.placed){toast('먼저 의복을 다림판에 펼쳐 놓아요.','warn');return;}sd=true;shv.setPointerCapture(e.pointerId);soff=lp(e,shv);shv.style.cursor='grabbing';e.preventDefault();});
  shv.addEventListener('pointermove',e=>{if(!sd)return;const p=lp(e,sc());const x=p.x-soff.x,y=p.y-soff.y;shv.style.left=x+'px';shv.style.top=y+'px';
    const gx=(x+100-270)/K-10,gy=(y+52-110)/K-14,n=Math.min(40,o.st.pills);o.st.pillGone=o.st.pillGone||[];let ch=false;
    for(let i=0;i<n;i++){if(o.st.pillGone.includes(i))continue;const q=PILLS[i];if(Math.hypot(q[0]-gx,q[1]-gy)<14){o.st.pillGone.push(i);ch=true;
      const f=document.createElement('div');f.className='abs steam';f.style.cssText=`left:${x+100}px;top:${y+40}px;width:10px;height:10px;border-radius:50%;background:${GD(o).color};border:1px solid #0003;pointer-events:none;z-index:7`;sc().appendChild(f);setTimeout(()=>f.remove(),1100);}}
    if(ch){placeG();const left=pillsLeft(o.st);$('#pillN').textContent=left;if(!left){toast('보풀을 모두 제거했어요! 이제 다림질 여부를 판단해요.','good');save();renderTray();}}});
  shv.addEventListener('pointerup',()=>{sd=false;shv.style.cursor='grab';save();renderTray();});
  if(o.steps.iron){P.innerHTML='';}
  renderP();
};

/* ---------- 9. 보관·출고대 ---------- */
SCENES.deliver=function(){
  if(needOrder('보관·출고대'))return;
  const o=act(),g=GD(o),s=o.st;
  if(o.loc)return blockMsg('보관·출고대','이 옷은 지금 다른 곳에 있어요',locStatus(o));
  if(!o.steps.wash)return blockMsg('보관·출고대','아직 세탁하지 않았어요','세탁하지 않은 옷은 손님에게 돌려줄 수 없어요. 검사와 세탁부터 진행해요.','의복 검사대로 가기','inspect');
  const row=(n,v,ok,warn,txt)=>`<tr><td>${n}</td><td style="width:70px;text-align:right"><b>${Math.round(v)}</b></td><td style="color:${ok?'#2F9E6A':warn?'#C78A00':'#D9483B'}">${ok?'좋음':warn?'주의':'나쁨'} — ${txt}</td></tr>`;
  sc().innerHTML=guide('보관·출고대','완성된 의복을 <b>최종 검사</b>하고 손님에게 전달해요.')+
  `<div class="abs" style="left:30px;top:84px;width:460px;height:740px;background:#F3E6CC;border-radius:18px;border:4px solid #C9AE7C"></div>
   <div class="abs" style="left:60px;top:110px;width:400px;height:12px;background:#8C6430;border-radius:6px"></div>
   <svg class="abs" style="left:215px;top:96px" width="90" height="70" viewBox="0 0 90 70"><path d="M45 26 q0 -16 10 -12 M45 26 L6 56 L84 56 Z" fill="none" stroke="#556" stroke-width="4"/></svg>
   <div class="abs" style="left:110px;top:150px;width:300px">${garmentSVG(g,s)}</div>
   <div class="abs" style="left:96px;top:140px;width:328px;height:400px;border-radius:30px 30px 10px 10px;background:linear-gradient(120deg,rgba(255,255,255,.45),rgba(220,240,250,.2) 50%,rgba(255,255,255,.4));border:2px solid rgba(160,200,215,.6)"></div>
   <div class="ticket abs" style="left:300px;top:540px;width:170px;transform:rotate(6deg)"><div class="no">No.${o.no}</div>${o.cust.name} 님</div>
   <div class="panel" style="left:510px;top:84px;width:680px">
     <h3>최종 검사 — ${g.name}</h3>
     <table style="width:100%;border-collapse:collapse;font-size:16px;line-height:1.8">
      ${row('오염도',s.soil,s.soil<=15,s.soil<=25,s.soil<=15?'깨끗해요':'얼룩이 남아 있어요')}
      ${row('수분량',s.moisture,s.moisture<=8,s.moisture<=15,s.moisture<=8?'잘 말랐어요':'아직 축축해요')}
      ${row('구김',s.wrinkle,s.wrinkle<=30,s.wrinkle<=42,s.wrinkle<=30?'반듯해요':'구김이 있어요')}
      ${row('형태 유지',s.shape,s.shape>=90,s.shape>=80,s.shape>=90?'원래 모양이에요':s.shapeType==='shrink'?'줄어들었어요':s.shapeType==='stretch'?'늘어났어요':'모양이 변했어요')}
      ${row('색상 상태',s.color,s.color>=90,s.color>=80,s.color>=90?'색이 그대로예요':s.colorType==='yellow'?'누렇게 변했어요':'색이 바랬어요')}
      ${row('섬유 손상',s.damage,s.damage<=10,s.damage<=22,s.damage<=10?'튼튼해요':'옷감이 상했어요')}</table>
     ${stepText(o)}
     ${s.moisture>15?'<div class="callout">⚠️ 아직 젖어 있어요. 건조를 마치고 전달하는 것이 좋아요.</div>':''}
     ${!o.steps.dry?'<div class="callout">⚠️ 건조 단계를 마치지 않았어요.</div>':''}
     <div class="row" style="margin-top:14px;justify-content:space-between"><span class="note">예상 점수는 전달하면 공개돼요.</span><button class="btn main" id="give">🎁 ${o.cust.name} 님에게 전달하기</button></div></div>`+plants();
  $('#give').onclick=()=>{if((s.moisture>15||!o.steps.dry)&&!confirm('아직 덜 마른 상태예요. 그래도 손님에게 전달할까요?'))return;deliverOrder(o);refresh();};
};

/* ====================== 8. 시작 ====================== */
showTitle();

</script>
