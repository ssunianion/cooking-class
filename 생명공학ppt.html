<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO CINEMA LAB — 영화·드라마 속 생명기술 탐험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="light"], :root[data-theme="dark"] {
  color-scheme: light;
  --bg: #F6F8FF;
  --bg-2: #EEF2FF;
  --surface: #FFFFFF;
  --surface-2: #F3F5FF;
  --line: #DCE2F6;
  --text: #1C2150;
  --muted: #5B6590;
  --teal: #0FB5A6;
  --teal-text: #08877C;
  --teal-ink: #FFFFFF;
  --violet: #7B61FF;
  --violet-text: #5B40E0;
  --violet-soft: #EEEAFF;
  --mint-soft: #E2F8F5;
  --warn: #A85F00;
  --warn-soft: #FFF3DC;
  --danger: #D9364F;
  --danger-soft: #FFE7EB;
  --ok: #1B8F52;
  --ok-soft: #E2F6EA;
  --radius-lg: 22px;
  --radius: 14px;
  --shadow: 0 12px 30px rgba(70, 82, 160, 0.13);
  --shadow-sm: 0 6px 16px rgba(70, 82, 160, 0.10);
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: light; } }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 70px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--body);
  font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
  background-image: radial-gradient(1000px 520px at 90% -8%, rgba(123, 97, 255, 0.14), transparent 60%),
                    radial-gradient(900px 500px at -10% 6%, rgba(15, 181, 166, 0.14), transparent 60%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
button { font: inherit; color: inherit; cursor: pointer; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 1180px; margin: 0 auto; padding: 0 20px 40px; }

.topnav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 20px; margin: 0 -20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; font-family: var(--display); font-size: 20px; letter-spacing: 0.02em; color: var(--text); padding: 4px 0; }
.brand-mark { font-size: 22px; }
.tabs { display: flex; gap: 6px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; color: var(--muted); font-weight: 700; font-size: 15px; white-space: nowrap; }
.tabs button.on { background: linear-gradient(135deg, var(--teal), var(--violet)); color: #fff; box-shadow: var(--shadow-sm); }

.crumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 4px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; padding: 11px 18px; font-weight: 700; font-size: 15px; border: 1px solid transparent; min-height: 44px; text-decoration: none; transition: transform .12s ease, background .12s ease; }
.btn:active { transform: scale(0.98); }
.btn.small { padding: 7px 13px; font-size: 14px; min-height: 38px; }
.btn-primary { background: linear-gradient(135deg, var(--violet), #9C7BFF); color: #fff; box-shadow: 0 8px 18px rgba(123, 97, 255, 0.3); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--violet); }
.btn-light { background: rgba(255, 255, 255, 0.92); color: #1C2150; }

/* 히어로: 밝은 필름 스트립 */
.hero { margin: 22px 0 8px; border-radius: var(--radius-lg); overflow: hidden; background: #fff; box-shadow: var(--shadow); border: 1px solid var(--line); }
.strip { height: 26px; background-color: var(--violet);
  background-image: repeating-linear-gradient(90deg, transparent 0 14px, #FFFFFF 14px 30px, transparent 30px 44px);
  background-size: 44px 12px; background-repeat: repeat-x; background-position: 0 center; }
.strip:last-child { background-color: var(--teal); }
.hero-inner { padding: 42px 28px 38px; text-align: center;
  background: radial-gradient(520px 220px at 18% 10%, rgba(15, 181, 166, 0.16), transparent 70%),
              radial-gradient(520px 220px at 82% 90%, rgba(123, 97, 255, 0.16), transparent 70%),
              linear-gradient(180deg, #FFFFFF 0%, #F6F3FF 100%); }
.logo { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 8.4vw, 92px); line-height: 1; letter-spacing: 0.04em;
  background: linear-gradient(100deg, #0FB5A6 0%, #2E9BEA 40%, #7B61FF 75%, #C25BE8 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.subtitle { margin: 14px 0 0; font-family: var(--display); font-size: clamp(20px, 3.2vw, 30px); color: var(--text); }
.hero-text { max-width: 560px; margin: 14px auto 0; color: var(--muted); }

.search-area { margin-top: 26px; }
.searchbox { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 6px 8px 6px 16px; box-shadow: var(--shadow-sm); }
.searchbox:focus-within { border-color: var(--violet); }
.search-ic { font-size: 18px; }
.searchbox input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 17px; padding: 10px 0; }
.searchbox input::placeholder { color: #8C94B8; }
.searchbox input:focus { outline: none; }
.searchbox input::-webkit-search-cancel-button { display: none; }
.clear { border: 0; background: var(--bg-2); color: var(--text); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.search-note { margin: 8px 4px 0; font-size: 14px; color: var(--muted); }

.filters { margin-top: 18px; display: grid; gap: 12px; }
.frow { display: grid; grid-template-columns: 128px 1fr; gap: 10px; align-items: start; }
.flabel { font-weight: 700; color: var(--muted); font-size: 14px; padding-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 14px; min-height: 38px; }
.chip:hover { border-color: var(--violet); }
.chip.on { background: var(--violet); border-color: var(--violet); color: #fff; font-weight: 700; }

.result-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 20px 0 12px; flex-wrap: wrap; }
.count { margin: 0; color: var(--muted); }
.count b { color: var(--violet-text); font-size: 22px; font-family: var(--display); font-weight: 400; margin-right: 2px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 0; overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; transition: transform .16s ease, box-shadow .16s ease; }
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.poster { position: relative; aspect-ratio: 2 / 3; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; color: #fff; overflow: hidden; }
.poster::before { content: ""; position: absolute; width: 160%; aspect-ratio: 1; left: -30%; top: -55%; border-radius: 50%; background: rgba(255, 255, 255, 0.16); pointer-events: none; }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(20, 20, 60, 0.42) 100%); pointer-events: none; }
.poster-top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
.type-tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.9); color: #1C2150; }
.fit-dot { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-weight: 900; font-size: 14px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.fit-dot.fit-A { color: var(--teal-text); }
.fit-dot.fit-B { color: var(--violet-text); }
.fit-dot.fit-C { color: #6A7196; }
.poster-icon { position: relative; z-index: 1; font-size: clamp(52px, 9vw, 72px); text-align: center; filter: drop-shadow(0 8px 14px rgba(20, 20, 60, 0.25)); }
.poster-title { position: relative; z-index: 1; display: flex; flex-direction: column; text-shadow: 0 1px 6px rgba(20, 20, 60, 0.35); }
.pt-ko { font-family: var(--display); font-size: 21px; line-height: 1.2; }
.pt-year { font-size: 13px; opacity: 0.9; margin-top: 2px; }
.poster-warn { position: absolute; z-index: 2; top: 46px; left: 12px; background: #fff; color: var(--danger); font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 6px; }
.card-body { padding: 10px 12px 12px; }
.card-techs { display: flex; flex-wrap: wrap; gap: 5px; }
.card-techs span { font-size: 12px; color: var(--muted); background: var(--bg-2); border-radius: 6px; padding: 2px 7px; line-height: 1.5; }

.unreg { text-align: center; background: var(--surface); border: 2px dashed var(--violet); border-radius: var(--radius-lg); padding: 34px 22px; max-width: 640px; margin: 10px auto; box-shadow: var(--shadow-sm); }
.unreg-icon { font-size: 40px; }
.unreg h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 6px 0; color: var(--violet-text); }
.unreg-q { color: var(--muted); margin: 0 0 8px; }
.unreg p { margin: 8px 0; }
.unreg .btn { margin-top: 10px; }
.unreg-notes { text-align: left; margin: 20px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
.unreg-entry { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:16px 0 4px; padding:16px 18px; background:#F1ECFF; border:1px solid #CFC4FF; border-radius:16px; }
.unreg-entry strong { display:block; color:var(--violet-text); font-size:17px; }
.unreg-entry p { margin:3px 0 0; font-size:14px; color:var(--muted); }
.unreg-mini { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 22px; color: var(--muted); font-size: 15px; }
.empty { text-align: center; padding: 30px; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--line); }

.legend { margin-top: 34px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.legend > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.legend p { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.legend-foot { grid-column: 1 / -1; margin: 0 !important; }

.fit { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; }
.fit b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; color: #fff; }
.fit-A { background: var(--mint-soft); color: var(--teal-text); } .fit-A b { background: var(--teal); }
.fit-B { background: var(--violet-soft); color: var(--violet-text); } .fit-B b { background: var(--violet); }
.fit-C { background: #EDEFF6; color: #565E85; } .fit-C b { background: #8A93B8; }
.rating { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.rating-check { background: var(--warn-soft); color: var(--warn); border: 1px dashed #E8B460; }
.rating-ok { background: var(--ok-soft); color: var(--ok); }
.rating-adult { background: var(--danger); color: #fff; }
.reality { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.reality-real { background: var(--ok-soft); color: var(--ok); }
.reality-research { background: #E3F2FF; color: #1D6FB8; }
.reality-partial { background: var(--warn-soft); color: var(--warn); }
.reality-fiction { background: var(--danger-soft); color: var(--danger); }

.detail { margin-top: 8px; }
.dhead { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow); color: #fff; overflow: hidden; }
.dhead::before { content: ""; position: absolute; width: 520px; aspect-ratio: 1; right: -160px; top: -260px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); pointer-events: none; }
.dhead > * { position: relative; z-index: 1; }
.dhead-icon { font-size: 92px; line-height: 1; width: 140px; height: 190px; display: grid; place-items: center; border-radius: 16px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); }
.dhead h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5vw, 48px); line-height: 1.1; text-shadow: 0 2px 10px rgba(20, 20, 60, 0.25); }
.den { margin: 4px 0 12px; opacity: 0.9; }
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.meta-chips > span:not(.fit):not(.rating) { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.22); border: 1px solid rgba(255, 255, 255, 0.4); }
.dhead .fit, .dhead .rating { background: #fff; }
.drel { margin: 0 0 14px; max-width: 640px; }
.dhead-links { display: flex; flex-wrap: wrap; gap: 8px; }

.alert { margin-top: 14px; border-radius: var(--radius); padding: 13px 16px; border: 1px solid var(--line); background: var(--surface); }
.alert b { margin-right: 6px; }
.alert-high { background: var(--danger-soft); border-color: #F2A3B0; }
.alert-high b { color: var(--danger); }
.alert-mid { background: var(--warn-soft); border-color: #F0D29C; }
.alert-mid b { color: var(--warn); }
.alert-low b { color: var(--muted); }
.alert-info { background: var(--violet-soft); border-color: #CFC4FF; }
.alert-info b { color: var(--violet-text); }
.rating-note { margin: 10px 4px 0; color: var(--warn); font-size: 14px; }

.dsec, .think { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }
.dsec h2, .think h2, .gsec h2 { margin: 0 0 14px; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--teal-text); }
.dsec h3 { font-size: 18px; margin: 0; }
.sec-lead { margin: -4px 0 16px; color: var(--muted); }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 18px; }
.person { background: var(--bg-2); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; border-left: 4px solid var(--violet); }
.person span { color: var(--muted); font-size: 14px; }
.plot { max-width: 760px; }
.plot p { margin: 0 0 6px; }

.tech-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.tech { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.tech.extend { background: var(--surface); border-style: dashed; border-color: #C9BEFF; }
.tech-top { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kind { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
.kind-shown { background: var(--teal); color: #fff; }
.kind-extend { background: var(--violet-soft); color: var(--violet-text); }
.ftag { font-size: 12px; color: var(--muted); padding: 3px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.tech dl { margin: 10px 0 0; }
.tech dt { font-size: 13px; font-weight: 700; color: var(--violet-text); margin-top: 8px; }
.tech dd { margin: 2px 0 0; }

.principles { display: grid; gap: 12px; }
.prin { background: var(--bg-2); border-radius: var(--radius); padding: 16px 18px; border-left: 4px solid var(--teal); }
.prin-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
.prin p { margin: 8px 0 0; max-width: 820px; }
.reality-key { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.glossary { margin-top: 18px; background: var(--violet-soft); border-radius: var(--radius); padding: 16px 18px; }
.glossary h3 { margin-bottom: 8px; color: var(--violet-text); }
.glossary dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px 20px; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.spoiler { background: var(--warn-soft); border: 1px dashed #E8B460; border-radius: var(--radius); padding: 18px; text-align: center; }
.spoiler p { margin: 0 0 10px; }

.kw-groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.kw { border-radius: var(--radius); padding: 14px; }
.kw h3 { font-size: 15px; margin-bottom: 10px; }
.kw div { display: flex; flex-wrap: wrap; gap: 6px; }
.kw span { font-size: 14px; padding: 4px 10px; border-radius: 999px; background: #fff; }
.kw-pos { background: var(--ok-soft); } .kw-pos h3 { color: var(--ok); }
.kw-neg { background: var(--danger-soft); } .kw-neg h3 { color: var(--danger); }
.kw-eth { background: var(--violet-soft); } .kw-eth h3 { color: var(--violet-text); }
.qgroups { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.qgroups > div { background: var(--bg-2); border-radius: var(--radius); padding: 14px 16px; }
.qgroups h3 { font-size: 15px; color: var(--teal-text); }
.qgroups ul { margin: 8px 0 0; padding-left: 20px; }
.qgroups li { margin-bottom: 4px; }

.think { background: linear-gradient(160deg, #F1ECFF 0%, #E6FAF6 100%); border-color: #CFC4FF; }
.think h2 { color: var(--violet-text); font-size: 30px; }
.tq { display: grid; grid-template-columns: 34px 1fr; gap: 6px 12px; margin-bottom: 16px; }
.tq-n { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--violet); color: #fff; font-weight: 900; }
.tq-q { font-weight: 700; padding-top: 4px; }
.tq textarea { width: 100%; min-height: 84px; resize: vertical; background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; }
.tq textarea:focus { outline: none; border-color: var(--violet); }
.student-form { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 18px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px; }
.student-form label { display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px; }
.student-form input {width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;}
.submit-note {font-size:14px;color:var(--muted);margin:8px 0;}
@media(max-width:520px){.student-form{grid-template-columns:1fr;}}
.think-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.think-foot p { margin: 0; flex: 1; min-width: 220px; color: var(--muted); font-size: 14px; }
.watch-note { margin-top: 18px; padding: 16px 18px; border-radius: var(--radius); background: var(--mint-soft); border: 1px solid #BDEDE6; }
.watch-note h3 { margin: 0 0 4px; font-size: 16px; color: var(--teal-text); }
.watch-note p { margin: 0; color: var(--muted); }

.page-title { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5vw, 44px); margin: 18px 0 6px; }
.gsec { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }
.slides { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.slides > li { background: var(--bg-2); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; border-top: 4px solid var(--violet); }
.slide-n { font-family: var(--display); color: var(--violet-text); font-size: 20px; }
.slides ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.checklist { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
.checklist label { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); cursor: pointer; min-height: 48px; }
.checklist input { width: 22px; height: 22px; accent-color: var(--teal); flex: none; }
.checklist label.done { border-color: var(--teal); background: var(--mint-soft); }
.checklist label.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--teal); }
.plain { margin: 0 0 14px; padding-left: 20px; }
.plain li { margin-bottom: 6px; }

/* ---------- 도우미 ---------- */
const norm = (s) => String(s || "").toLowerCase().replace(/\s+/g, "");
const fieldLabel = (key) => (FIELDS.find((f) => f.key === key) || { label: key }).label;
const workFields = (w) => Array.from(new Set((w.techs || []).flatMap((t) => t.fields || [])));
const ratingText = (w) => (w.rating && w.rating.trim() ? w.rating : "관람등급 확인 필요");
const isAdultOnly = (w) => /청소년\s*관람\s*불가|19세/.test(w.rating || "");

function searchText(w) {
  const parts = [w.title, w.titleEn, w.country, w.type, w.relevance];
  (w.techs || []).forEach((t) => { parts.push(t.name); (t.fields || []).forEach((f) => parts.push(fieldLabel(f))); });
  Object.values(w.keywords || {}).forEach((arr) => parts.push(...arr));
  (w.terms || []).forEach((t) => parts.push(t));
  return norm(parts.join(" "));
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 아래 방법으로 다시 시도 */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

/* 작품별 포스터: 등록 이미지 우선, 없으면 Wikipedia 공개 API에서 포스터를 포함한 대표 이미지를 검색.
   이미지는 외부 서버에서 직접 제공되며 HTML 파일에는 저장하지 않습니다. */
const posterCache = new Map();
function useWorkPoster(work) {
  const [poster, setPoster] = useState(work.posterImage || posterCache.get(work.id) || "");
  useEffect(() => {
    let active = true;
    if (work.posterImage) { setPoster(work.posterImage); return () => { active = false; }; }
    if (posterCache.has(work.id)) { setPoster(posterCache.get(work.id) || ""); return () => { active = false; }; }
    const title = work.wikipediaTitle;
    if (!title) return () => { active = false; };
    const api = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&pilicense=any&pithumbsize=600&titles=" + encodeURIComponent(title);
    fetch(api).then(r => { if (!r.ok) throw Error("Poster lookup unavailable"); return r.json(); })
      .then(data => {
        const pages = Object.values((data.query && data.query.pages) || {});
        const url = pages[0]?.thumbnail?.source || "";
        posterCache.set(work.id, url);
        if (active) setPoster(url);
      }).catch(() => { if (active) setPoster(""); });
    return () => { active = false; };
  }, [work.id, work.posterImage, work.wikipediaTitle]);
  return [poster, () => { posterCache.set(work.id, ""); setPoster(""); }];
}

      <${SpoilerGate} open=${spoilerOpen} onOpen=${() => setSpoilerOpen(true)}>
        <div className="principles">

        <h3>어려운 용어 풀이</h3>

    <//>

    <${Section} title="스스로 탐구하기" id="s-explore">
      <p className="sec-lead">아래 키워드와 질문으로 직접 자료를 찾아보세요. 교과서, 과학 기사, 공공기관 자료처럼 믿을 수 있는 출처를 사용하고 출처를 꼭 기록하세요.</p>

      <div className="qgroups">

      <p className="sec-lead">여기에는 정답이나 예시 답안이 없어요. 조사한 내용을 바탕으로 나의 생각을 내 말로 써 보세요.</p>
      <div className="student-form">
        <label>학번 (숫자 4자리)<input value=${studentNo} onInput=${(e)=>setStudentNo(e.target.value.replace(/\D/g, "").slice(0, 4))} inputMode="numeric" maxLength="4" pattern="[0-9]{4}" placeholder="예: 2315" autocomplete="off" /></label>
        <label>이름<input value=${studentName} onInput=${(e)=>setStudentName(e.target.value)} maxLength="30" placeholder="이름 입력" autocomplete="off" /></label>
      </div>
      ${THINK_QUESTIONS.map((q, i) => html`<label className="tq" key=${i}>
        <span className="tq-n">${i + 1}</span>
        <span className="tq-q">${q}</span>
        <textarea rows="3" value=${memo[i] || ""} onInput=${(e) => setMemo(i, e.target.value)} placeholder="나의 생각을 적어 보세요"></textarea>
      </label>`)}
      <div className="think-foot">
        <button className="btn btn-primary" onClick=${submitMemo}>📤 구글 스프레드시트에 제출</button>
        <button className="btn btn-ghost" onClick=${copyMemo}>내가 쓴 생각 복사</button>
        <p>제출 버튼을 누르면 새 탭이 열립니다. 새 탭에 ‘제출 완료’가 나타나야 저장된 것입니다. 제출 전에는 임시 저장되지 않으니 필요하면 복사해 두세요.</p>
      </div>
    </section>

    <div className="watch-note">
      <h3>꼭 전체를 다 보지 않아도 돼요</h3>
      <p>작품을 골랐다고 해서 영화나 드라마 전체를 시청해야 하는 것은 아니에요. 공식 소개 자료, 연령에 맞는 줄거리 자료, 선생님이 허용한 영상 자료를 활용하세요.</p>
    </div>
  </article>`;
}

/* ---------- 오류 대비 ---------- */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: false }; }
  static getDerivedStateFromError() { return { err: true }; }
  componentDidCatch(e) { console.error(e); }
  render() {
    if (this.state.err) {
      return html`<div className="fatal">
        <h2>화면을 보여 주는 중에 문제가 생겼어요</h2>
        <p>페이지를 새로고침해 보세요. 계속 같은 화면이 나오면 선생님께 알려 주세요.</p>
        <button className="btn btn-primary" onClick=${() => location.reload()}>새로고침</button>
      </div>`;
    }
    return this.props.children;
  }
}

/* ---------- 앱 ---------- */
const HOME = { tab: "explore", workId: null };
const EMPTY_SEARCH = { query: "", type: "전체", field: "전체", fit: "전체" };

function App() {
  const [view, setView] = useState(HOME);
  const [history, setHistory] = useState([]);
  const [search, setSearch] = useState(EMPTY_SEARCH);
  const [memos, setMemos] = useState({});
  const [checks, setChecks] = useState({});
  const [toastMsg, setToastMsg] = useState("");
  const timer = useRef(null);

  const toast = useCallback((msg) => {
    const m = msg || "복사가 되지 않았어요. 글자를 길게 누르거나 드래그해서 직접 복사해 주세요.";
    setToastMsg(m);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToastMsg(""), 3200);
  }, []);

  const go = (next) => {
    setHistory((h) => [...h, view]);
    setView(next);
  };
  const back = () => {
    if (!history.length) { setView(HOME); return; }
    setView(history[history.length - 1]);
    setHistory(history.slice(0, -1));
  };
  const home = () => { setView(HOME); setHistory([]); setSearch(EMPTY_SEARCH); };

  useEffect(() => { try { window.scrollTo({ top: 0 }); } catch (e) { window.scrollTo(0, 0); } }, [view]);

  const onApply = () => {
    if (GOOGLE_FORM_URL && GOOGLE_FORM_URL.trim()) {
      const win = window.open(GOOGLE_FORM_URL.trim(), "_blank", "noopener");
      if (!win) toast("새 탭을 열 수 없었어요. 선생님께 신청서 주소를 받아 직접 열어 주세요.");
    } else {
      toast("설문지 연결 준비 중입니다.");
    }
  };

  const work = view.workId ? WORKS.find((w) => w.id === view.workId) : null;

  return html`<div className="app">
    <nav className="topnav" aria-label="주요 메뉴">
      <button className="brand" onClick=${home} aria-label="처음 화면으로">
        <span className="brand-mark" aria-hidden="true">🎬</span><span>BIO CINEMA LAB</span>
      </button>
      <div className="tabs" role="tablist">
        <button role="tab" aria-selected=${view.tab === "explore"} className=${view.tab === "explore" ? "on" : ""}
          onClick=${() => view.tab === "explore" && !view.workId ? null : go({ tab: "explore", workId: null })}>작품 탐색</button>
        <button role="tab" aria-selected=${view.tab === "guide"} className=${view.tab === "guide" ? "on" : ""}
          onClick=${() => view.tab === "guide" ? null : go({ tab: "guide", workId: null })}>수행평가 안내</button>
      </div>
    </nav>

    ${(history.length > 0 || view.workId || view.tab !== "explore") && html`<div className="crumbs">
      <button className="btn btn-ghost small" onClick=${back}>← 이전 단계</button>
      ${work && html`<button className="btn btn-ghost small" onClick=${() => go({ tab: "explore", workId: null })}>목록으로 돌아가기</button>`}
      <button className="btn btn-ghost small" onClick=${home}>처음으로</button>
    </div>`}

    <main>
      ${view.tab === "guide"
        ? html`<${GuideView} checks=${checks} setChecks=${setChecks} onApply=${onApply} />`
        : work
          ? html`<${DetailView} key=${work.id} work=${work} memo=${memos[work.id] || {}} toast=${toast}
              setMemo=${(i, v) => setMemos((m) => ({ ...m, [work.id]: { ...(m[work.id] || {}), [i]: v } }))} />`
          : html`<${ExploreView} state=${search} setState=${setSearch} onOpen=${(id) => go({ tab: "explore", workId: id })} onApply=${onApply} />`}
    </main>

    <footer className="foot">
      <p>작품 카드는 공식 포스터가 아니라 이 프로그램에서 만든 디자인 카드예요. 포스터 이미지는 저작권 때문에 넣지 않았어요.</p>
      <p>작품 정보는 수업용으로 정리한 자료예요. 발표 자료에는 직접 확인한 출처를 함께 적어 주세요.</p>
      <p className="foot-teacher">선생님께: 작품 정보와 관람등급, 공식 포스터 링크, 설문지 주소는 코드 위쪽의 데이터 영역(WORKS, GOOGLE_FORM_URL)에서 고칠 수 있어요.</p>
    </footer>

    <div className=${"toast" + (toastMsg ? " show" : "")} role="status" aria-live="polite">${toastMsg}</div>
  </div>`;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(html`<${ErrorBoundary}><${App} /><//>`);
} catch (e) {
  console.error(e);
  document.getElementById("root").innerHTML = '<div class="fatal"><h2>프로그램을 시작하지 못했어요</h2><p>인터넷 연결을 확인하고 페이지를 새로고침해 보세요. 계속 안 되면 선생님께 알려 주세요.</p></div>';
}

}
</script>
</body>
</html>
