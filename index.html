<style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#20313a;background:#f4f7f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(900px,100%)}header{text-align:center;margin-bottom:30px}.eyebrow{font-size:15px;color:#347b70;font-weight:700;letter-spacing:.08em}h1{font-size:clamp(30px,5vw,48px);margin:12px 0}header p{font-size:18px;color:#586a71;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:#fff;border:2px solid #e0e8e5;border-radius:22px;padding:30px 24px;text-decoration:none;color:inherit;box-shadow:0 10px 30px #163c3212;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:15px}.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#338f80;box-shadow:0 16px 35px #163c3224;outline:none}.emoji{font-size:76px;line-height:1.3}.card h2{font-size:28px;margin:0}.card p{font-size:15px;color:#64757a;margin:0}.cta{display:block;width:100%;padding:16px;border-radius:12px;background:#146f63;color:#fff;font-weight:700;font-size:19px;margin-top:8px}.card:nth-child(2) .cta{background:#ad4661}footer{text-align:center;margin-top:30px;color:#64757a;font-size:14px;line-height:1.7}@media(max-width:600px){.cards{grid-template-columns:1fr}.card{padding:24px}.emoji{font-size:58px}}
</style>
</head>

</html>
