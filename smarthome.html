<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART HOME BUILDER — 우리 집을 똑똑하게!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E6EEF3; --panel:#FFFFFF; --panel2:#F4F8FB; --ink:#1D2A44; --muted:#5E6B82; --line:#D3DDE6;
  --sensor:#E8962A; --sensor-bg:#FFF3E2;
  --net:#10A39A; --net-bg:#E0F5F3;
  --plat:#6C63D9; --plat-bg:#EEECFC;
  --ctrl:#3A86D8; --ctrl-bg:#E5F0FC;
  --ok:#1F9D57; --warn:#E5A100; --bad:#E5484D; --bad-bg:#FDECEC;
  --head:'Jua','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;
  --body:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:#EEF4F8;border-color:#B9C7D4}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ctrl);outline-offset:1px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover:not(:disabled){background:#2E3F63}
button.small{padding:3px 8px;font-size:12.5px;border-radius:6px}
select,input[type=number],input[type=text],textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
h2,h3,h4{font-family:var(--head);font-weight:400;margin:0}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* ---------- 상단 ---------- */
#top{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--ink);color:#fff;min-height:50px;flex-wrap:wrap}
#top .logo{font-family:var(--head);font-size:21px;letter-spacing:.5px;white-space:nowrap;line-height:1}
#top .logo small{display:block;font-family:var(--body);font-size:11px;opacity:.7;letter-spacing:0;margin-top:2px}
#steps{display:flex;gap:3px;flex:1;min-width:300px}
#steps button{flex:1;background:transparent;color:#C8D3E6;border:1px solid #3B4B6B;padding:4px 4px;font-size:12px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#steps button b{font-family:var(--head);font-weight:400;font-size:13px;margin-right:3px}
#steps button.cur,#steps button.cur.done{background:#fff;color:var(--ink);border-color:#fff}
#steps button.done{color:#9FE3C4;border-color:#2F7A63}
#steps button:hover:not(.cur){background:#2A3A5C}
.stats{display:flex;gap:6px;align-items:center}
.stat{background:#2A3A5C;border-radius:8px;padding:3px 9px;font-size:12px;line-height:1.25;text-align:center;min-width:58px}
.stat b{display:block;font-size:15px}
.stat.alarm{background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{background:#9B1C21}}
.savest{font-size:11.5px;color:#9FE3C4;white-space:nowrap;line-height:1.2;text-align:right}
.savest.bad{color:#FFB4B6}
.stat.money{background:#1F7A55;min-width:96px}
button.stat{border:none;color:#fff;font:inherit;cursor:pointer}
.stat.score{min-width:96px}.stat b{font-size:17px}
.stat{min-width:92px;padding:4px 12px}.stat.money.debt{background:var(--bad)}
.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:8px 0 10px}
.tl{border:1px solid var(--line);border-radius:8px;text-align:center;padding:3px 0;background:#fff;font-size:10.5px;line-height:1.25}
.tl span{display:block;color:var(--muted)}.tl b{display:block;font-size:17px;font-weight:400}.tl i{display:block;font-style:normal;color:#E8962A;font-size:9.5px;min-height:12px}
.tl.cur{border:2px solid var(--ctrl);background:var(--ctrl-bg)}.tl.cur i{color:var(--ctrl)}
.tl.done.g0,.tl.done.g1{background:var(--bad-bg)}.tl.done.g2,.tl.done.g3{background:#F3FBF6}
.ledger{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
.ledger td{padding:5px 6px;border-bottom:1px solid var(--line)}.ledger td:last-child{text-align:right;white-space:nowrap}
.ledger .minus{color:var(--bad)}.ledger .plus{color:var(--ok)}.ledger .sum td{font-weight:700;border-top:2px solid var(--ink)}
.stat.score{background:linear-gradient(135deg,#F2A33A,#E8762A)}
.stars{font-size:38px;color:#F2A33A;letter-spacing:4px;text-align:center;margin:4px 0 8px;text-shadow:0 2px 0 #FCE3BF}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bdg{display:inline-flex;flex-direction:column;align-items:center;width:58px;font-size:22px;padding:5px 2px;border-radius:10px;background:#EDF0F4;filter:grayscale(1);opacity:.45;cursor:help}
.bdg i{font-style:normal;font-size:10px;color:var(--muted);text-align:center;line-height:1.2;margin-top:2px}
.bdg.on{filter:none;opacity:1;background:#FFF3E2;box-shadow:inset 0 0 0 1.5px #F2CD95}
.bdg.on i{color:#7A4605;font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#fx i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(40px)}}
#top .tbtn{background:#2A3A5C;border-color:#3B4B6B;color:#fff}
#top .tbtn:hover{background:#3B4B6B}

/* ---------- 본문 ---------- */
#main{display:grid;grid-template-columns:230px 1fr 360px;min-height:0;position:relative}
#main.hideL{grid-template-columns:0 1fr 360px}
#main.hideR{grid-template-columns:230px 1fr 0}
#main.hideL.hideR{grid-template-columns:0 1fr 0}
#left,#right{background:var(--panel);overflow:hidden;min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.ptitle{font-family:var(--head);font-size:16px;padding:10px 12px 6px;display:flex;justify-content:space-between;align-items:center}
.collapse{position:absolute;top:50%;z-index:6;width:18px;height:54px;padding:0;border-radius:0 8px 8px 0;font-size:11px;background:#fff}
#tgL{left:230px}#tgR{right:360px;border-radius:8px 0 0 8px}
#main.hideL #tgL{left:0}#main.hideR #tgR{right:0}

/* 팔레트 */
#cats{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px}
#cats button{font-size:12px;padding:3px 8px;border-radius:20px}
#cats button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
#palette{overflow:auto;padding:0 10px 10px;flex:1}
.pitem{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px;cursor:grab;background:#fff;user-select:none;position:relative}
.pitem:hover{border-color:#9FB3C6;background:var(--panel2)}
.pitem.pending{border-color:var(--ctrl);box-shadow:0 0 0 2px var(--ctrl-bg);background:var(--ctrl-bg)}
.pitem svg{width:38px;height:38px}
.pitem .nm{font-weight:700;font-size:13px}
.pitem .ds{font-size:11.5px;color:var(--muted);line-height:1.3}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:10px;margin-left:4px;font-weight:700;vertical-align:1px}
.tag.s{background:var(--sensor-bg);color:#A3600A}
.tag.a{background:#E7F6EC;color:#18794B}
.tag.n{background:var(--net-bg);color:#0B7069}
.pgroup{margin:10px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.pgroup:first-child{margin-top:0}
.pgroup b{font-family:var(--head);font-weight:400;font-size:15px}
.pgroup span{display:block;font-size:11px;color:var(--muted)}
.pgroup.act{border-color:#9ED9B8}.pgroup.sensor{border-color:#F2CD95}.pgroup.network{border-color:#8FD6CF}
.mtag{display:inline-block;font-size:10.5px;color:var(--ctrl);background:var(--ctrl-bg);border-radius:8px;padding:0 6px;margin-top:2px}
.pitem.locked{background:#EEF1F5;border-color:#D8DEE6;cursor:not-allowed;filter:grayscale(1);opacity:.6}
.pitem.locked:hover{background:#EEF1F5;border-color:#D8DEE6}
.mtag.lockt{background:#DDE2EA;color:#5E6B82}
.pitem .cnt{position:absolute;right:6px;top:5px;font-size:10.5px;color:var(--muted)}

/* 무대 */
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(#DCEBF5,#EEF4F0)}
#stage.night{background:linear-gradient(#22304F,#3B4A63)}
#house{width:100%;height:100%;display:block;touch-action:manipulation}
#stage .floatbar{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
#stage .floatbar button,#stage .chip{background:rgba(255,255,255,.92);font-size:12.5px}
#stage .floatbar select.chip{padding:5px 6px;font-weight:700;cursor:pointer;max-width:190px}
#stage .floatbar button.run{background:var(--net);color:#fff;border-color:var(--net);font-weight:700}
#stage .floatbar button.run:hover{background:#0B8A82}
#stage .floatbar button.pause{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 9px;display:inline-flex;align-items:center;gap:5px}
#clock{font-weight:700}
#zoomOutBig{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:none;background:var(--ink);color:#fff;border:none;border-radius:24px;padding:10px 22px;font-size:15px;font-weight:700;box-shadow:0 6px 18px rgba(29,42,68,.35)}
#zoomOutBig:hover{background:#2E3F63!important}
#liveBar{position:absolute;left:10px;right:10px;top:8px;z-index:4;align-items:center;gap:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:6px 12px;box-shadow:0 4px 14px rgba(29,42,68,.12)}
#liveBar .lb-day{font-size:14px;white-space:nowrap}#liveBar .lb-day b{font-family:var(--head);font-weight:400;font-size:18px}
#liveBar button{white-space:nowrap;font-size:13px;padding:6px 12px}
#liveBar button.run{background:var(--net);color:#fff;border-color:var(--net);font-weight:700}
#liveBar button.pause{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
#liveBar .lb-sat{flex:1;min-width:120px;font-size:12.5px}#liveBar .lb-sat .meter{margin:3px 0 0;height:10px}
#liveBar .lb-inc{font-size:12px;text-align:right;white-space:nowrap;line-height:1.3}#liveBar .lb-inc span{color:var(--muted)}
#stage.livemode .floatbar{top:62px}
#stage.livemode #clockChip,#stage.livemode #scenChip{display:none!important}
#pendingTip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ctrl);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;z-index:4;display:none;box-shadow:0 4px 14px rgba(58,134,216,.35)}
#pendingTip button{margin-left:8px;background:#fff;color:var(--ctrl);border:none;padding:2px 8px}
#legend{position:absolute;right:10px;bottom:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;display:flex;gap:10px;z-index:3}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:-1px}
#legend .ln{display:inline-block;width:22px;height:0;border-top:2.5px dashed;margin-right:4px;vertical-align:3px}
#legend .ln.p{border-top-style:dotted;border-top-width:3px}
#testBanner{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:10px;font-size:13.5px;z-index:5;display:none}
#testBanner .bar{height:5px;background:#3B4B6B;border-radius:3px;margin-top:5px;overflow:hidden}
#testBanner .bar i{display:block;height:100%;background:var(--net);width:0}

/* svg 내부 */
.room-hit{fill:transparent;cursor:pointer}
.room-hit:hover{fill:rgba(58,134,216,.06)}
.room-sel{fill:none;stroke:var(--ctrl);stroke-width:3;stroke-dasharray:8 5}
.dev{cursor:pointer}
.dev:hover .devbg{stroke:var(--ink);stroke-width:2}
.dev.sel .devbg{stroke:var(--ctrl);stroke-width:3}
.drop-ok{fill:rgba(16,163,154,.14);stroke:var(--net);stroke-width:3}
.netline{fill:none;stroke-width:1.6;stroke-dasharray:4 4;opacity:.75}
.netline.wire{stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:6 4}
.netline.wire.plat{stroke-dasharray:2 4;stroke-width:2.4;stroke-linecap:round}
.netline.wire.plat.ok{stroke:var(--plat)}
.netline.wire.plat.err{stroke:#C9B8F0;opacity:.8}
.netline.ok{stroke:var(--net);animation:dash 1.2s linear infinite}
.netline.err{stroke:var(--bad);opacity:.9}
@keyframes dash{to{stroke-dashoffset:-16}}
.spin{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{animation:flash .6s steps(2) infinite}
@keyframes flash{50%{opacity:.15}}
.drift{animation:drift 2.4s ease-in-out infinite}
@keyframes drift{0%{transform:translateY(0);opacity:.0}30%{opacity:.8}100%{transform:translateY(-18px);opacity:0}}
.blow{animation:blow 1.1s linear infinite}
@keyframes blow{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(12px);opacity:0}}
.robo{animation:robo 4s ease-in-out infinite alternate}
@keyframes robo{to{transform:translateX(60px)}}
@media (prefers-reduced-motion: reduce){.spin,.flash,.drift,.blow,.robo,.netline.wire{stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:6 4}
.netline.wire.plat{stroke-dasharray:2 4;stroke-width:2.4;stroke-linecap:round}
.netline.wire.plat.ok{stroke:var(--plat)}
.netline.wire.plat.err{stroke:#C9B8F0;opacity:.8}
.netline.ok{animation:none}}

/* 오른쪽 탭 */
#tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0;gap:2px}
#tabs button{flex:1;border-radius:8px 8px 0 0;border-bottom:none;font-size:12.5px;padding:7px 2px;background:var(--panel2);position:relative}
#tabs button.cur{background:#fff;font-weight:700;border-color:var(--line);box-shadow:0 2px 0 #fff}
#tabs button[data-t=net].cur{color:var(--net)}#tabs button[data-t=plat].cur{color:var(--plat)}#tabs button[data-t=phone].cur{color:var(--ctrl)}
#tabs button .dot{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad);display:none}
#tabs button.attn .dot{display:block}
#rbody{overflow:auto;padding:12px;flex:1;min-height:90px}
#msplit{flex:none;height:9px;cursor:row-resize;background:var(--panel2);border-top:1px solid var(--line);display:grid;place-items:center;touch-action:none}
#msplit span{width:40px;height:4px;border-radius:2px;background:#B9C7D4}
#msplit:hover span{background:var(--ctrl)}
#mdock{flex:none;display:flex;flex-direction:column;min-height:40px;background:#FBFCFE;border-bottom:2px solid var(--ink);order:0}
#msplit{order:1}#tabs{order:2}#rbody{order:3}
#mdock .mhead{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--ink);color:#fff}
#mdock .mhead b{font-family:var(--head);font-weight:400;font-size:15px}
#mdock .mhead #mheadInfo{flex:1;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mdock .mhead button{background:#2A3A5C;border-color:#3B4B6B;color:#fff}
#mdock .mhead button:disabled{opacity:.35}
#mdock .mhead #nextStep.ready{background:var(--ok);border-color:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(31,157,87,.35)}}
.stepnav{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:4px 0 14px;text-align:center}
.stepnav.ready{border:2px solid var(--ok);background:#F3FBF6;color:#14653A}
.stepnav button{width:100%;padding:9px;margin-bottom:5px}
.stepnav button.small{width:auto;padding:3px 10px}
.stepnav button.go{background:var(--ok);border-color:var(--ok)}
.stepnav button.go:hover{background:#178048!important}
#mbody{overflow:auto;padding:10px 12px;flex:1;min-height:0}
#mdock.fold{height:auto!important}#mdock.fold #mbody{display:none}
.sec{margin-bottom:14px}
.sec>h3{font-size:16px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.box{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;margin-bottom:8px}
.box.soft{background:var(--panel2)}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:5px}
.li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12.5px;background:#fff}
.li .grow{flex:1;min-width:0}
.li.clickable{cursor:pointer}.li.clickable:hover{background:var(--panel2)}
.st{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.st.ok{background:#E2F5EA;color:var(--ok)}
.st.none{background:#EDF0F4;color:#6B7689}
.st.err{background:var(--bad-bg);color:var(--bad)}
.st.reg{background:var(--plat-bg);color:var(--plat)}
.st.on{background:#FFF1D6;color:#9A5B00}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:none}
.check .ck{width:20px;height:20px;border-radius:50%;border:2px solid #B9C7D4;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.check.done .ck{background:var(--ok);border-color:var(--ok)}
.check.done span.t{color:var(--muted)}
.comp4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.comp{border-radius:10px;padding:7px 9px;font-size:12px;border:2px solid transparent;line-height:1.4}
.comp b{font-family:var(--head);font-weight:400;font-size:15px;display:block}
.comp.c1{background:var(--sensor-bg);color:#7A4605}.comp.c2{background:var(--net-bg);color:#075B55}
.comp.c3{background:var(--plat-bg);color:#3D359E}.comp.c4{background:var(--ctrl-bg);color:#1D5DA3}
.comp.ready{border-color:currentColor}
.comp .flag{float:right;font-size:11px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}
.reading{font-size:22px;font-family:var(--head)}
.warnbox{background:var(--bad-bg);color:#9B1C21;border-radius:8px;padding:7px 9px;font-size:12.5px;margin:6px 0}
.infobox{background:var(--ctrl-bg);color:#1D4E85;border-radius:8px;padding:7px 9px;font-size:12.5px;margin:6px 0;line-height:1.5}
.okbox{background:#E2F5EA;color:#14653A;border-radius:8px;padding:7px 9px;font-size:12.5px;margin:6px 0}
.mcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;background:#fff}
.mcard.done{border-color:#9ED9B8;background:#F3FBF6}
.mcard.cur{border-color:var(--ctrl);box-shadow:0 0 0 2px var(--ctrl-bg)}
.mcard h4{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.mcard .badge{font-family:var(--body);font-size:11px;padding:1px 7px;border-radius:10px;background:#EDF0F4;color:#5E6B82}
.mcard.done .badge{background:var(--ok);color:#fff}
.mcard ul{margin:5px 0 6px 0;padding-left:18px;font-size:12.5px;line-height:1.5}
.classify{display:grid;gap:5px}
.classify .li button.cur{background:var(--ink);color:#fff}

/* 스마트폰 */
.phone{width:300px;max-width:100%;margin:0 auto;background:#1B2236;border-radius:36px;padding:12px 10px;box-shadow:0 10px 30px rgba(29,42,68,.25)}
.phone .scr{background:#F6F8FC;border-radius:26px;height:560px;display:flex;flex-direction:column;overflow:hidden}
.phone.compact{padding:6px 6px;border-radius:24px}.phone.compact .scr{border-radius:18px}.phone.compact .notch{height:16px}.phone.compact .apphead{padding:2px 12px 4px}
.phone .notch{height:22px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:#333;font-weight:700}
.phone .apphead{padding:4px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.phone .apphead h4{font-size:17px}
.phone .pbody{flex:1;overflow:auto;padding:0 12px 10px}
.phone .pnav{display:flex;border-top:1px solid #DDE3EC;background:#fff}
.phone .pnav button{flex:1;border:none;border-radius:0;font-size:11px;padding:7px 0;background:#fff;color:#7A8599;line-height:1.2}
.phone .pnav button.cur{color:var(--ctrl);font-weight:700}
.phone .pnav button .ic{font-size:16px;display:block}
.pc{background:#fff;border-radius:14px;padding:9px 11px;margin-bottom:8px;box-shadow:0 1px 3px rgba(29,42,68,.08)}
.pc h5{margin:0 0 5px;font-size:12.5px;color:var(--muted);font-weight:700}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scard{background:#fff;border-radius:12px;padding:7px 9px;box-shadow:0 1px 3px rgba(29,42,68,.08);font-size:11.5px;color:var(--muted)}
.scard b{display:block;font-size:17px;color:var(--ink);font-family:var(--head);font-weight:400}
.toggle{width:44px;height:24px;border-radius:12px;background:#C9D2DE;position:relative;border:none;padding:0;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--ctrl)}.toggle.on::after{left:23px}
.toggle.on.green{background:var(--ok)}
.bigaway{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#3A86D8,#6C63D9);color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.bigaway .toggle{background:rgba(255,255,255,.35)}.bigaway .toggle.on{background:#fff}.bigaway .toggle.on::after{background:var(--ctrl)}
.rule{background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:7px;box-shadow:0 1px 3px rgba(29,42,68,.08);font-size:12px}
.rule .if{color:#A3600A;font-weight:700}.rule .then{color:#18794B;font-weight:700}
.rule.off{opacity:.55}
.rule .bad{color:var(--bad);font-size:11.5px;margin-top:3px}
.rule .good{color:var(--ok);font-size:11.5px;margin-top:3px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:7px;font-size:12px}
.fld label{color:var(--muted);font-weight:700}
.fld .row select,.fld .row input{flex:1;min-width:0}
.condbox{border:1px dashed #E8C38C;background:#FFFAF2;border-radius:10px;padding:7px;margin-bottom:6px}
.actbox{border:1px dashed #9FD7B4;background:#F4FBF6;border-radius:10px;padding:7px;margin-bottom:6px}

/* 하단 */
#bottom{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 12px;background:#fff;border-top:1px solid var(--line)}
#missionLine{display:flex;gap:10px;align-items:center;min-width:0}
#missionLine .lbl{font-family:var(--head);font-size:14px;background:var(--ink);color:#fff;border-radius:8px;padding:4px 9px;white-space:nowrap}
#missionText{font-size:13.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.simctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.simctl select{max-width:170px}
#bottom button{white-space:nowrap}
.simctl .run{background:var(--net);color:#fff;border-color:var(--net)}
.simctl .run:hover:not(:disabled){background:#0B8A82}
.nav{display:flex;gap:4px}

/* 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(20,28,46,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.overlay.side{background:rgba(20,28,46,.12);justify-content:flex-end;align-items:stretch;padding:60px 12px 70px}
.overlay.side .modal{max-width:430px;max-height:none;padding:14px 16px}
.overlay.side .fstep{padding:5px 8px}.overlay.side .flow{gap:4px}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .mfoot{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#start{padding:0;background:none;overflow:hidden}
.tscene{position:absolute;inset:0;background:linear-gradient(180deg,#0F1A36 0%,#22325E 55%,#3C5A8A 100%);overflow:hidden}
.tstars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 25% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 75% 25%,#fff,transparent),radial-gradient(1px 1px at 88% 9%,#fff,transparent),radial-gradient(1px 1px at 52% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 18% 40%,#fff,transparent),radial-gradient(1px 1px at 92% 38%,#fff,transparent);animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.45}}
.tmoon{position:absolute;right:9%;top:9%;width:70px;height:70px;border-radius:50%;background:#FFF3B0;box-shadow:0 0 40px 10px rgba(255,243,176,.35)}
#titleHouse{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:min(1100px,96vw);height:auto;max-height:70vh;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35));animation:hfloat 6s ease-in-out infinite}
@keyframes hfloat{50%{transform:translateX(-50%) translateY(-6px)}}
.tfloat{position:absolute;font-size:34px;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.tfloat.f1{left:12%;top:42%}.tfloat.f2{right:14%;top:36%;animation-delay:1s}.tfloat.f3{left:20%;top:62%;animation-delay:2s}.tfloat.f4{right:20%;top:60%;animation-delay:3s}
@keyframes fl{50%{transform:translateY(-14px) rotate(-6deg)}}
.tui{position:absolute;left:50%;top:7%;transform:translateX(-50%);text-align:center;z-index:2;width:min(640px,92vw)}
.tlogo{font-family:var(--head);font-size:clamp(40px,7vw,78px);line-height:.95;color:#fff;letter-spacing:2px;text-shadow:0 4px 0 #3A86D8,0 8px 24px rgba(0,0,0,.4)}
.tlogo span{color:#FFC93C;text-shadow:0 4px 0 #E8762A,0 8px 24px rgba(0,0,0,.4)}
.ttag{font-family:var(--head);font-size:clamp(18px,2.4vw,26px);color:#CFE2FF;margin-top:10px}
.tbtns{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.tbtns button{font-family:var(--head);font-size:22px;padding:14px 34px;border-radius:18px;border:none;min-width:210px;transition:transform .12s}
.tbtns button:hover:not(:disabled){transform:translateY(-3px)}
.tbtn-main{background:linear-gradient(180deg,#FFD25A,#F2A33A);color:#3B2A05;box-shadow:0 6px 0 #C47A12,0 12px 24px rgba(0,0,0,.35)}
.tbtn-main:hover:not(:disabled){background:linear-gradient(180deg,#FFDD7A,#F5B04F)!important}
.tbtn-sub{background:linear-gradient(180deg,#5FA0E6,#3A86D8);color:#fff;box-shadow:0 6px 0 #22599A,0 12px 24px rgba(0,0,0,.35)}
.tbtn-sub:hover:not(:disabled){background:linear-gradient(180deg,#74AFEC,#4A92DE)!important}
.tbtn-sub small{display:block;font-family:var(--body);font-size:12px;opacity:.9;margin-top:2px}
.tbtn-sub:disabled{opacity:.5;filter:grayscale(.4)}
.tcredit{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:12px;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#joinOv{z-index:55}
.joincard{max-width:400px}
.jl{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13.5px;margin-bottom:12px}
.jl input{font-size:18px;padding:9px 12px;border-radius:10px;border:2px solid var(--line)}
.jl input:focus{border-color:var(--ctrl);outline:none}
.jump{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:-10px;background:#FBFCFE;padding:4px 0;z-index:2}
.jump button{flex:1;padding:4px 2px}
.li.goal{border:2px solid #F2A33A;background:#FFF8EC}
.player{background:#2A3A5C;border-radius:20px;padding:4px 12px;font-size:13px;color:#fff;white-space:nowrap}
.player:empty{display:none}
/* 자동화 흐름 */
.flow{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.fstep{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:7px 9px;opacity:.45;transition:opacity .25s,border-color .25s}
.fstep .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-size:15px;color:#fff;background:#B9C7D4}
.fstep.on{opacity:1}
.fstep.ok{border-color:#9ED9B8}.fstep.ok .n{background:var(--ok)}
.fstep.fail{border-color:var(--bad);background:var(--bad-bg);opacity:1}.fstep.fail .n{background:var(--bad)}
.fstep .who{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:5px}
.fstep .msg{font-size:12.5px;color:var(--muted);margin-top:2px}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.rstat{background:var(--panel2);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}
.rstat b{display:block;font-family:var(--head);font-weight:400;font-size:26px;color:var(--ink)}
.meter{height:14px;background:#E3EAF1;border-radius:7px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--net),var(--plat))}
#toasts .toast .tact{pointer-events:auto;margin-left:10px;background:#fff;color:var(--ink);border:none;padding:3px 10px;border-radius:6px;font-weight:700}
.xbtn{color:var(--bad);padding:1px 7px}
.delbtn{color:var(--bad);border-color:#F2B8BA;background:var(--bad-bg);font-weight:700}
.delbtn:hover:not(:disabled){background:#FAD5D6!important}
#toasts{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:8px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .25s ease-out;max-width:560px;text-align:center}
.toast.bad{background:var(--bad)}.toast.good{background:var(--ok)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.quiz .q{margin-bottom:10px}
.quiz .q p{margin:0 0 5px;font-weight:700;font-size:13px}
.quiz label{display:block;font-size:12.5px;padding:4px 7px;border-radius:6px;cursor:pointer}
.quiz label:hover{background:var(--panel2)}
.quiz .fb{font-size:12px;margin-top:3px;padding:5px 7px;border-radius:6px}
textarea{width:100%;min-height:80px;resize:vertical;line-height:1.5}

@media (max-width:1280px){
  #main{grid-template-columns:200px 1fr 330px}
  #main.hideL{grid-template-columns:0 1fr 330px}#main.hideR{grid-template-columns:200px 1fr 0}
  #tgL{left:200px}#tgR{right:330px}
  #top .logo small{display:none}
  .stat{min-width:50px;padding:3px 6px}
}
@media (max-width:1050px){
  #steps button span{display:none}
  .stat .lb{display:none}
}
@media (max-width:860px){
  #main,#main.hideL,#main.hideR,#main.hideL.hideR{grid-template-columns:1fr}
  #left,#right{position:absolute;top:0;bottom:0;z-index:8;width:300px;box-shadow:0 0 30px rgba(0,0,0,.2)}
  #left{left:0}#right{right:0}
  #main:not(.showL) #left{display:none}#main:not(.showR) #right{display:none}
  #tgL{left:0}#tgR{right:0}#main.showL #tgL{left:300px}#main.showR #tgR{right:300px}
  #bottom{grid-template-columns:1fr}
  .startcard{grid-template-columns:1fr}
  .startcard h1{font-size:38px}
  .result-grid{grid-template-columns:repeat(2,1fr)}
}
@media print{
  body{overflow:visible}#app{display:none}.overlay{position:static;background:none;display:none}
  #resultOv.show{display:block}#resultOv .modal{box-shadow:none;max-height:none}
  .noprint{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">SMART HOME BUILDER<small>우리 집을 똑똑하게!</small></div>

    <div style="flex:1"></div>

      <div class="stat money" id="stMoneyBox" title="우리 집 예산 (학습용 예시값)"><span class="lb">💰 예산</span><b id="stMoney">300만원</b></div>

        <div id="mbody"></div>

</div>

'use strict';
/* =========================================================
   SMART HOME BUILDER — 데이터 정의
   ※ 소비전력은 학습용 예시값입니다.
========================================================= */

const ROOMS = {

  garage: {name:'차고', floor:1, x:980, y:386, w:210, h:200, color:'#E4E7EC', side:'#D2D7DF', floorC:'#B8BEC7', win:false, wing:true},
  grandma:{name:'내 방', floor:3, x:70, y:-46, w:430, h:200, color:'#E5F2E1', side:'#D2E8CC', floorC:'#C9AE88', win:true},
  gym:    {name:'헬스장', floor:3, x:500, y:-46, w:430, h:200, color:'#E2ECFB', side:'#CDDCF4', floorC:'#9FA8B8', win:true}
};
const BASE_ROOMS = ['entry','living','kitchen','bath','bed','study'];

/* 무선 네트워크 연결 상태: none(연결되지 않음) / ok(연결됨) / err(연결 오류) */
const jammed = () => !!(S.jam && !(S.up && S.up.lte));
function netStatus(d){
  if(T(d).kind==='net'){
    if(d.type==='router') return (S.netFault || jammed()) ? 'err' : 'ok';
    if(!router()) return 'err';
    return (S.netFault || jammed()) ? 'err' : 'ok';
  }
  if(!d.linked) return 'none';
  if(!router() || S.netFault || jammed()) return 'err';
  if(T(d).kind==='sensor' && !hub()) return 'err';
  return 'ok';
}
const NET_LABEL = {ok:'연결됨', none:'연결되지 않음', err:'연결 오류'};
const netOnline = () => !!router() && !S.netFault && !jammed();              // 집 ↔ 플랫폼 통신 가능
const batDead = d => d && d.bat!=null && d.bat<=0;

  return d.on ? t.w : t.sb;
}

/* ---------- 시간·빛 ---------- */
const hourOf = t => (t/60)%24;
function clockStr(t){ t = ((t%1440)+1440)%1440; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function daylight(t){
  const h = hourOf(t);
  if(h>=7 && h<17) return 1;
  if(h>=6 && h<7) return h-6;
  if(h>=17 && h<19) return (19-h)/2;
  return 0;
}
const isNight = t => { const h = hourOf(t); return h>=19 || h<6; };
function naturalLux(room){
  let l = daylight(S.time) * WIN_LUX[room];
  const c = findDev('curtain', room);
  if(c && !c.on) l *= 0.2;
  return l;
}

}

function canInstall(type, room){
  const t = TYPES[type];
  if(!ROOM_ORDER.includes(room)) return `${josa(ROOMS[room].name,'은','는')} 아직 지어지지 않았어요.`;
  if(t.needRoom && !ROOM_ORDER.includes(t.needRoom)) return `${josa(t.name,'은','는')} 3층을 증축해 2층이 할머니 방이 된 뒤에 설치할 수 있어요.`;
  if(t.onlyRoom && t.onlyRoom!==room) return `${josa(t.name,'은','는')} ${ROOMS[t.onlyRoom].name}에만 설치할 수 있어요.`;
  if(t.single && ofType(type).length) return `${josa(t.name,'은','는')} 집에 하나만 설치할 수 있어요. 옮기려면 기기를 선택해 위치를 바꾸세요.`;
  if(findDev(type, room)) return `${ROOMS[room].name}에는 이미 ${josa(t.name,'이','가')} 있어요.`;
  if(S.devices.filter(d => d.room===room).length >= 10) return `${ROOMS[room].name}에는 더 설치할 공간이 없어요.`;
  if(S.money < PRICE[type]) return `예산이 부족해요. ${josa(t.name,'은','는')} ${won(PRICE[type])}인데 남은 예산은 ${won(S.money)}이에요.`;
  return '';
}
function installDev(type, room){
  const why = canInstall(type, room);
  if(why){ toast(why,'bad'); return null; }
  const t = TYPES[type];
  const d = {id:'d'+(S.nid++), type, room, on:!!t.defOn, linked:false, reg:false, byAuto:false, reading:{}, paid:PRICE[type]};
  S.money -= PRICE[type];
  if(t.sp!=null) d.sp = t.sp;
  if(t.kind==='sensor' && !(S.up && S.up.wired)){ d.bat = 100; d.drain = 0.55 + Math.random()*0.35; }
  if(S.sec) S.sec.fw = false;
  if(type==='curtain') d.on = true; // 열림
  S.devices.push(d);
  readSensor(d);
  addLog(`${devName(d)} 설치`);
  ui.sel = d.id; ui.pending = null;
  if(window.innerWidth>860) ui.tab = 'dev';
  toast(`${josa(devName(d),'을','를')} 설치했어요 (−${manwon(PRICE[type])})`);
  update();
  return d;
}
function removeDev(id, silent){
  const d = devById(id); if(!d) return;
  if(d.type==='car'){ toast('아빠 차는 제거할 수 없어요. 🚗','bad'); return; }
  const idx = S.devices.indexOf(d);
  const rel = S.rules.filter(r => actionTargets(r.act).includes(d) || r.conds.some(c => c.room===d.room && CONDS[c.type].sensors && CONDS[c.type].sensors.includes(d.type))).length;
  const inGame = S.game && S.game.started;
  const refund = Math.round((d.paid!=null?d.paid:PRICE[d.type]) * (inGame?0.5:1));
  ui.lastRemoved = {dev:JSON.parse(JSON.stringify(d)), idx, pdata:S.pdata[id], refund};
  S.devices.splice(idx, 1);
  S.money += refund;
  delete S.pdata[id];
  addLog(`${devName(d)} 제거`);
  if(ui.sel===id) ui.sel = null;
  if(!silent) toast(`${josa(devName(d),'을','를')} 제거했어요 (+${manwon(refund)}${inGame?', 중고 판매 50%':''}).` + (rel?` 이 기기를 쓰는 규칙 ${rel}개는 작동하지 않아요.`:''), '', {label:'되돌리기', fn:'undoRemove()'});
  update();
}
function undoRemove(){
  const L = ui.lastRemoved; if(!L) return;
  if(findDev(L.dev.type, L.dev.room) || (TYPES[L.dev.type].single && ofType(L.dev.type).length)){ toast('같은 자리에 이미 기기가 있어 되돌릴 수 없어요.','bad'); return; }
  if(S.money < L.refund){ toast('예산이 부족해 되돌릴 수 없어요.','bad'); return; }
  S.money -= L.refund;
  S.devices.splice(Math.min(L.idx, S.devices.length), 0, L.dev);
  if(L.pdata) S.pdata[L.dev.id] = L.pdata;
  ui.lastRemoved = null; ui.sel = L.dev.id;
  addLog(`${devName(L.dev)} 제거 취소`);

}

function linkDev(id, on){
  const d = devById(id); if(!d) return;
  if(on){
    if(!router()){ toast('먼저 무선 공유기를 설치하세요. 공유기가 무선 네트워크를 만들어요.','bad'); return; }
    if(T(d).kind==='sensor' && !hub()){ toast('센서는 저전력 무선 방식이라 스마트 홈 허브가 있어야 연결돼요.','bad'); return; }
    d.linked = true;
    addLog(`${devName(d)} 무선 네트워크 연결`);
    if(netStatus(d)==='ok') animDevToCloud(d, '#10A39A');
  } else {
    d.linked = false;
    addLog(`${devName(d)} 네트워크 연결 해제`);
  }
  update();
}
const linkable = () => S.devices.filter(d => T(d).kind!=='net');
const allLinked = () => { const L = linkable(); return L.length>0 && L.every(d => d.linked); };
const allReg = () => { const L = linkable().filter(d => netStatus(d)==='ok'); return L.length>0 && L.every(d => d.reg) && linkable().filter(d => d.reg).length>0; };
function linkAll(){
  if(allLinked()){
    const n = linkable().length;
    linkable().forEach(d => d.linked = false);
    addLog(`기기 ${n}대 네트워크 연결 모두 해제`); toast(`기기 ${n}대의 네트워크 연결을 모두 해제했어요`);
    update(); return;
  }
  if(!router()){ toast('먼저 무선 공유기를 설치하세요.','bad'); return; }
  let n=0, skip=0;
  S.devices.forEach(d => {
    if(T(d).kind==='net' || d.linked) return;
    if(T(d).kind==='sensor' && !hub()){ skip++; return; }
    d.linked = true; n++;
  });
  if(n) addLog(`기기 ${n}대 무선 네트워크 연결`);
  toast(n ? `기기 ${n}대를 연결했어요` + (skip?` (허브가 없어 센서 ${skip}대는 연결 못 함)`:'') : (skip? '허브가 없어 센서를 연결할 수 없어요':'연결할 기기가 없어요'), n?'':'bad');
  update();
}
function setFault(on){
  if(!on && S.netFault) S.flags.fixer = true;
  S.netFault = on;
  if(on){ addLog('⚠ 공유기 장애 발생 — 모든 기기 연결 오류','bad'); toast('공유기에 장애가 생겼어요. 기기들이 연결 오류 상태가 됐어요.','bad'); }
  else { addLog('공유기 재시작 — 네트워크 복구'); toast('공유기를 다시 시작해 네트워크를 복구했어요','good'); }

}
function regDev(id, on){

function regAll(){
  if(allReg()){
    const L = linkable().filter(d => d.reg);
    L.forEach(d => { d.reg = false; delete S.pdata[d.id]; });
    addLog(`기기 ${L.length}대 플랫폼 등록 모두 해제`); toast(`기기 ${L.length}대의 플랫폼 등록을 모두 해제했어요`);
    update(); return;
  }
  let n=0;
  S.devices.forEach(d => { if(T(d).kind!=='net' && !d.reg && netStatus(d)==='ok'){ d.reg = true; n++; } });
  if(n) addLog(`기기 ${n}대 플랫폼 등록`);
  toast(n?`연결된 기기 ${n}대를 플랫폼에 등록했어요`:'등록할 수 있는 기기가 없어요. 먼저 네트워크에 연결하세요.', n?'':'bad');
  update();
}
function pairCtrl(on){
  if(on){
    if(!netOnline()){ toast(router()? '공유기 장애로 집 네트워크에 접속할 수 없어요.' : '집에 무선 공유기가 없어 스마트폰을 연결할 수 없어요.','bad'); return; }
    S.ctrl.paired = true; addLog('스마트폰 컨트롤러를 플랫폼에 연결');
    animPath([CLOUD, PHONE], '#3A86D8');
    toast('스마트폰이 플랫폼에 연결됐어요. 이제 원격 제어와 규칙 설정을 할 수 있어요.','good');
  } else {
    S.ctrl.paired = false; addLog('스마트폰 컨트롤러 연결 해제');
    toast('스마트폰 연결을 해제했어요. 플랫폼에 저장된 규칙은 계속 작동해요.');
  }
  update();
}

/* 스마트폰 원격 제어: 컨트롤러 → 플랫폼 → 네트워크 → 기기 */
function remoteReason(d){
  if(!ctrlReady()) return '스마트폰이 플랫폼에 연결되지 않았어요';
  if(!d.reg) return '플랫폼에 등록되지 않은 기기예요';
  const ns = netStatus(d);
  if(ns==='none') return '기기가 네트워크에 연결되지 않았어요';
  if(ns==='err') return netErrReason(d) || '연결 오류';
  return '';
}
function remoteSet(id, on){
  const d = devById(id); if(!d) return;
  const why = remoteReason(d);
  if(why){ toast('원격 제어 실패: '+why,'bad'); addLog(`원격 제어 실패(${devName(d)}): ${why}`,'bad'); update(); return; }
  if(d.type==='fridge' && !on){ toast('냉장고는 음식 보관을 위해 끄지 않아요.','bad'); return; }
  d.on = on; d.byAuto = false; S.flags.remote = true;
  addLog(`📱 원격 제어: ${devName(d)} ${stateLabel(d)}`);
  animPath(joinPts([PHONE], cmdPath(d)), '#3A86D8');
  update();
}
/* 기기 본체(현장) 조작: 네트워크와 무관 */
function localSet(id, on){
  const d = devById(id); if(!d) return;
  if(d.type==='fridge' && !on){ toast('냉장고는 음식 보관을 위해 끄지 않아요.','bad'); return; }
  d.on = on; d.byAuto = false;
  addLog(`기기 본체 버튼: ${devName(d)} ${stateLabel(d)}`);
  update();
}
function setAway(on, by){
  if(!ctrlReady()){ toast('외출 모드는 스마트폰(컨트롤러)에서 켜요. 먼저 스마트폰을 플랫폼에 연결하세요.','bad'); return false; }
  S.away = on;
  addLog(`📱 외출 모드 ${on?'켜짐':'꺼짐'}${by?' ('+by+')':''}`);
  animPath([PHONE, CLOUD], '#3A86D8');
  update();
  return true;
}
function stateLabel(d){
  switch(d.type){
    case 'curtain': return d.on?'열림':'닫힘';
    case 'doorlock': return d.on?'잠김':'열림';
    case 'gasvalve': case 'watervalve': return d.on?'차단됨':'열림';
    case 'cctv': return d.on?'녹화 중':'꺼짐';
    case 'siren': return d.on?'경보 중':'대기';
    case 'router': return S.netFault?'장애':'작동 중';
    case 'hub': return netStatus(d)==='ok'?'작동 중':'연결 오류';
    case 'fridge': return '작동 중';
    case 'evcharger': return d.on?'충전 중':'대기';
    case 'ebike': return (S.live&&S.live.bike&&S.live.bike.away?'운행 중 · ':'')+(d.on?'⚡ 충전 중':'충전 꺼짐')+(d.locked?' · 🔒 잠김':' · 🔓 풀림');
    case 'car': return (S.live&&S.live.car&&S.live.car.away?'운행 중 · ':'')+(d.on?'시동·공조 켜짐':'시동 꺼짐')+(d.locked?' · 🔒 잠김':' · 🔓 열림');
    case 'purifier': return d.on?'정화 중':'꺼짐';
    default:
      if(T(d).kind==='sensor') return '감지 중';
      return d.on?'켜짐':'꺼짐';
  }
}

/* =========================================================
   ① 센서: 실제 환경을 감지
========================================================= */
function readSensor(d){
  if(T(d).kind!=='sensor') return;
  if(batDead(d)){ d.reading = {dead:true}; return; }
  const e = S.env[d.room]; if(!e) return; const rd = {};
  T(d).reads.forEach(k => {
    if(k==='temp') rd.temp = r1(e.temp);
    if(k==='hum') rd.hum = Math.round(e.hum);
    if(k==='lux') rd.lux = Math.round(e.lux);
    if(k==='motion') rd.motion = e.motionT>0;
    if(k==='occ') rd.occ = e.occ || e.motionT>0;
    if(k==='gas') rd.gas = e.gas>=15;
    if(k==='leak') rd.leak = e.leak>=10;
    if(k==='open') rd.open = e.openT>0;
    if(k==='dust') rd.dust = Math.round(e.dust);
  });
  rd.gasLv = Math.round(e.gas); rd.leakLv = Math.round(e.leak);
  d.reading = rd;
}
function sensorText(d){
  const r = d.reading||{};
  if(r.dead) return '🪫 배터리 없음';
  switch(d.type){
    case 'contact': return r.open?'열림!':'닫힘';
    case 'dust': return r.dust+'㎍';
    case 'temp': return r.temp+'℃';
    case 'hum': return r.hum+'%';
    case 'th': return r.temp+'℃ '+r.hum+'%';
    case 'lux': return r.lux+'lx';
    case 'motion': return r.motion?'움직임!':(r.occ?'사람 있음':'없음');
    case 'gas': return r.gas?'가스 감지!':'정상';
    case 'leak': return r.leak?'누수 감지!':'정상';
  }
  return '';
}
/* 플랫폼이 받은 값 (센서→네트워크→플랫폼이 모두 준비되어야 존재) */
function platformValue(room, cond){
  const c = CONDS[cond];
  const d = c.sensors.map(t => findDev(t, room)).find(x => devReady(x));
  if(!d) return undefined;
  const p = S.pdata[d.id];
  return p ? p.v[c.key] : undefined;
}

/* =========================================================
   자동화 규칙 엔진 (플랫폼에서 실행)
========================================================= */
function condText(c){
  const C = CONDS[c.type];
  const where = C.noRoom ? '' : ROOMS[c.room].name+' ';
  if(C.num) return `${where}${C.label} ${c.op==='>='?'≥':'≤'} ${c.val}${C.unit}`;
  const st = C.states.find(s => s[0]===c.val);
  return `${where}${C.label} ${st?st[1]:''}`;
}
function actText(a){
  const A = ACTIONS[a.type];
  if(A.noRoom) return A.label;
  return `${a.room==='all'?'집 전체':ROOMS[a.room].name} ${A.label}`;
}
function ruleText(r){ return {iff:r.conds.map(condText).join(' 그리고 '), then:actText(r.act)}; }
function actionTargets(a){
  const A = ACTIONS[a.type];
  if(!A.devs) return [];
  return S.devices.filter(d => A.devs.includes(d.type) && (A.noRoom || a.room==='all' || d.room===a.room));
}
/* 규칙이 작동하는 데 필요한 구성 요소 점검 → 문제 목록 */
function ruleProblems(r){
  const P = [];
  if(!router()) P.push({c:'net', m:'무선 공유기가 설치되지 않았어요'});
  else if(S.netFault) P.push({c:'net', m:'공유기 장애로 네트워크가 끊겼어요 (네트워크 탭에서 복구)'});
  r.conds.forEach(c => {
    const C = CONDS[c.type];
    if(!C.sensors) return;
    const s = findSensor(c.room, C.sensors);
    const nm = `${ROOMS[c.room].name} ${C.sensors.map(t=>TYPES[t].name).join('/')}`;
    if(!s) P.push({c:'sensor', m:`${nm}가 없어 ${C.label} 정보를 모을 수 없어요`});
    else devProblems(s, P);
  });
  const A = ACTIONS[r.act.type];
  if(r.act.type==='alert'){
    if(!ctrlReady()) P.push({c:'ctrl', m:'알림을 받을 스마트폰이 플랫폼에 연결되지 않았어요'});
  } else {
    const tg = actionTargets(r.act);
    if(!tg.length){
      const nm = A.devs.map(t=>TYPES[t].name).join('·');
      const where = (A.noRoom || r.act.room==='all') ? '집 안' : ROOMS[r.act.room].name;
      P.push({c:'device', m:`${where}에 ${josa(nm,'이','가')} 설치되지 않았어요`});
    }
    else tg.forEach(d => devProblems(d, P));
  }
  if(!r.enabled) P.push({c:'ctrl', m:'스마트폰에서 이 규칙이 꺼져 있어요'});
  const seen = new Set();
  return P.filter(p => seen.has(p.m) ? false : seen.add(p.m));
}
function devProblems(d, P){
  const ns = netStatus(d);
  if(ns==='none') P.push({c:'net', m:`${josa(devName(d),'이','가')} 무선 네트워크에 연결되지 않았어요`});
  else if(ns==='err' && T(d).kind==='sensor' && !hub() && router() && !S.netFault) P.push({c:'net', m:'허브가 없어 센서가 네트워크에 연결되지 못해요'});
  if(!d.reg) P.push({c:'plat', m:`${josa(devName(d),'이','가')} 플랫폼에 등록되지 않았어요`});
  if(batDead(d)) P.push({c:'sensor', m:`${devName(d)}의 배터리가 다 닳았어요`});
}
function evalCond(c){
  const C = CONDS[c.type];
  if(c.type==='away') return c.val==='on' ? S.away : !S.away;
  if(c.type==='time') return c.val==='night' ? isNight(S.time) : !isNight(S.time);
  if(c.type==='clock') return Math.abs(S.time - Number(c.val)) < 10;
  const v = platformValue(c.room, c.type);
  if(v===undefined) return false;
  if(C.num) return c.op==='>=' ? v>=c.val : v<=c.val;
  if(c.type==='presence') return c.val==='yes' ? v : !v;
  return !!v;
}
function execAction(r, forced){
  const A = ACTIONS[r.act.type];
  const changed = [];
  if(r.act.type==='alert'){
    if(ctrlReady()){
      pushAlert(`🚨 ${r.name||'보안 알림'}: ${ruleText(r).iff}`, 'security');
      animPath([CLOUD, PHONE], '#E5484D');
      addLog(`🚨 스마트폰으로 보안 알림 전송 (${ruleText(r).iff})`,'bad');
    } else addLog('보안 알림을 보낼 스마트폰이 없어요','bad');
    return true;
  }
  actionTargets(r.act).forEach(d => {
    if(!devReady(d)) return;
    if(d.type==='car' && S.live && S.live.car && S.live.car.away && !A.lock && A.set){ return; }
    if(d.type==='ebike' && S.live && S.live.bike && S.live.bike.away && !A.lock && A.set){ return; }
    if(A.lock){ if(S.live) S.live.flags.lockAuto = true; if(!d.locked){ d.locked = true; d.byAuto = true; changed.push(d); animPath(cmdPath(d), '#10A39A', 120); } return; }
    if(d.on!==A.set){
      d.on = A.set; d.byAuto = true; changed.push(d);
      animPath(cmdPath(d), '#10A39A', 120);
    }
  });

  if(changed.length) addLog(`⚙ 자동화: ${changed.map(d=>devName(d)+' '+stateLabel(d)).join(', ')}`,'auto');
  if(r.act.type==='alarm' && changed.length && ctrlReady()) pushAlert('🔊 경보기가 울렸어요','security');
  return changed.length>0 || forced;
}
function runRules(){
  if(!netOnline()) { S.rules.forEach(r => r.lastTrue=false); return; }
  S.rules.forEach(r => {
    if(!r.enabled){ r.lastTrue=false; return; }
    if(ruleProblemsFast(r)){ r.lastTrue=false; return; }
    const truth = r.conds.every(evalCond);
    if(truth){
      const edge = !r.lastTrue;
      if(r.act.type==='alert'){ if(edge){ execAction(r); r.fired=(r.fired||0)+1; r.lastAt=clockStr(S.time); } }
      else { execAction(r); if(edge){ r.fired=(r.fired||0)+1; r.lastAt=clockStr(S.time); } }
      if(edge && r.conds.some(c=>CONDS[c.type].sensors)) {
        const c0 = r.conds.find(c=>CONDS[c.type].sensors);
        const s = findSensor(c0.room, CONDS[c0.type].sensors);
        if(s) animDevToCloud(s, '#E8962A');
      }
    }
    r.lastTrue = truth;
  });
}
/* 장치 측 준비 여부만 빠르게 확인(규칙 실행 차단용) */
function ruleProblemsFast(r){
  for(const c of r.conds){
    const C = CONDS[c.type]; if(!C.sensors) continue;
    if(!C.sensors.map(t=>findDev(t,c.room)).some(x=>devReady(x))) return true;
  }
  return false;
}

/* =========================================================
   시뮬레이션 (5분 단위)
========================================================= */
function physics(){
  const day = daylight(S.time);
  ROOM_ORDER.forEach(rm => {
    const e = S.env[rm];
    // 온도
    let eq = 22 + (S.out-22)*0.75 + (liveOn() ? (ROOMS[rm].floor>=2 ? 1.2 : -0.3) : 0);
    const cur = findDev('curtain', rm);
    if(cur && !cur.on && S.out>26 && day>0.5) eq -= 1.5;
    e.temp += (eq - e.temp)*0.04;
    const ac = findDev('aircon', rm), ht = findDev('heater', rm);
    if(ac && ac.on && e.temp > ac.sp){ e.temp = Math.max(ac.sp, e.temp-0.7); e.hum = Math.max(35, e.hum-0.3); }
    if(ht && ht.on && e.temp < ht.sp){ e.temp = Math.min(ht.sp, e.temp+1.1); }
    // 습도
    e.hum += (50 - e.hum)*0.012;
    if(e.shower>0){ e.hum = Math.min(95, e.hum+7); e.temp += 0.15; e.shower--; }
    const fan = findDev('fan', rm);
    if(fan && fan.on) e.hum = Math.max(40, e.hum-4);
    // 가스
    const gv = findDev('gasvalve', rm);
    if(e.gasSrc && !(gv && gv.on)) e.gas = Math.min(100, e.gas+9);
    else e.gas = Math.max(0, e.gas*0.8 - 0.5);
    if(e.gasSrc && gv && gv.on) e.gasSrc = false;
    // 누수
    const wv = findDev('watervalve', rm);
    if(e.leakSrc && !(wv && wv.on)) e.leak = Math.min(100, e.leak+10);
    else e.leak = Math.max(0, e.leak-4);
    if(e.leakSrc && wv && wv.on) e.leakSrc = false;
    // 움직임
    if(e.motionT>0) e.motionT--;
    if(e.intruder) e.motionT = Math.max(e.motionT,1);
    if(e.openT>0) e.openT--;
    // 미세먼지
    e.dust += ((S.dustOut||30)*0.7 - e.dust)*0.06;
    const pu = findDev('purifier', rm);
    if(pu && pu.on) e.dust = Math.max(8, e.dust-7);
  });
  updateLux();
}
function updateLux(){
  ROOM_ORDER.forEach(rm => {
    const lt = findDev('light', rm);
    S.env[rm].lux = naturalLux(rm) + (lt && lt.on ? 300 : 0) + (findDev('tv',rm)&&findDev('tv',rm).on?15:0);
  });
}
function platformReceive(){
  S.devices.forEach(d => {
    if(T(d).kind!=='sensor') return;
    readSensor(d);
    if(devReady(d) && netOnline()){
      const prev = S.pdata[d.id];
      S.pdata[d.id] = {v:{...d.reading}, t:clockStr(S.time)};
      if(!prev || (S.tick % 4 === (parseInt(d.id.slice(1))%4))) animDevToCloud(d, '#E8962A', 0.6);
    }
  });
}
function energyTick(mins){
  const h = mins/60;
  S.energy.wh += totalPower()*h;
  S.devices.forEach(d => { if(d.byAuto && !d.on && T(d).w) S.energy.saved += (T(d).w - T(d).sb)*h; });
}
function tick(){
  S.tick++; S.stick++; S.simTicks++;
  const L = liveOn();
  S.time = (S.time + (L?10:5)) % 1440;
  if(L) liveBefore(); else scenarioEvents(S.scen, S.stick);
  physics();
  ROOM_ORDER.forEach(rm => { const cc = findDev('cctv', rm); if(S.env[rm].intruder && cc && cc.on && !S.cctvRec){ S.cctvRec = true; addLog(`📹 ${ROOMS[rm].name} CCTV가 도둑의 모습을 녹화했어요`); } });
  platformReceive();
  runRules();
  updateLux();
  S.devices.forEach(readSensor);
  energyTick(L?10:5);
  if(L) liveAfter();
  if(ui.test) testTick();
  refreshLive();
}
function hazard(){
  const h = [];
  ROOM_ORDER.forEach(rm => {
    const e = S.env[rm];
    if(e.gas>=15) h.push(ROOMS[rm].name+' 가스');
    if(e.leak>=10) h.push(ROOMS[rm].name+' 누수');
    if(e.intruder) h.push(ROOMS[rm].name+' 침입');
  });
  return h;
}

/* ---------- 상황(시나리오) ---------- */
function loadScenario(key, keepAway){
  const sc = SCENARIOS[key];
  S.scen = key; S.stick = 0; S.time = sc.time; S.out = sc.out;
  S.env = freshEnv();
  const base = key==='heat'?30 : key==='cold'?15 : key==='shower'?23 : 23;
  ROOM_ORDER.forEach(rm => { S.env[rm].temp = base - (ROOMS[rm].floor===2 && key==='heat' ? 1 : 0); S.env[rm].hum = key==='heat'?60:50; });
  // 기기 작동 상태 초기화
  S.devices.forEach(d => { d.on = !!T(d).defOn; d.byAuto = false; if(d.type==='curtain') d.on = true; });
  S.rules.forEach(r => r.lastTrue = false);
  S.pdata = {};
  if(!keepAway) S.away = false;
  switch(key){
    case 'normal': S.env.living.occ = true; break;
    case 'heat': S.env.living.occ = true; break;
    case 'cold': S.env.bed.occ = true; break;
    case 'leave':
      S.env.living.occ = true; S.env.bed.occ = true;
      S.devices.forEach(d => { if(['light','tv','plug'].includes(d.type)) d.on = true; });
      break;
    case 'intrude': S.away = true; break;
    case 'gas': S.env.kitchen.occ = true; break;
    case 'shower': S.env.bath.occ = true; S.env.bath.shower = 7; break;
    case 'leak': S.env.living.occ = true; break;
    case 'night': S.env.living.occ = true; break;
  }
  updateLux();
  S.devices.forEach(readSensor);
  addLog(`상황 변경: ${sc.name}`);
}
function scenarioEvents(key, t){
  const E = S.env;
  if(key==='leave'){
    if(t===2){ ROOM_ORDER.forEach(r => E[r].occ=false); addLog('👨‍👩‍👧 가족이 모두 외출했어요. 조명과 TV가 켜진 채로예요.'); }
    if(t===3){
      if(ctrlReady() && netOnline()) { S.away = true; addLog('📱 가족이 스마트폰에서 외출 모드를 켰어요'); animPath([PHONE, CLOUD], '#3A86D8'); }
      else addLog('📱 외출 모드를 켜려 했지만 스마트폰이 플랫폼에 연결되지 않았어요','bad');
    }
  }
  if(key==='intrude'){
    if((E.entry.intruder || E.living.intruder) && ofType('siren').some(d => d.on)){
      E.entry.intruder = false; E.living.intruder = false; S.fled = true;
      addLog('🚨 경보 소리에 도둑이 깜짝 놀라 도망쳤어요!'); toast('🚨 경보 소리에 도둑이 도망쳤어요!','good');
    }

const LADDER = [

function winRooms(){ return ['bed','study'].concat(ROOM_ORDER.includes('kid')?['kid']:[]); }
function makeThreat(day, k){
  const x = {day, type:k.type};
  if(k.type==='thief'){
    x.lv = k.lv; x.jam = !!k.jam;
    if(k.lv===1){ x.room = 'entry'; x.at = rnd(10,16)*60 + pick([0,20,40]); x.news = '요즘 낮에 빈집 현관으로 들어오는 도둑이 있대요!'; }

    else { x.room = pick(winRooms().concat(['entry'])); x.at = rnd(10,16)*60 + pick([0,30]); x.news = x.jam ? '⚠ 전파 방해기로 와이파이를 끊고 침입하는 도둑을 조심하세요!' : '도둑이 다시 나타났대요. 문과 창문을 조심하세요!'; }
  }

  if(k.type==='gas'){ x.at = rnd(18,20)*60 + pick([0,30]); x.news = '저녁 요리 시간에 가스 사고가 잦대요. 가스레인지 주변을 조심하세요.'; }

  if(k.type==='dust'){ x.at = 0; x.news = '내일은 미세먼지가 "매우 나쁨"이에요.'; }

function planDay(day){
  const L = S.live; if(day<2 || L.threats.some(x => x.day===day)) return;
  L.plan = L.plan || {ladder:0, lastBig:0};
  const P = L.plan, next = LADDER[P.ladder];
  let k;
  if(next && day>=next.minDay && (Math.random()<0.55 || day>=next.minDay+1)){ k = next; P.ladder++; }
  else if(!next){ // 단계를 다 겪은 뒤: 완전 랜덤
    const r = Math.random();
    k = r<0.35 ? {type:'thief', lv:3, jam:Math.random()<0.5} : r<0.45 ? {type:'hacker'} : r<0.6 ? {type:'gas'} : r<0.75 ? {type:'leak'} : r<0.9 ? {type:'heat'} : {type:'dust'};
    if((k.type==='gas'||k.type==='leak') && day-P.lastBig<2) k = {type:pick(['heat','dust'])};
  }
  else if(day-P.lastBig>=2 && Math.random()<0.5){ k = {type:pick(['gas','leak'])}; }
  else k = {type:pick(['heat','heat','dust'])};
  if(k.type==='gas'||k.type==='leak') P.lastBig = day;
  L.threats.push(makeThreat(day, k));
}

  const parts = [
    ['🔌 기기 설치 (비쌀수록 높음)', S.devices.reduce((a,d) => a+devScore(d), 0)],
    ['📶 네트워크 연결', S.devices.filter(d => T(d).kind!=='net' && netStatus(d)==='ok').length*10],
    ['☁️ 플랫폼 등록', S.devices.filter(d => T(d).kind!=='net' && devReady(d)).length*10],
    ['📱 컨트롤러 연결', S.ctrl.paired?30:0],
    ['⚙️ 자동화 규칙 (작동하는 규칙 1개당 200)', ready.length*200 + ready.filter(r => r.fired).length*50 + (S.rules.length-ready.length)*20],
    ['💌 가족 의뢰 해결 (1개당 150)', Object.keys(L.quests||{}).length*150],
    ['🛡️ 위험 막기 (1번당 200)', (L.nBlocked||0)*200],
    ['📅 운영 일수 (하루당 30)', Math.max(0,(L.day||1)-1)*30],
    ['😊 가족 만족도', L.started ? Math.round(L.sat*2) : 0],

  return {parts, total:parts.reduce((a,p) => a+p[1], 0)};
}

function roomNeeds(rm, asleep){
  const e = S.env[rm]; const n = [];
  if(e.temp>27.5) n.push('hot'); else if(e.temp<18) n.push('cold');
  if(!asleep && e.lux<60) n.push('dark');
  if(e.hum>72) n.push('humid');
  if(e.dust>80) n.push('dust');
  return n;
}

/* ---------- 벽을 따라가는 배선 경로 ----------
   기기 → 가까운 방 벽 → 층 사이 배선 통로(슬래브) → 목적지 방 벽 → 목적지 */
const SLAB_Y = 378, OUT_X = 946;
function wallX(rm, p, tx, lane){
  const R = ROOMS[rm]; const L = R.x+5+lane, Rr = R.x+R.w-5-lane;
  // 방 안을 가로지르는 구간이 가장 짧도록 가까운 벽을 고름
  return (p.x-R.x < R.x+R.w-p.x) ? L : Rr;
}
function edgeY(rm, p, lane){ const R = ROOMS[rm]; return (p.y-R.y < R.h/2) ? R.y+5+lane : R.y+R.h-5-lane; }
function legOut(p, rm, lane){ // 기기 → 천장/바닥 모서리 → 가까운 옆벽
  const ey = edgeY(rm, p, lane), wx = wallX(rm, p, undefined, lane);
  return [p, {x:p.x, y:ey}, {x:wx, y:ey}];
}
function route(a, ra, b, rb, lane){
  lane = lane||0;
  const sy = SLAB_Y - 4 + lane*3.2;
  const A = legOut(a, ra, lane), B = legOut(b, rb, lane).reverse();
  const xa = A[2].x, xb = B[0].x;
  if(ra===rb && xa===xb) return joinPts(A, B);
  return joinPts(A, [{x:xa, y:sy}, {x:xb, y:sy}], B);
}
function devRoute(d){ // 기기 → 연결 장비 (센서는 허브, 나머지는 공유기)
  const rt = router(), hb = hub();
  const tgt = T(d).kind==='sensor' ? (hb||rt) : rt;
  if(!tgt) return null;
  return route(devPos(d), d.room, devPos(tgt), tgt.room, T(d).kind==='sensor'?0:1);
}
function cloudRoute(lane){ // 공유기 → 바깥벽 → 플랫폼(클라우드)
  lane = lane==null ? 2 : lane;
  const rt = router(); if(!rt) return null;
  const A = legOut(devPos(rt), rt.room, lane); const sy = SLAB_Y - 4 + lane*3.2, ox = OUT_X + (lane-2)*4;
  return joinPts(A, [{x:A[2].x, y:sy}, {x:ox, y:sy}, {x:ox, y:CLOUD.y+2+(lane-2)*4}, {x:CLOUD.x>ox?CLOUD.x-44:CLOUD.x+40, y:CLOUD.y+2+(lane-2)*4}]);
}
function joinPts(...parts){
  const out = [];
  parts.filter(Boolean).forEach(pt => pt.forEach(q => { const l = out[out.length-1]; if(!l || Math.abs(l.x-q.x)>0.5 || Math.abs(l.y-q.y)>0.5) out.push(q); }));
  return out;
}
function upPath(d){ // 기기 → 플랫폼 전체 경로
  if(T(d).kind==='net' && d.type==='router') return cloudRoute();
  const hb = hub(), rt = router(); if(!rt) return null;
  const parts = [devRoute(d)];
  if(T(d).kind==='sensor' && hb) parts.push(route(devPos(hb), hb.room, devPos(rt), rt.room, 1));
  parts.push(cloudRoute());
  return joinPts(...parts);
}
const downPath = d => { const p = upPath(d); return p ? p.slice().reverse() : null; };
const pathD = pts => 'M'+pts.map(p => p.x.toFixed(1)+','+p.y.toFixed(1)).join(' L');

  if(rt) s += `<path class="netline wire ${S.netFault?'err':'ok'}" d="${pathD(cloudRoute())}"/>`;
  const hb = hub();
  if(ui.netView){
  if(hb && rt) s += `<path class="netline wire ${S.netFault?'err':'ok'}" d="${pathD(route(devPos(hb), hb.room, devPos(rt), rt.room, 1))}"/>`;
  S.devices.forEach(d => {
    if(T(d).kind==='net' || !d.linked) return;
    const ns = netStatus(d); if(ns==='none') return;
    const r = devRoute(d); if(!r) return;
    s += `<path class="netline wire ${ns==='ok'?'ok':'err'}" d="${pathD(r)}"/>`;
  });
  }
  // 플랫폼 등록선: 등록된 기기 → 공유기 → 플랫폼 (보라색 점선)
  if(rt && ui.platView!==false){

  return s;
}

/* ---------- 데이터 패킷 애니메이션 ---------- */
const packets = [];
function animPath(pts, color, delay){
  if(!pts) return;
  pts = pts.filter(Boolean);
  if(pts.length<2 || packets.length>40) return;
  const lens = []; let total = 0;
  for(let i=1;i<pts.length;i++){ const l = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); lens.push(l); total += l; }
  if(total<1) return;
  packets.push({pts, lens, total, color, arc:pts.length===2, t0:performance.now()+(delay||0), dur:Math.max(500, total/0.75)});
}
function animDevToCloud(d, color, prob){
  if(prob && Math.random()>prob) return;
  if(!router() || S.netFault) return;
  animPath(upPath(d), color);
}
function cmdPath(d){ return downPath(d); }
function pkLoop(now){
  const g = $('#gPk');
  if(g){
    let html = '';
    for(let i=packets.length-1;i>=0;i--){
      const p = packets[i]; const t = (now - p.t0)/p.dur;
      if(t>1){ packets.splice(i,1); continue; }
      if(t<0) continue;
      let dist = t*p.total, k = 0;
      while(k<p.lens.length-1 && dist>p.lens[k]){ dist -= p.lens[k]; k++; }
      const u = p.lens[k] ? Math.min(1, dist/p.lens[k]) : 1;
      const a = p.pts[k], b = p.pts[k+1];
      const x = a.x+(b.x-a.x)*u, y = a.y+(b.y-a.y)*u - (p.arc ? Math.sin(u*Math.PI)*18 : 0);
      html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${p.color}" stroke="#fff" stroke-width="2"/>`;
    }
    g.innerHTML = html;
  }
  requestAnimationFrame(pkLoop);
}

/* ---------- 확대·좌표 ---------- */
function zoomTo(rm){
  ui.zoom = rm;
  let tgt = vbFull();
  if(rm){
    const R = ROOMS[rm]; const st = $('#stage').getBoundingClientRect();
    const asp = st.width/Math.max(1,st.height);
    let w = R.w+60, h = R.h+60;
    if(w/h < asp) w = h*asp; else h = w/asp;
    tgt = [R.x+R.w/2-w/2, R.y+R.h/2-h/2, w, h];
  }
  const from = vbCur.slice(), t0 = performance.now();
  const step = now => {
    const k = Math.min(1,(now-t0)/350), e = 1-Math.pow(1-k,3);
    vbCur = from.map((v,i) => v+(tgt[i]-v)*e);
    $('#house').setAttribute('viewBox', vbCur.map(v=>v.toFixed(1)).join(' '));
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  $('#zoomOutBig').style.display = rm ? 'block' : 'none';
}
function svgPoint(cx, cy){
  const svg = $('#house'); const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  return pt.matrixTransform(svg.getScreenCTM().inverse());

    S.env = f.env; S.time = f.time; S.away = f.away; S.pdata = f.pdata;
    f.on.forEach(([id,on,ba]) => { const d = devById(id); if(d){ d.on = on; d.byAuto = ba; } });
    S.rules.forEach(r => r.lastTrue = false); updateLux(); S.devices.forEach(readSensor); update();
  }
}
let saveTimer = null;
let storageOK = true;
function saveNow(silent){
  const el = $('#saveState');
  try{
    S.savedAt = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    storageOK = true;
    const d = new Date(S.savedAt);
    if(el){ el.className = 'savest'; el.innerHTML = `✔ 자동 저장됨<br>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }
    if(!silent) toast('저장했어요. 다음에 [이어하기]로 계속할 수 있어요.','good');
  } catch(e){
    if(el){ el.className = 'savest bad'; el.innerHTML = '⚠ 저장 안 됨<br>브라우저에서 직접 여세요'; }
    if(!silent || storageOK){
      storageOK = false;
      openModal(`<h2>⚠ 이 화면에서는 저장할 수 없어요</h2><p style="line-height:1.7">지금 열린 곳(미리보기 창 등)이 브라우저 저장 공간을 막고 있어요. 게임은 할 수 있지만 창을 닫으면 진행 상황이 사라져요.</p>
        <div class="infobox">파일을 <b>Chrome이나 Edge에서 직접</b> 열거나, GitHub Pages 주소로 접속하면 자동 저장과 이어하기가 작동해요. 시크릿(InPrivate) 창도 닫으면 저장이 지워져요.</div>
        <div class="mfoot"><button class="primary" onclick="closeModal()">확인</button></div>`);
    }
  }
}
function scheduleSave(){ if(!S) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(true), 700); }
function update(){ checkBadges(); renderAll(); scheduleSave(); }
function renderAll(){ if(!S) return; renderHouse(); renderTop(); renderPalette(); renderRight(); renderMission(); renderBottom(); }
function refreshLive(){
  renderHouse(); renderTop(); renderBottom();
  const ae = document.activeElement;
  const inp = ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName);
  if(!(inp && $('#rbody').contains(ae))) renderRight();
  if(S.tick%5===0 && !(inp && $('#mbody').contains(ae))) renderMission();

  </div>`;

/* ---------- 단계별 체크리스트 ---------- */
function stepChecks(n){
  const acts = S.devices.filter(d => T(d).kind==='act'), sens = S.devices.filter(d => T(d).kind==='sensor');
  const linkedS = sens.filter(d => netStatus(d)==='ok').length, linkedA = acts.filter(d => netStatus(d)==='ok').length;
  const regS = sens.filter(devReady).length, regA = acts.filter(devReady).length;
  switch(n){
    case 1: return [];
    case 2: return [
      {t:`방 3곳 이상 클릭해서 살펴보기 (${Math.min(3,S.visited.length)}/3)`, d:S.visited.length>=3},
      {t:`센서가 아닌 스마트 기기 2개 이상 배치하기 (${Math.min(2,acts.length)}/2)`, d:acts.length>=2}];
    case 3: return [
      {t:`센서 2개 이상 설치하기 (${Math.min(2,sens.length)}/2)`, d:sens.length>=2},
      {t:'센서와 스마트 기기 구분하기 활동 완료', d:CLASSIFY.every((c,i) => S.classify[i]===c[1])}];
    case 4: return [
      {t:'무선 공유기 설치 (무선 네트워크 만들기)', d:!!router()},
      {t:'스마트 홈 허브 설치 (센서 연결용)', d:!!hub()},
      {t:`센서 1개와 스마트 기기 1개 이상을 네트워크에 연결 (센서 ${linkedS} · 기기 ${linkedA})`, d:linkedS>=1 && linkedA>=1},
      {t:`연결된 센서와 기기를 플랫폼에 등록 (센서 ${regS} · 기기 ${regA})`, d:regS>=1 && regA>=1},
      {t:'스마트폰 컨트롤러를 플랫폼에 연결', d:S.ctrl.paired}];
    case 5: return [
      {t:'스마트폰에서 자동화 규칙 1개 이상 만들기', d:S.rules.length>=1},
      {t:'스마트폰 자동화 목록의 [테스트]로 규칙이 작동하는지 확인하기', d:S.autoTestOk>=1},
      {t:`작동 준비가 끝난 규칙 2개 이상 만들기 (${Math.min(2,S.rules.filter(r=>r.enabled&&!ruleProblems(r).length).length)}/2)`, d:S.rules.filter(r=>r.enabled&&!ruleProblems(r).length).length>=2}];
    case 6: { const L = S.live||{}; const q = Object.keys(L.quests||{}).length; return [{t:`스마트 홈 7일 이상 운영하기 (${Math.max(0,(L.day||1)-1)}/7일)`, d:(L.day||1)>7}, {t:`가족 의뢰 3개 해결하기 (${Math.min(3,q)}/3)`, d:q>=3}, {t:`위험 3번 막기 (${Math.min(3,L.nBlocked||0)}/3)`, d:(L.nBlocked||0)>=3}]; }
    case 7: return [
      {t:'전체 작동 점검 실행하기', d:S.inspectDone},
      {t:'학습 확인 문제 풀기', d:S.quizDone},
      {t:'최종 질문에 내 생각 쓰기', d:(S.reflection||'').trim().length>=10}];
  }
  return [];
}
const stepDone = n => { const c = stepChecks(n); return c.length>0 && c.every(x => x.d); };
function checklistHTML(n){
  return `<div class="box">${stepChecks(n).map(c => `<div class="check ${c.d?'done':''}"><span class="ck">${c.d?'✓':''}</span><span class="t">${esc(c.t)}</span></div>`).join('')}</div>`;
}

function lockReason(k){

/* ---------- 전체 작동 점검 ---------- */
function safetyStatus(){
  const has = (cond, room, act) => S.rules.some(r => r.enabled && r.conds.some(c => c.type===cond && (!room || c.room===room)) && (Array.isArray(act)?act.includes(r.act.type):r.act.type===act) && !ruleProblems(r).length);
  return [
    {n:'가스 누출 대응', ok: has('gas', null, 'gas_off') && has('gas', null, 'alarm'), how:'가스 감지 센서 + 가스 차단장치 + 경보기 + 규칙 2개'},
    {n:'누수 대응', ok: has('leak', null, 'water_off'), how:'누수 감지 센서 + 급수 차단장치 + 규칙'},
    {n:'침입 감지', ok: S.rules.some(r => r.enabled && r.act.type==='alert' && r.conds.some(c => c.type==='motion') && !ruleProblems(r).length), how:'움직임 감지 센서 + 보안 알림 규칙'},
    {n:'현관 보안', ok: !!findDev('doorlock','entry') || !!findDev('cctv','entry'), how:'현관 스마트 도어록 또는 CCTV'}
  ];
}
function wasteList(){
  const W = [];
  S.devices.forEach(d => {
    const e = S.env[d.room], nm = devName(d);
    if(d.type==='light' && d.on && (!e.occ || S.away)) W.push(`사람이 없는 ${ROOMS[d.room].name}에 조명이 켜져 있어요`);
    else if(d.type==='light' && d.on && naturalLux(d.room)>=300) W.push(`밝은 낮인데 ${josa(nm,'이','가')} 켜져 있어요`);
    if(d.type==='tv' && d.on && !e.occ) W.push(`보는 사람이 없는데 ${josa(nm,'이','가')} 켜져 있어요`);
    if(d.type==='plug' && d.on && !e.occ) W.push(`사용하는 사람이 없는데 ${nm}에 연결된 컴퓨터가 켜져 있어요`);
    if(d.type==='aircon' && d.on && S.away) W.push(`외출 중인데 ${josa(nm,'이','가')} 켜져 있어요`);
    if(d.type==='aircon' && d.on && findDev('heater',d.room) && findDev('heater',d.room).on) W.push(`${ROOMS[d.room].name}에서 에어컨과 난방기가 동시에 켜져 있어요`);
    if(d.type==='fan' && d.on && e.hum<50) W.push(`습도가 낮은데 ${josa(nm,'이','가')} 켜져 있어요`);
  });
  return W;
}
function standbyW(){ return S.devices.reduce((a,d) => a + ((T(d).always!=null && T(d).kind!=='act') || (T(d).always==null && !d.on) ? devPower(d) : 0), 0); }
function runInspect(){
  const c = comps(); const sf = safetyStatus(); const W = wasteList();
  const ready = S.rules.filter(r => r.enabled && !ruleProblems(r).length).length;
  const notReady = S.rules.filter(r => ruleProblems(r).length);
  ui.inspect = `<div class="box" style="margin-top:8px">

    <div class="small" style="line-height:1.7">${[['센서',c.sensor],['무선 네트워크',c.net],['플랫폼',c.plat],['컨트롤러',c.ctrl]].map(x=>`${x[1]?'✅':'❌'} ${x[0]}`).join(' &nbsp; ')}</div>
    <b class="small">자동화 규칙</b><div class="small">작동 준비 완료 ${ready}개 / 전체 ${S.rules.length}개</div>
    ${notReady.length?`<div class="warnbox">${notReady.slice(0,3).map(r=>`"${esc(ruleTitle(r))}": ${esc(ruleProblems(r)[0].m)}`).join('<br>')}</div>`:''}
    <b class="small">안전 시스템</b><div class="small" style="line-height:1.7">${sf.map(x=>`${x.ok?'✅':'⬜'} ${x.n}${x.ok?'':` <span class="muted">(${x.how})</span>`}`).join('<br>')}</div>
    <b class="small">에너지</b><div class="small" style="line-height:1.7">지금 ${fmtW(totalPower())} · 대기·상시 전력 ${fmtW(standbyW())} · 누적 ${fmtWh(S.energy.wh)} · 자동화로 아낀 전력량(추정) ${fmtWh(S.energy.saved)}</div>

  S.inspectDone = true; update();

function roomDetail(rm){
  const R = ROOMS[rm];
  const metric = (label, types, f) => { const s = findSensor(rm, types); return s ? `<div class="li clickable" onclick="selectDev('${s.id}')"><span class="grow">${label}</span><b>${f(s.reading)}</b><span class="st ok">${T(s).name}</span></div>` : ''; };
  const devs = S.devices.filter(d => d.room===rm);
  const rows = metric('온도',['temp','th'],r=>r.temp+'℃') + metric('습도',['hum','th'],r=>r.hum+'%') + metric('밝기(조도)',['lux'],r=>r.lux+'lx')
    + metric('움직임·재실',['motion'],r=>r.motion?'움직임 감지':(r.occ?'사람 있음':'없음')) + metric('가스',['gas'],r=>r.gas?'⚠ 누출':'정상') + metric('누수',['leak'],r=>r.leak?'⚠ 누수':'정상');

function aiTips(){
  const T2 = [];
  const v = (rm, c) => platformValue(rm, c);
  ROOM_ORDER.forEach(rm => {
    const t = v(rm,'temp'), hm = v(rm,'hum');
    if(t!==undefined && t>=28 && !S.rules.some(r=>r.conds.some(c=>c.type==='temp'&&c.room===rm))) T2.push(`${ROOMS[rm].name}이 ${t}℃로 더워요. 온도 조건으로 냉방 자동화를 만들어 볼까요?`);
    if(hm!==undefined && hm>=75) T2.push(`${ROOMS[rm].name} 습도가 ${hm}%예요. 곰팡이가 생기기 쉬워요.`);
  });
  if(!S.devices.some(d=>d.type==='gas') && findDev('fridge','kitchen')) T2.push('주방에 가스 누출 감지 센서가 없어요. 안전을 위해 설치를 고려해 보세요.');
  const W = wasteList(); if(W.length) T2.push(W[0]+'.');
  if(!S.devices.some(d=>T(d).kind==='sensor'&&devReady(d))) T2.push('플랫폼에 등록된 센서가 없어서 분석할 데이터가 없어요.');
  return T2.slice(0,2);
}

function editRule(id){ const r = S.rules.find(x => x.id===id); ui.editor = JSON.parse(JSON.stringify({id:r.id, name:r.name, conds:r.conds, act:r.act})); renderRight(); }

function saveRule(){

  if(new Set(types).size!==types.length && e.conds.length>1 && e.conds[0].op===e.conds[1].op){ toast('같은 조건이 두 번 들어 있어요.','bad'); return; }
  if(e.id){ const r = S.rules.find(x => x.id===e.id); r.name = e.name; r.conds = e.conds; r.act = e.act; r.lastTrue = false; addLog(`📱 규칙 수정: ${ruleTitle(r)}`); }
  else { const r = {id:'r'+(S.rid++), name:e.name, conds:e.conds, act:e.act, enabled:true, fired:0, lastTrue:false}; S.rules.push(r); addLog(`📱 새 규칙을 플랫폼에 저장: ${ruleTitle(r)}`); }

    <div class="mfoot"><button onclick="closeModal()">닫기</button></div>`);

function forceConds(r){
  r.conds.forEach(c => {
    const e = c.room ? S.env[c.room] : null;
    switch(c.type){
      case 'temp': e.temp = c.op==='>=' ? c.val+2 : c.val-2; break;
      case 'hum': e.hum = Math.max(0, Math.min(100, c.op==='>=' ? c.val+8 : c.val-8)); break;
      case 'lux': {
        if(c.op==='<='){ S.time = 1320; const L = findDev('light', c.room); if(L && L.on){ L.on = false; } }
        else { S.time = 720; const cu = findDev('curtain', c.room); if(cu) cu.on = true; }
        break; }
      case 'motion': e.motionT = 2; e.occ = true; break;
      case 'presence': if(c.val==='yes'){ e.occ = true; e.motionT = 1; } else { e.occ = false; e.motionT = 0; } break;
      case 'away': S.away = c.val==='on'; break;
      case 'time': S.time = c.val==='night' ? 1320 : 720; break;
      case 'clock': S.time = Number(c.val); break;
      case 'gas': e.gasSrc = true; e.gas = Math.max(e.gas, 40); break;
      case 'leak': e.leakSrc = true; e.leak = Math.max(e.leak, 30); break;
    }
  });
  updateLux(); S.devices.forEach(readSensor);
}

function runFlow(id){
  const r = S.rules.find(x => x.id===id); if(!r) return;
  const wasLive = ui.liveRun; if(wasLive) livePause(); simPause(); if(ui.test) cancelTest();

  const steps = [
    ['센서 감지','센서','var(--sensor)'],['무선 네트워크로 전달','무선 네트워크','var(--net)'],['플랫폼 수신·관리','플랫폼','var(--plat)'],
    ['컨트롤러 규칙 적용','컨트롤러','var(--ctrl)'],['기기에 명령 전달','무선 네트워크','var(--net)'],['기기 작동','스마트 기기','#18794B'],['환경 변화','결과','#5E6B82']];
  openModal(`<h2>자동화 테스트</h2><div class="box soft small"><span style="color:#A3600A;font-weight:700">IF</span> ${esc(t.iff)} &nbsp; <span style="color:#18794B;font-weight:700">THEN</span> ${esc(t.then)}</div>
    <div class="flow">${steps.map((s,i)=>`<div class="fstep" id="fs${i}"><span class="n">${i+1}</span><div><b>${s[0]}</b><span class="who" style="background:${s[2]};color:#fff">${s[1]}</span><div class="msg" id="fm${i}">대기 중</div></div></div>`).join('')}</div>
    <div id="flowEnd"></div><div class="mfoot"><button onclick="closeModal()">닫기</button></div>`, true);
  const fail = (i, m) => { const el = $('#fs'+i); el.classList.add('on','fail'); $('#fm'+i).textContent = m;
    $('#flowEnd').innerHTML = `<div class="warnbox"><b>${i+1}단계에서 멈췄어요.</b> 이 부분을 고친 뒤 다시 테스트하세요.</div>`; addLog(`자동화 테스트 실패(${i+1}단계): ${m}`,'bad'); update(); };
  const okS = (i, m) => { const el = $('#fs'+i); el.classList.add('on','ok'); $('#fm'+i).textContent = m; };
  const seq = [];
  // 1. 센서
  seq.push(() => {
    if(!sc.length){ forceConds(r); okS(0, '센서가 필요 없는 조건이에요 (외출 모드·시간대는 플랫폼이 알고 있어요).'); return true; }
    const miss = sc.find((c,k) => !sensors[k]);
    if(miss){ fail(0, `${ROOMS[miss.room].name}에 ${CONDS[miss.type].sensors.map(x=>TYPES[x].name).join('/')}가 없어 ${CONDS[miss.type].label} 정보를 감지할 수 없어요.`); return false; }
    forceConds(r);
    okS(0, sensors.map(s => `${devName(s)}: ${sensorText(s)}`).join(' / ') + ' 감지');
    sensors.forEach(s => animDevToCloud(s, '#E8962A'));
    return true;
  });
  // 2. 네트워크
  seq.push(() => {
    if(!router()){ fail(1, '무선 공유기가 없어 데이터를 보낼 통신망이 없어요.'); return false; }
    if(S.netFault){ fail(1, '공유기 장애로 데이터가 전달되지 않아요. 네트워크 탭에서 복구하세요.'); return false; }
    for(const s of sensors){ const ns = netStatus(s); if(ns!=='ok'){ fail(1, ns==='none' ? `${josa(devName(s),'이','가')} 무선 네트워크에 연결되지 않았어요.` : `${devName(s)}: ${netErrReason(s)}`); return false; } }
    okS(1, sc.length ? `센서 → ${hub()?'허브 → ':''}공유기 → 플랫폼으로 데이터 전송` : '집 네트워크 정상'); return true;
  });
  // 3. 플랫폼
  seq.push(() => {
    for(const s of sensors){ if(!s.reg){ fail(2, `${josa(devName(s),'이','가')} 플랫폼에 등록되지 않아 데이터를 받지 못했어요.`); return false; } S.pdata[s.id] = {v:{...s.reading}, t:clockStr(S.time)}; }
    okS(2, sc.length ? `플랫폼이 ${sensors.map(s=>T(s).name).join(', ')} 데이터를 받아 저장했어요` : '플랫폼이 외출 모드·시간 정보를 확인했어요'); return true;
  });
  // 4. 컨트롤러 규칙
  seq.push(() => {
    if(!r.enabled){ fail(3, '스마트폰에서 이 규칙이 꺼져 있어요. 규칙을 켜세요.'); return false; }
    const bad = r.conds.find(c => !evalCond(c));
    if(bad){ fail(3, `조건 "${condText(bad)}"이(가) 맞지 않아요. 지금 값으로는 규칙이 실행되지 않아요.`); return false; }
    okS(3, `컨트롤러에서 설정한 규칙의 조건이 맞아요 → 동작 실행 결정${S.ctrl.paired?'':' (스마트폰은 연결 해제 상태지만 규칙은 플랫폼에 저장되어 있어 작동해요)'}`); return true;
  });
  // 5. 명령 전달
  seq.push(() => {
    if(r.act.type==='alert'){ if(!S.ctrl.paired){ fail(4, '알림을 받을 스마트폰이 플랫폼에 연결되지 않았어요.'); return false; } okS(4, '플랫폼 → 인터넷 → 스마트폰으로 알림 전송'); animPath([CLOUD, PHONE], '#E5484D'); return true; }
    const tg = actionTargets(r.act);
    if(!tg.length){ fail(4, `동작할 ${ACTIONS[r.act.type].devs.map(x=>TYPES[x].name).join('/')}가 설치되지 않았어요.`); return false; }
    const ready = tg.filter(devReady);
    if(!ready.length){ const d = tg[0]; const ns = netStatus(d); fail(4, ns!=='ok' ? `${josa(devName(d),'이','가')} 네트워크에 ${ns==='none'?'연결되지 않았어요':'닿지 않아요(연결 오류)'}.` : `${josa(devName(d),'이','가')} 플랫폼에 등록되지 않아 명령을 받을 수 없어요.`); return false; }
    ready.forEach(d => animPath(cmdPath(d), '#10A39A'));
    okS(4, `플랫폼 → 공유기 → ${ready.map(devName).join(', ')}에 명령 전송` + (ready.length<tg.length?` (준비 안 된 기기 ${tg.length-ready.length}대는 제외)`:'')); return true;
  });
  // 6. 기기 작동
  seq.push(() => {
    execAction(r, true); r.fired = (r.fired||0)+1; r.lastAt = clockStr(S.time); r.lastTrue = true; S.autoTestOk++;
    if(r.act.type==='alert') okS(5, '스마트폰에 보안 알림이 도착했어요 🔔');
    else okS(5, actionTargets(r.act).filter(devReady).map(d => `${devName(d)}: ${stateLabel(d)}`).join(', '));
    update(); return true;
  });
  // 7. 결과
  seq.push(() => {
    okS(6, effectText(r));
    $('#flowEnd').innerHTML = `<div class="okbox"><b>성공!</b> 네 가지 구성 요소가 모두 작동했어요. 실제 상황은 6단계 운영에서 저절로 일어나요.</div>`;
    $('#modal .mfoot').innerHTML = `<button class="primary" onclick="closeModal()">확인</button>`;
    addLog(`자동화 테스트 성공: ${ruleTitle(r)}`); update(); return true;
  });
  let i = 0;
  const go = () => { if(!$('#modalOv').classList.contains('show')) return; if(!seq[i]()) return; i++; if(i<seq.length) ui.flowTimer = setTimeout(go, 650); };
  ui.flowTimer = setTimeout(go, 400);
}
