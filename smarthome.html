  ROOM_ORDER.forEach(rm => h += `<g>${roomSVG(rm)}</g>`);
  S.devices.forEach(d => h += devSVG(d));
  S = keep; ROOM_ORDER = keepOrder; applyRoomNames();
  $('#titleHouse').innerHTML = h.replace(/class="room-hit"/g,'class="room-hit" style="pointer-events:none"').replace(/data-go="shop"/g,'');
}
function openJoin(){
  $('#jSid').value = ''; $('#jNick').value = ''; $('#jErr').style.display = 'none';
  $('#jWarn').style.display = loadSaved() ? '' : 'none';
  $('#joinOv').classList.add('show');
  setTimeout(() => $('#jSid').focus(), 50);
}
function submitJoin(){
  const sid = $('#jSid').value.trim(), nick = $('#jNick').value.trim();
  const err = m => { $('#jErr').textContent = m; $('#jErr').style.display = ''; };
  if(!/^\d{4}$/.test(sid)) return err('학번은 숫자 4자리로 입력하세요. (예: 2105)');
  if(!nick) return err('닉네임을 입력하세요.');
  if(nick.length>8) return err('닉네임은 8글자까지 쓸 수 있어요.');
  $('#joinOv').classList.remove('show');
  newGame(sid, nick);
}
function beginGame(state){
  S = state;
  if(!S.built) S.built = []; if(!S.sec) S.sec = {pw:false, fw:false}; if(!S.up) S.up = {lte:false};
  ROOM_ORDER = BASE_ROOMS.concat(S.built.filter(r => ROOMS[r]));
  ROOM_ORDER.forEach(rm => { if(!S.env[rm]) S.env[rm] = freshEnv()[rm]; });
  ui.liveRun = false; S.jam = false;
  applyRoomNames(); initHouse(); vbCur = vbFull();
  if(S.money==null) S.money = ECON.start;
  ['classify','quiz','match','missions','m4','energy','badges','flags','game'].forEach(k => { if(!S[k]) S[k] = newState('basic')[k]; });
  ui.sel = null; ui.selRoom = null; ui.pending = null; ui.editor = null; ui.inspect = null; ui.test = null; ui.quizShow = false;
  resetHouseCache();
  $('#start').classList.remove('show');
  ui.tab = 'dev';
  zoomTo(null);
  update();
}
function newGame(sid, nick){
  simPause();
  ROOM_ORDER = BASE_ROOMS.slice();
  const st = newState('basic');
  st.player = {sid, nick}; st.step = 1;
  S = st; loadScenario('normal');
  beginGame(S);
  toast(`${nick} 설계자님, 환영해요! 먼저 스마트 홈이 무엇인지 살펴보세요.`);
}
function confirmReset(){
  openModal(`<h2>처음부터 시작할까요?</h2><p>설치한 기기, 연결, 자동화 규칙, 미션 기록이 모두 지워져요. 이 작업은 되돌릴 수 없어요.</p>
    <div class="mfoot"><button onclick="closeModal()">취소</button><button class="primary" style="background:var(--bad);border-color:var(--bad)" onclick="doReset()">모두 지우고 처음부터</button></div>`);
}
function doReset(){
  closeModal(); simPause(); cancelTest();
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  S = null; showIntro();
}
function confirmSimReset(){
  simPause(); cancelTest();
  loadScenario(S.scen);
  toast('센서 값과 기기 작동 상태를 처음으로 되돌렸어요 (설치·연결·규칙은 그대로예요).');
  update();
}

function bindEvents(){
  $('#btnNewBasic').onclick = openJoin;
  $('#mHint').onclick = () => showHint(0);
  $('#jCancel').onclick = () => $('#joinOv').classList.remove('show');
  $('#jGo').onclick = submitJoin;
  ['#jSid','#jNick'].forEach(q => $(q).addEventListener('keydown', e => { if(e.key==='Enter') submitJoin(); }));
  $('#jSid').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,4); });
  $('#btnContinue').onclick = () => { const sv = loadSaved(); if(sv) { beginGame(sv); toast('저장된 스마트 홈을 불러왔어요','good'); } };
  $('#btnSave').onclick = () => saveNow(false);
  $('#btnReset').onclick = confirmReset;
  $('#zoomOutBig').onclick = () => zoomTo(null);
  $('#btnZoomMode').onclick = () => { ui.zoomOnClick = !ui.zoomOnClick; $('#btnZoomMode').textContent = '방 클릭 시 확대: '+(ui.zoomOnClick?'켬':'끔'); if(!ui.zoomOnClick) zoomTo(null); };
  $('#house').addEventListener('dblclick', e => { if(ui.zoom){ e.preventDefault(); zoomTo(null); } });
  $('#house').addEventListener('contextmenu', e => { if(ui.zoom){ e.preventDefault(); zoomTo(null); } });
  $('#btnNetView').onclick = toggleNetView;
  $('#btnPlatView').onclick = togglePlatView;
  $('#pendingCancel').onclick = () => setPending(null);
  $('#prevStep').onclick = () => goStep(Math.max(1, S.step-1));
  $('#nextStep').onclick = nextStep;
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));
  $('#tgL').onclick = () => { const m = $('#main'); if(window.innerWidth<=860){ m.classList.toggle('showL'); m.classList.remove('showR'); } else m.classList.toggle('hideL'); syncToggles(); setTimeout(() => ui.zoom && zoomTo(ui.zoom), 50); };
  $('#tgR').onclick = () => { const m = $('#main'); if(window.innerWidth<=860){ m.classList.toggle('showR'); m.classList.remove('showL'); } else m.classList.toggle('hideR'); syncToggles(); setTimeout(() => ui.zoom && zoomTo(ui.zoom), 50); };
  $('#mfold').onclick = () => { ui.dockFold = !ui.dockFold; renderMission(); if(ui.tab==='phone') fitPhone(); };
  const sp = $('#msplit');
  sp.addEventListener('pointerdown', e => {
    e.preventDefault(); sp.setPointerCapture(e.pointerId); ui.dockFold = false;
    const y0 = e.clientY, h0 = $('#mdock').getBoundingClientRect().height;
    const mv = ev => { ui.dockH = h0 + (ev.clientY - y0); applyDockH(); $('#mdock').classList.remove('fold'); };
    const up = () => { sp.removeEventListener('pointermove', mv); sp.removeEventListener('pointerup', up); renderMission(); if(ui.tab==='phone') fitPhone(); };
    sp.addEventListener('pointermove', mv); sp.addEventListener('pointerup', up);
  });
  sp.addEventListener('dblclick', () => { ui.dockH = null; ui.dockFold = false; renderMission(); });
  $('#modalOv').addEventListener('click', e => { if(e.target.id==='modalOv') closeModal(); });

  // 집 그림 클릭
  $('#house').addEventListener('click', e => {
    if(!S) return;
    const go = e.target.closest('[data-go]');
    if(go){ if(go.dataset.go==='shop') openShop(); else { setTab(go.dataset.go); openRightIfHidden(); } return; }
    const dv = e.target.closest('[data-dev]');
    if(dv && !ui.pending){ selectDev(dv.dataset.dev); return; }
    const p = svgPoint(e.clientX, e.clientY); const rm = roomAt(p.x, p.y);
    if(!rm){ if(ui.zoom) zoomTo(null); return; }
    if(ui.pending){ installDev(ui.pending, rm); $('#pendingTip').style.display = 'none'; return; }
    ui.selRoom = rm; ui.sel = null; ui.tab = 'dev';
    if(!S.visited.includes(rm)) S.visited.push(rm);
    if(ui.zoomOnClick){ if(ui.zoom===rm) zoomTo(null); else zoomTo(rm); }
    openRightIfHidden(); update();
  });

  // 팔레트: 클릭 설치 / 끌어다 놓기
  $('#palette').addEventListener('click', e => { const it = e.target.closest('.pitem'); if(it) setPending(it.dataset.type); });
  $('#palette').addEventListener('dragstart', e => {
    const it = e.target.closest('.pitem'); if(!it) return;
    if(it.dataset.locked){ e.preventDefault(); return; }
    e.dataTransfer.setData('text/plain', it.dataset.type); e.dataTransfer.effectAllowed = 'copy';
  });
  const stage = $('#stage');
  stage.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; const p = svgPoint(e.clientX, e.clientY); showDrop(roomAt(p.x, p.y)); });
  stage.addEventListener('dragleave', e => { if(!stage.contains(e.relatedTarget)) showDrop(null); });
  stage.addEventListener('drop', e => {
    e.preventDefault(); showDrop(null);
    const type = e.dataTransfer.getData('text/plain'); if(!TYPES[type]) return;
    const p = svgPoint(e.clientX, e.clientY); const rm = roomAt(p.x, p.y);
    if(!rm){ toast('방 안에 놓아야 설치돼요.','bad'); return; }
    installDev(type, rm);
  });

  document.addEventListener('keydown', e => {
    const typing = /INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
    if(S && !typing && (e.key==='Delete' || e.key==='Backspace') && ui.sel && !$('#modalOv').classList.contains('show')){ e.preventDefault(); removeDev(ui.sel); return; }
    if(S && !typing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && ui.lastRemoved){ e.preventDefault(); undoRemove(); return; }
    if(e.key!=='Escape') return;
    if($('#modalOv').classList.contains('show')){ closeModal(); return; }
    if(ui.pending){ setPending(null); return; }
    if(ui.zoom) zoomTo(null);
  });
  window.addEventListener('resize', () => { syncToggles(); if(S){ applyDockH(); if(ui.tab==='phone') fitPhone(); } if(ui.zoom) zoomTo(ui.zoom); });
  window.addEventListener('beforeunload', () => { if(S) saveNow(true); });
}

function openShop(){
  if(S.step!==6){ toast('집 확장은 6단계 [스마트 홈 운영]에서 돈을 모아 할 수 있어요.'); return; }
  unfoldDock(); setTimeout(() => jumpTo('jShop'), 80); return;
  setTimeout(() => { const h = [...document.querySelectorAll('#mbody h3')].find(x => x.textContent.includes('확장 상점')); if(h) h.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
}

/* ---------- 시작 ---------- */
initHouse();
bindEvents();
S = null;
showIntro();
// 시작 화면 뒤에 보일 기본 집
(function(){ const tmp = newState('basic'); S = tmp; loadScenario('normal'); renderHouse(); S = null; })();
syncToggles();
requestAnimationFrame(pkLoop);
</script>
</body>
</html>
